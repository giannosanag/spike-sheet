<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Spike Sheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Spike Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Roboto+Condensed:wght@600..800&display=swap">
<style>
/* Sportswear-app look: black on white, heavy condensed caps, pills, one volt highlight. */
:root{
  --bg:#FFFFFF; --soft:#F5F5F5; --soft2:#EDEDED; --ink:#111111; --muted:#707072; --faint:#9E9EA0; --line:#E5E5E5;
  --btn:#111111; --btn-ink:#FFFFFF; --volt:#D7FF3A; --volt-ink:#111111; --hi:#111111;
  --pos:#128A43; --neg:#D30005;
  --head:"Archivo","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000000; --soft:#161616; --soft2:#222222; --ink:#FFFFFF; --muted:#9E9EA0; --faint:#6B6B6D; --line:#2A2A2A;
  --btn:#FFFFFF; --btn-ink:#111111; --volt:#D7FF3A; --volt-ink:#111111; --hi:#D7FF3A;
  --pos:#3DDC84; --neg:#FF5A5F;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --soft:#161616; --soft2:#222222; --ink:#FFFFFF; --muted:#9E9EA0; --faint:#6B6B6D; --line:#2A2A2A;
  --btn:#FFFFFF; --btn-ink:#111111; --volt:#D7FF3A; --volt-ink:#111111; --hi:#D7FF3A;
  --pos:#3DDC84; --neg:#FF5A5F;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);padding-inline:16px;padding-block:0 110px;-webkit-tap-highlight-color:transparent}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:10px 18px 10px 14px;border-radius:999px;background:var(--btn);color:var(--btn-ink);box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:left;font-weight:700;font-size:15px;line-height:1.1}
.fab small{display:block;font-size:11px;font-weight:500;opacity:.75;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab-i{font-size:22px;line-height:1}
.fab:active{transform:scale(.96)}
/* every button answers the finger, like a native app */
.btn,.court button,.mitem,.seg button,.setsel button,.tabs button,.brand,.xdel,.tagbar button,.lnk{transition:transform .08s,opacity .08s}
.btn:active,.court button:active,.xdel:active,.tagbar button:active{transform:scale(.97)}
.mitem:active,.seg button:active,.setsel button:active,.tabs button:active,.brand:active,.lnk:active{opacity:.6}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
/* no double-tap zoom: quick repeated taps on a stat must count, not zoom the page */
html,body{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{opacity:.3;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.big,.stat .n,.tile b,.pline b,.clock,td,.pbp .sc,.mitem .p{font-variant-numeric:tabular-nums}
/* condensed caps display */
.brand,h2,.big,.stat .n,.tile b,.pline b,.mitem .p,.pname,.team .nm,.jersey{font-family:var(--head);font-stretch:62%;font-weight:800;text-transform:uppercase;letter-spacing:-.005em}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-size:28px;line-height:1}
.brand .ball{width:12px;height:12px;border-radius:50%;background:var(--volt);box-shadow:0 0 0 2px var(--ink)}
.brand em{font-style:normal}
.tabs{display:flex;gap:18px}
.tabs button{font-size:15px;font-weight:500;padding:6px 0;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.note{font-size:13px;color:var(--muted)}
.kicker{font-size:13px;font-weight:500;color:var(--muted)}
h2{font-size:34px;line-height:.95;margin:0;text-wrap:balance;overflow-wrap:break-word}
h3{font-size:16px;font-weight:600;margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.panel{background:var(--soft);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.panel form{margin:0;width:100%}

label{font-size:13px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.btn{font-weight:500;font-size:15px;padding:14px 22px;border-radius:999px;text-align:center;border:1.5px solid var(--line);background:var(--bg)}
.btn-or{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn-dk{background:var(--bg)}
.btn-del{color:var(--neg)}
.btn-del.armed{background:var(--neg);color:#fff;border-color:var(--neg)}

/* score */
.bug{background:var(--soft);border-radius:20px;overflow:hidden}
.bug-top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 0;gap:8px}
.bug-top .comp{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setflag{font-size:12px;font-weight:600;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:999px;white-space:nowrap}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 18px 14px}
.team{display:flex;flex-direction:column;gap:4px;min-width:0}
.team.away{text-align:right;align-items:flex-end}
.team .nm{font-size:22px;line-height:1;overflow-wrap:anywhere}.team .nm.long{font-size:16px}.team .nm.xl{font-size:14px}@media (max-width:360px){.team .nm.long{font-size:13px}.team .nm.xl{font-size:11px}}
.team .sw{font-size:12px;color:var(--muted)}
.big{display:flex;align-items:center;gap:8px;font-size:84px;line-height:.85}
.big i{font-style:normal;color:var(--faint);font-size:50px}
.big span{color:var(--faint)} .big .hi{color:var(--ink)}
.pips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 18px 14px}
.pip{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.pip.w{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}.pip.l{color:var(--muted)}
.plus{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.plus button{padding:16px 10px;border-radius:999px;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plus .us{background:var(--btn);color:var(--btn-ink)}
.plus .them{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.plus button:active{transform:scale(.97)}
.bug-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 12px;gap:8px;flex-wrap:wrap}
.setsel{display:flex;gap:4px;align-items:center}
.setsel button{font-size:14px;font-weight:600;width:40px;height:40px;border-radius:50%;color:var(--muted)}
.setsel button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lnk{font-size:14px;font-weight:600;padding:12px 6px;text-decoration:underline;text-underline-offset:3px}

/* player */
.player{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:4px 0}
.jersey{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--volt);color:var(--volt-ink)}
.pinfo{min-width:0}
.pname{font-size:26px;line-height:1;overflow-wrap:anywhere}.pname.long{font-size:22px}.pname.xl{font-size:19px}
.pline{display:flex;gap:22px;margin-top:8px;flex-wrap:wrap}
.pline div{display:flex;flex-direction:column}
.pline b{font-size:30px;line-height:.95}
.pline span{font-size:12px;color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.court{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:16px;background:var(--soft)}
.court.is-on{background:var(--volt);color:var(--volt-ink)}
.cst{min-width:0}.cst b{display:block;font-family:var(--head);font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:24px;line-height:1}
.cst>span{font-size:13px;opacity:.75}#clock{font-variant-numeric:tabular-nums}
.court button{flex:none;font-size:15px;font-weight:600;padding:12px 18px;border-radius:999px;background:var(--volt);color:var(--volt-ink)}
.court.is-on button{background:var(--volt-ink);color:var(--volt)}
.choose{gap:12px}.choose p{margin:0}
.dot-ok{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pos);margin-right:7px;vertical-align:1px}
#syncnote .lnk{padding:10px 2px;margin:-10px 0;font-size:13px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pos);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}

/* stat pad */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad-err,.pad-play{grid-template-columns:repeat(5,1fr)}.pad-err .stat,.pad-play .stat{padding-inline:2px}
.stat{background:var(--soft);border-radius:16px;min-height:88px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .15s,transform .08s}
.stat:active{transform:scale(.95)}.stat:disabled{opacity:.3}
.stat .n{font-size:36px;line-height:.9}
.stat .l{font-size:13px;font-weight:600;line-height:1.15;text-align:center}
.stat .s{font-size:11px;color:var(--muted);line-height:1.1;text-align:center}
.stat.err .n{color:var(--neg)}
.stat.flash{background:var(--volt);color:var(--volt-ink)}
.stat.flash .s{color:var(--volt-ink)}
.undo{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.undo span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo .btn{padding:9px 18px;font-size:14px}

/* play by play */
.pbp{display:flex;flex-direction:column}
.pbp div,.pbp button{text-align:left;width:100%;display:grid;grid-template-columns:44px 56px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.pbp .st{font-size:12px;color:var(--faint)}
.pbp .sc{font-weight:600}
.pbp .ev.pt{font-weight:600} .pbp .ev.err{color:var(--neg)} .pbp .ev.sub{color:var(--pos);font-weight:500} .pbp .ev.team{color:var(--muted)}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 8px;text-align:right;white-space:nowrap;font-size:14px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);padding-left:0}
thead th{font-size:12px;font-weight:500;color:var(--muted);border-bottom:1.5px solid var(--ink)}
tbody td{border-top:1px solid var(--line)}
tbody tr:first-child td{border-top:0}
tr.sum td{font-weight:700;border-top:1.5px solid var(--ink)}
td.k{font-weight:700}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pct{display:flex;flex-direction:column;gap:14px;background:var(--soft);border-radius:16px;padding:16px}
.pr{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:6px 12px}
.pr .pl{font-weight:600}.pr .pl small{font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.pr b{font-family:var(--head);font-stretch:62%;font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.pbar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--soft2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--hi)}
.setc{background:var(--soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.setc-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.setc-h b{font-family:var(--head);font-stretch:62%;font-weight:800;font-size:22px;text-transform:uppercase}
.setc-h span{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.setc p{margin:0;font-size:14px;line-height:1.35}.setc .m{color:var(--muted)}
details.more summary{cursor:pointer;font-weight:600;padding:6px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:' ›'}details.more[open] summary::after{content:' ⌄'}
/* long team names on a small phone: the switch wraps onto two lines instead of pushing the page sideways
   (22px corners: round on one line, still neat on two) */
.seg{display:inline-flex;background:var(--soft);border-radius:22px;padding:3px;max-width:100%;flex-wrap:wrap}
.seg button{font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.tagbar .more input.sm{flex:0 1 80px;text-align:center}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickteam{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:16px 20px;border-radius:18px}
.pickteam b{font-size:18px}.pickteam small{font-size:13px;opacity:.75}
.pick button{padding:18px 8px;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-weight:700;overflow-wrap:anywhere}
.pick button small{display:block;font-size:12px;font-weight:500;margin-top:4px;opacity:.7}
.pick button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
/* New match: our team and home/away are questions, as big as "Team or player?" */
.qh{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:10px}
label.qh{margin-bottom:0;gap:8px}
.ours input{border:2px solid var(--ink);font-weight:600}
.ours .note{font-weight:400}
/* time-out: the whole screen waits for Resume play */
.freeze{position:fixed;inset:0;z-index:11;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.freeze h2{font-size:64px}
.freeze .fz-team{font-size:20px;font-weight:700}
.freeze .fz-clock{font-family:var(--head);font-stretch:62%;font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.freeze .btn{font-size:18px;font-weight:700;padding:20px}
.freeze .btn-or{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
/* team flow: who serves, season leaders */
.srv{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--volt);box-shadow:0 0 0 1.5px var(--ink);margin-right:6px;vertical-align:2px}
.serveq{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:600}
.leads{display:flex;flex-direction:column}
.lead{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.lead .lt{font-size:13px;color:var(--muted)}
.lead .lp{display:flex;flex-wrap:wrap;gap:4px 14px}
.lead button{font-size:14px;text-align:left;padding:2px 0}.lead b{font-variant-numeric:tabular-nums;margin-left:3px}
/* court mode (a live team match): score, +1, every stat and Undo / Time-out / End set on one phone
   screen with no scrolling during a rally */
body.playing>.wrap{gap:10px}
body.playing header{padding-block:10px 0;gap:8px}
body.playing .brand{font-size:20px}
body.playing .tabs{gap:12px}body.playing .tabs button{font-size:14px;padding:4px 0}
/* the date line goes: the set number is on the End set button, the sets played on the pips */
body.playing .bug-top{display:none}
body.playing .score{padding-top:10px}
body.playing .serveq{flex-wrap:nowrap}
body.playing .serveq .seg{flex-wrap:nowrap;min-width:0}
body.playing .serveq .seg button{max-width:9.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.playing #syncnote:not(.warn){display:none}
body.playing #app{gap:10px}
body.playing .bug-top{padding-top:10px}
body.playing .score{padding:4px 18px 6px}
body.playing .big{font-size:56px}body.playing .big i{font-size:34px}
body.playing .pips{padding-bottom:8px}
body.playing .plus{padding-bottom:10px}
body.playing .plus button{padding:13px 10px}
body.playing .sec{gap:5px}
body.playing .sec h3{font-size:12px;font-weight:600;color:var(--muted)}
body.playing .stat{min-height:60px;padding:7px 2px 6px;border-radius:14px}
body.playing .stat .n{font-size:24px}
.padzone{display:flex;flex-direction:column;gap:10px}
.pad-n6{grid-template-columns:repeat(6,minmax(0,1fr))}.pad-n6 .stat{padding-inline:1px}.pad-n6 .stat .l{font-size:11.5px}.pad-n6 .stat .s{font-size:10px}
.tagbar.who .nums button.hint{box-shadow:inset 0 0 0 3px var(--volt)}
.acts{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px}
.act.who{display:flex;flex-direction:column;justify-content:center;align-items:center}
.act.who small{font-size:11px;font-weight:500;opacity:.75}
.act.who.on{background:var(--volt);color:var(--volt-ink)}
.act{min-height:50px;border-radius:14px;padding:8px;background:var(--soft);font-weight:600;font-size:14px;line-height:1.15}
.act.undo{display:flex;align-items:center;gap:8px;text-align:left;background:var(--btn);color:var(--btn-ink);min-width:0}
.act.undo>span:last-child{min-width:0}.act.undo .fab-i{flex:none}
.act.undo small{display:block;font-size:11px;font-weight:500;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act:active{transform:scale(.97)}
.act:disabled{opacity:.35}
@media (min-height:800px){body.playing .stat{min-height:72px}body.playing .stat .n{font-size:28px}body.playing .big{font-size:64px}}
/* iPhone SE size: a little tighter, so the four rows and the action row still fit */
@media (max-height:700px){body.playing .stat{min-height:54px;padding-block:5px 4px}body.playing .padzone{gap:7px}body.playing .sec{gap:4px}}
/* very small phones: the second line on each stat button goes, so the rally area still fits */
@media (max-height:600px){body.playing .stat .s{display:none}body.playing .stat{min-height:48px}body.playing .sec{gap:3px}body.playing .padzone{gap:8px}}
/* a phone on its side: score on the left, every stat on the right, for two thumbs */
@media (orientation:landscape) and (max-height:540px){
  body.playing>.wrap{max-width:none}
  body.playing #app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);column-gap:14px;row-gap:10px;align-items:start}
  body.playing #app>*{grid-column:1/-1}
  body.playing #app>.bug:first-of-type{grid-column:1;grid-row:1}
  body.playing #app>.serveq{grid-column:1;grid-row:2}
  body.playing #app>.padzone{grid-column:2;grid-row:1/span 3}
  /* the number bar opens over the score column, so the stats on the right stay free */
  body.playing .tagbar{right:auto;width:calc(42% - 8px);max-width:none;margin:0;border-radius:0 20px 0 0}
  body.playing .tagbar .nums{max-height:56vh}
  body.playing .tagbar.who .nums button{height:44px}
}
/* the court: net on top, front row IV III II, back row V VI I */
.field{background:var(--soft);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px}
.field .net{height:4px;border-radius:2px;background:var(--ink);margin:0 6px}
.field .six{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.field .six button{position:relative;background:var(--bg);border-radius:14px;min-height:52px;font-weight:800;font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-variant-numeric:tabular-nums}
.field .six button small{font-size:11px;font-weight:500;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.field .six button .srv{position:absolute;top:7px;left:8px;margin:0}

.lunums{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}

.lunums button small{display:block;font-size:10px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;color:var(--muted)}
.lunums .used{opacity:.4}
/* the number bar with a line-up: the six on court first, as they stand */
.tagbar .nums .court6{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-bottom:6px;margin-bottom:2px;border-bottom:1px solid var(--faint)}
/* a phone on its side: the time-out screen scrolls and shrinks instead of cutting off its buttons */
.freeze{overflow-y:auto;justify-content:safe center}
@media (max-height:480px){.freeze{gap:8px}.freeze h2,.freeze .fz-clock{font-size:40px}.freeze .btn{padding:14px}}
/* a pull-down at the top must not reload the page in the middle of a match */
html,body{overscroll-behavior-y:contain}
/* no sideways jump of the column on a computer when a page starts to scroll */
html{scrollbar-gutter:stable}
/* landscape iPhone: buttons clear of the notch and the rounded corners */
.tagbar{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
/* keyboard focus shows on the dark bars too */
.tagbar :focus-visible{outline-color:var(--volt)}
/* a mouse gets a hover, not only the press */
@media (hover:hover){.btn:hover,.stat:hover,.mitem:hover,.tagbar button:hover,.court button:hover,.plus button:hover,.pick button:hover{filter:brightness(.92)}}
/* tablet / computer: bars, Undo and the time-out screen stay with the 560 px column, not the window edges */
.freeze>*{width:100%;max-width:560px;margin-inline:auto}
@media (min-width:600px){
  .tagbar{max-width:592px;margin-inline:auto;border-radius:20px 20px 0 0}
  .fab{right:max(16px, calc(50% - 280px))}
}
@media (max-width:599px){.fab{right:max(16px, env(safe-area-inset-right, 0px))}}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar{fill:var(--muted)}.chart .bar.sel{fill:var(--hi)}
.chart .base{stroke:var(--line);stroke-width:1}
.chart text{font:500 10px var(--font);fill:var(--muted)}.chart text.v{font-weight:700;fill:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}
.chart-d{font-size:14px;min-height:20px}
.tile{background:var(--soft);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile b{font-size:36px;line-height:.9}
.tile span{font-size:12px;font-weight:500;line-height:1.25}
.tile em{font-style:normal;font-size:11px;color:var(--muted);line-height:1.25}
.tile.hero{background:var(--ink);color:var(--bg)}
.tile.hero em{color:var(--faint)}

.stints{display:flex;flex-direction:column}

.stint b{font-weight:700}

.mlist{display:flex;flex-direction:column}

.mitem .d{font-size:12px;color:var(--muted)}

.mitem .p{text-align:right;font-size:28px;line-height:.9}
.mitem .p small{display:block;font:500 10px var(--font);color:var(--faint);text-transform:none;letter-spacing:0}
.empty{color:var(--muted);padding:12px 0;text-align:center}
.check{flex-direction:row!important;align-items:center;gap:10px;color:var(--ink)!important;font-size:15px!important}
.check input{width:22px;height:22px;accent-color:var(--ink)}

/* a message must never sit on, or take the tap of, a number in an open bar */
.toast{pointer-events:none}
body:has(.tagbar) .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
textarea{width:100%;height:150px;background:var(--soft);color:var(--ink);border:0;border-radius:12px;font:14px var(--font);padding:12px}
/* phone fit: nested wraps must fill, never grow to their content */
.wrap .wrap{margin:0;width:100%;max-width:none;min-width:0}
.sec,.tbl,.panel,.bug,.player{min-width:0;max-width:100%}
.row>*{min-width:0}
input,select{min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:48px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
/* who passed to the player */
.tagbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--ink);color:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -8px 24px rgba(0,0,0,.25)}
.tagbar .q{font-size:14px;font-weight:600}
.tagbar .nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:42vh;overflow-y:auto}
.tagbar button{height:44px;border-radius:12px;background:var(--bg);color:var(--ink);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.tagbar .more{display:flex;gap:6px}
.tagbar .more input{flex:1;height:44px;min-width:0;background:transparent;color:var(--bg);border:1.5px solid var(--faint);border-radius:12px;padding:0 12px;font-size:16px}
.tagbar .more input::placeholder{color:var(--faint)}
.tagbar .more button{padding:0 16px;font-size:15px}
.tagbar.who .nums{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.tagbar.who .nums button{height:54px;line-height:1.05}
.tagbar.who .nums small{display:block;font-size:10px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.tagbar.who .nums .skip{padding:0 6px}
.roster{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:58px minmax(0,1fr) 98px auto;gap:6px}
.rrow .t-pos{font-size:14px;padding:12px 6px;color:var(--ink)}
.rrow .rm{padding:0 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
@media (max-width:440px){.tabs{gap:14px}.brand{font-size:24px}}
.tagbar .two{display:flex;gap:6px}.tagbar .two button{flex:1;font-size:15px}

@media (max-width:340px){:root[lang="el"] .stat .l{font-size:11px}}

@media (max-width:380px){:root[lang="el"] body.playing .tabs{gap:8px}:root[lang="el"] .act.undo .fab-i{display:none}}

:root[lang="el"] .rrow .t-pos{font-size:13px;padding-inline:2px}
@media (prefers-reduced-motion:reduce){.stat,.live-dot{animation:none;transition:none}}

async function keepAwake(){ try{ if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', ()=>wake=null); } }catch(e){} }
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState !== 'visible'){ S.hiddenAt = Date.now(); return; }
  if (!S.activeId) return;
  keepAwake();
  if (S.hiddenAt && idleLong() && !S.choose){ S.choose = true; S.view = 'live'; render(); window.scrollTo(0,0); }
});
const pName = () => S.player.name || L('Player|name');
// mid-sentence: the name, or "the player" (no he/she anywhere)
const pWho = () => esc(S.player.name || L('the player'));
const pWhose = () => S.player.name ? L("{name}'s", {name:esc(S.player.name)}) : L("the player's");
const homeName = m => m.home || L('Us');
// a score or the teams in the hall's order: away, the home team (the opponent) first, as on the scoreboard
const ordS = (m, us, them) => m.away ? them + '–' + us : us + '–' + them;
const vsLine = m => m.away ? esc(m.opp) + ' ' + L('vs') + ' ' + esc(homeName(m)) : esc(homeName(m)) + ' ' + L('vs') + ' ' + esc(m.opp);
// A stat's name in a sentence ("Serve error", "Spike")
const statName = k => { const s = BYK[k]; return L(s.full || (s.g === 'err' ? s.l + ' error' : s.l)); };
// W / L as a letter on a result badge
const resLetter = r => r === 'W' ? L('W') : r === 'L' ? L('L') : '–';
// "1 match" / "3 matches" in the chosen language
const nL = (n, one, many) => L(n === 1 ? one : many, {n});
function evLabel(e, m){
  if (e.late) return {t:L('Score typed in'), c:'team'};
  if (e.k === 'to') return {t:L('Time-out {team}', {team:e.side === 'us' ? homeName(m) : (m.opp||L('them'))}), c:'sub'};
  if (BYK[e.k]) return {t: statName(e.k) + (e.from ? ' · ' + L('pass from {n}', {n:e.from}) : '') + whoTxt(e, m) + (e.s ? ' · ' + L('set by #{n}', {n:e.s}) : ''), c: BYK[e.k].g==='play' || BYK[e.k].g==='rec' ? '' : BYK[e.k].g};
  if (e.k === 'us') return {t:L('Point {team}', {team:homeName(m)}), c:'team'};
  if (e.k === 'them') return {t:L('Point {team}', {team:m.opp||L('them')}), c:'team'};
  if (e.k === 'lineup') return {t: L('Line-up') + ': ' + e.pos.map(n => '#' + n).join(' '), c:'sub'};
  if (e.k === 'sub') return {t: L('Sub: #{a} in for #{b}', {a:e.in, b:e.out}), c:'sub'};
  if (e.k === 'on') return {t: L('{name} on court', {name:pName()}), c:'sub'};
  if (e.k === 'off') return {t: L('{name} to the bench', {name:pName()}), c:'sub'};
  return {t:e.k, c:''};
}

/* ---------- actions ---------- */
function pickSlot(k){ S.slot = k; LS.set('ss.slot', k); }
// "25-20, 22-25" -> [[25,20],[22,25]]; null when something typed is not a score
function parseScores(t){
  const parts = String(t||'').split(/[,;\s]+/).filter(Boolean);
  const out = parts.map(p => { const x = p.match(/^(\d{1,2})[-–:./](\d{1,2})$/); return x ? [+x[1], +x[2]] : null; });
  return out.every(Boolean) ? out : null;
}
// Points that were missed (arrived late, or a gap): only the score, marked `late` with one batch id,
// so they carry no stats, no +/- and no court time, and one Undo takes the whole batch back.
function pushLate(m, set, us, them){
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  for (let i = 0; i < us; i++) push(m, {k:'us', set, late:id});
  for (let i = 0; i < them; i++) push(m, {k:'them', set, late:id});
}
function startMatch(f){
  const id = 'm' + Date.now().toString(36);
  const m = {id, opp:f.opp||L('Opponent'), home:f.home||'', date:f.date||today(), team:f.team||'', log:[], playMs:0, onCourt:false, courtSince:null, curSet:1, maxSet:1, ended:[], result:'', score:'', done:false, createdAt:Date.now(), bestOf:5};
  if (f.away) m.away = true;
  if (f.mode === 'team'){ m.mode = 'team'; m.teamSlot = S.slot; m.roster = JSON.parse(JSON.stringify(S.team.players)); if (!m.home) m.home = S.team.name || ''; }
  // started late: the sets already played are over, the match carries on in the next one
  (f.sets||[]).forEach(([u, t], i) => { pushLate(m, i+1, u, t); m.ended.push(i+1); });
  S.set = (f.sets||[]).length + 1; m.curSet = m.maxSet = S.set;
  if (f.now) pushLate(m, S.set, f.now[0], f.now[1]);
  S.activeId = id; S.choose = false; S.nfAway = false; S.nfDraft = null; S.nfStep = 1;
  save(m);
  if (f.starter && !isTeam(m)) courtOn(m);
  keepAwake(); render(); window.scrollTo(0,0);
}
function push(m, e){ m.log = (m.log||[]).concat(Object.assign({set:S.set, t:Date.now()}, e)); }
function tap(k){
  const m = S.matches[S.activeId]; if (!m) return;
  // a double tap is one stat: nobody plays two aces in 0.4 s
  if (S.lastStat && S.lastStat.k === k && Date.now() - S.lastStat.at < 400) return;
  S.lastStat = {k, at:Date.now()};
  if (closed(m)) return render();
  whoLeft();
  S.tag = null; S.who = null; clearTimeout(S.tagT);
  const team = isTeam(m);
  const stc = team && ['ace','serve','serr'].includes(k) && court(m, S.set), server = stc && stc.serving === 'us' && !stc.unsure ? stc.pos[0] : null;
  // a stat means the player is playing: put them on court if the tap was forgotten
  let rs = false;
  if (team){} else if (!m.onCourt){ courtOn(m, true); toast(L('{name} put on court', {name:pName()})); } else rs = resumeClock(m);
  push(m, Object.assign(rs ? {k, rs:1} : {k}, m.soloNum && !team ? {p:m.soloNum} : {}, server ? {p:server} : {}));
  const idx = m.log.length - 1;
  // the player's point wins the rally for the team; an error gives it to the other team
  if (PT_KEYS.includes(k)) push(m, {k:'us', auto:1});
  if (ERR_KEYS.includes(k)) push(m, {k:'them', auto:1});
  // a spike or plasé: ask which number passed the ball
  // a team match: ask which number did it (not for a position fault: that is the team's)
  if (team && BYK[k].noWho) toast(L('{stat}: point to {team}', {stat:evLabel(m.log[idx], m).t, team:m.opp}));
  else if (team && server) toast(evLabel(m.log[idx], m).t);
  else if (team){
    S.who = {mid:m.id, i:idx}; S.barAt = Date.now();
    // closes under a finger reaching for a number: that tap must not hit what is underneath
    S.tagT = setTimeout(()=>{ if (!isTyping()){ whoLeft(); S.who = null; S.barAt = S.barClosedAt = Date.now(); render(); } }, 20000);
  } else if (TAG_KEYS.includes(k)){
    S.tag = {mid:m.id, i:idx}; S.barAt = Date.now();
    S.tagT = setTimeout(()=>{ if (!isTyping()){ S.tag = null; S.barAt = S.barClosedAt = Date.now(); render(); } }, 20000);
  }
  save(m); buzz(); render();
  const el = document.querySelector(`[data-stat="${k}"]`);
  if (el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
// n: a jersey number, or '' for "None"
function setPasser(n){
  const m = S.tag && S.matches[S.tag.mid], e = m && m.log[S.tag.i];
  n = jnum(n);
  if (e && n){
    e.from = '#' + n; save(m); toast(L('Pass from #{n}', {n}));
    const known = +n >= 1 && +n <= 20 || (S.player.extraNums||[]).includes(n);
    if (!known){ S.player.extraNums = [...(S.player.extraNums||[]), n].sort((a,b)=>a-b); savePlayer(); }
  }
  S.tag = null; S.barAt = S.barClosedAt = Date.now(); clearTimeout(S.tagT); render();
}
// The who bar is closing by another tap (next stat, a point, End set, time-out) or by itself:
// say that the stat has no player yet. Later and Undo are choices and say nothing.
function whoLeft(){
  const m = S.who && !S.who.fix && S.matches[S.who.mid], e = m && m.log[S.who.i];
  // after the tap's own message ("Set 1: 25-20"), so this one is the one left on screen
  if (e && BYK[e.k] && !e.p){ const t = L('{stat}: no player yet. Tap Who? between rallies', {stat:evLabel(e, m).t}); setTimeout(() => toast(t), 0); }
}
// n: a jersey number, or '' for "Skip". A number that is not on the roster joins it for this match.
function setWho(n){
  const m = S.who && S.matches[S.who.mid], e = m && m.log[S.who.i], chain = S.who && S.who.chain;
  // "Don't know": no number, and not asked again (nk); the next one comes up
  if (n === '?'){ if (e){ e.nk = 1; save(m); } S.whoOther = false; return nextWho(m, chain); }
  n = jnum(n);
  if (e && n){
    e.p = n; delete e.nk;
    if (!(m.roster||[]).some(p => p.num === n)) m.roster = [...(m.roster||[]), {num:n, name:''}];
    save(m);
  }
  S.whoOther = false;
  // a spike or plasé: who set it, asked every time (once; Skip keeps it unknown)
  if (e && n && TAG_KEYS.includes(e.k) && e.s === undefined){ S.who = {mid:m.id, i:S.who.i, setby:1, chain, fix:S.who.fix}; S.barAt = Date.now(); return render(); }
  nextWho(m, chain && n);
}
// After a number: with the Who? button the next stat without a number comes up at once (until none is left or Cancel)
function nextWho(m, chain){
  if (chain){ const nx = firstUnnamed(m); if (nx >= 0){ S.who = {mid:m.id, i:nx, fix:1, chain:1}; S.barAt = Date.now(); return render(); } }
  S.who = null; S.barAt = S.barClosedAt = Date.now(); clearTimeout(S.tagT); render();
}
// n: the setter's number, or '' for "don't know" (kept as asked, so it is not asked again)
function setBy(n){
  const m = S.who && S.matches[S.who.mid], e = m && m.log[S.who.i], chain = S.who && S.who.chain;
  n = jnum(n);
  if (e){
    e.s = n || '';
    if (n && !(m.roster||[]).some(p => p.num === n)) m.roster = [...(m.roster||[]), {num:n, name:''}];
    save(m);
  }
  nextWho(m, chain);
}
// A team match: the first stat still without a player (-1 when every stat has one)
const firstUnnamed = m => (m.log||[]).findIndex(needsWho);
// A set that is over takes no more points until End set or Keep playing, and a match that is over none until it is
// confirmed or Keep tracking: a tap meant for the next set added a point to this one (26-18).
function closed(m){
  if (setOver(m, analyze(m)) && S.keepSet !== m.id + ':' + S.set){ toast(L('Set {n} is over: tap End set {n}, or Keep playing', {n:S.set})); return true; }
  const {w, l} = setsWon(m);
  if ((w >= winSets(m) || l >= winSets(m)) && m.keepOver !== overKey(m)){ toast(L('The match is over: confirm it, or Keep tracking')); return true; }
  return false;
}
function teamPoint(side){
  const m = S.matches[S.activeId]; if (!m) return;
  if (closed(m)) return render();
  // a double tap is one point: no rally is over in 0.4 s
  if (S.lastPt && S.lastPt.side === side && Date.now() - S.lastPt.at < 400) return;
  S.lastPt = {side, at:Date.now()};
  S.tag = null; S.who = null;
  push(m, resumeClock(m) ? {k:side, rs:1} : {k:side}); save(m); buzz(); render();
}
// A time-out: noted with the score, the court clock stops, and the screen freezes (m.toOn) until
// "Resume play". seg / onAt let Undo put the clock back exactly while it is still frozen.
function timeOut(side){
  const m = S.matches[S.activeId]; if (!m) return;
  S.toAsk = false; S.barAt = S.barClosedAt = Date.now();
  const e = {k:'to', side};
  if (m.onCourt && m.courtSince){ const before = m.playMs||0; e.onAt = m.courtSince; pauseClock(m); e.seg = m.playMs - before; }
  push(m, e); m.toOn = true; save(m); buzz(); render();
}
// The clock starts again only if the time-out stopped it (not one called during a set break).
function resumePlay(){
  const m = S.matches[S.activeId]; if (!m || !m.toOn) return;
  const e = [...(m.log||[])].reverse().find(x => x.k === 'to');
  delete m.toOn; S.barClosedAt = Date.now();
  if (e && e.seg != null) resumeClock(m);
  save(m); buzz(); render();
}
function freezeView(m){
  const e = [...(m.log||[])].reverse().find(x => x.k === 'to'); if (!e) return '';
  const sc = analyze(m).score[e.set] || {us:0, them:0}, n = m.log.filter(x => x.k === 'to' && x.side === e.side && x.set === e.set).length;
  const ord = S.lang === 'el' ? n + 'ο' : n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');
  return `<div class="freeze" role="dialog" aria-label="${L('Time-out')}">
    <div class="kicker">${L('Set {n}', {n:e.set})} · ${m.away ? sc.them + '–' + sc.us : sc.us + '–' + sc.them}</div>
    <h2>${L('Time-out')}</h2>
    <div class="fz-team">${esc(e.side === 'us' ? homeName(m) : m.opp)} · ${L('{ord} in this set', {ord})}</div>
    <div class="fz-clock" id="toclock">${fmtTime(Date.now() - (e.t||Date.now()))}</div>
    <button class="btn btn-or" id="b-resumeplay">${L('Resume play')}</button>
    <button class="btn btn-dk" id="b-toundo">${L('Wrong tap, undo time-out')}</button>
  </div>`;
}
// Fix score: rallies were missed, the current set jumps to the score typed (points only go up; Undo takes points back)
function fixScore(us, them){
  const m = S.matches[S.activeId]; if (!m) return;
  const sc = analyze(m).score[S.set] || {us:0, them:0};
  if (!(us >= 0 && them >= 0)) return toast(L('Type both scores'));
  if (us < sc.us || them < sc.them) return toast(L('Lower than now: use Undo to take points back'));
  if (us === sc.us && them === sc.them){ S.fixAsk = false; return render(); }
  pushLate(m, S.set, us - sc.us, them - sc.them);
  S.fixAsk = false; S.barClosedAt = Date.now(); save(m); render(); toast(L('Set {n} now {score}', {n:S.set, score:ordS(m, us, them)}));
}
function timeoutBar(m){
  if (S.toAsk) return `<div class="tagbar" role="group" aria-label="${L('Time-out')}">
    <div class="q">${L('Time-out: which team?')}</div>
    <div class="two">${m.away ? `<button data-to="them">${esc(m.opp)}</button><button data-to="us">${esc(homeName(m))}</button>` : `<button data-to="us">${esc(homeName(m))}</button><button data-to="them">${esc(m.opp)}</button>`}</div>
    <div class="two"><button class="skip" data-to="">${L('Cancel')}</button></div></div>`;
  if (S.fixAsk){ const sc = analyze(m).score[S.set] || {us:0, them:0};
    return `<div class="tagbar" role="group" aria-label="${L('Fix score')}">
    <div class="q">${L('Set {n} score now: {teams}', {n:S.set, teams:esc(m.away ? m.opp + ' – ' + homeName(m) : homeName(m) + ' – ' + m.opp)})}<br><span style="font-weight:400;opacity:.7">${L('Missed rallies count only for the score.')}</span></div>
    <form class="more" id="fixform">
      ${(i => m.away ? i[1] + i[0] : i[0] + i[1])([
        `<input class="sm" id="fix-us" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="${sc.us}" aria-label="${esc(homeName(m))}">`,
        `<input class="sm" id="fix-them" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="${sc.them}" aria-label="${esc(m.opp)}">`])}
      <button type="submit">${L('Save')}</button><button type="button" class="skip" id="b-fixno">${L('Cancel')}</button>
    </form></div>`; }
  return '';
}
// Set break: the court clock stops when a set ends and starts again with the first tap of the next set.
// The player stays "on court" (no bench event); stintMs is the time already counted in this spell.
function pauseClock(m){
  if (!m.onCourt || !m.courtSince) return;
  const seg = Date.now() - m.courtSince;
  m.playMs = (m.playMs||0) + seg; m.stintMs = (m.stintMs||0) + seg; m.courtSince = null;
}
// true when this tap is the one that restarted the clock after a set break (the event is marked rs, so Undo can stop it again)
function resumeClock(m){ if (m.onCourt && !m.courtSince){ m.courtSince = Date.now(); return true; } return false; }
function courtOn(m, auto){ m.onCourt = true; m.courtSince = Date.now(); m.stintMs = 0; push(m, auto ? {k:'on', byStat:1} : {k:'on'}); }
function toggleCourt(){
  const m = S.matches[S.activeId]; if (!m) return;
  if (m.onCourt){
    const seg = m.courtSince ? Date.now() - m.courtSince : 0, pre = m.stintMs||0;
    push(m, {k:'off', dur:pre+seg, onAt:m.courtSince, pre});
    m.playMs = (m.playMs||0) + seg; m.onCourt = false; m.courtSince = null; m.stintMs = 0;
  } else courtOn(m);
  save(m); buzz(); render();
}
// The set Undo must first go back to: the last tap is in another set than the one on screen
// (straight after "End set", or after looking at an earlier set). null = the last tap is in this set.
function undoBack(m){
  const log = m.log||[], last = log[log.length-1];
  // in the last set "End set" stays on that set: Undo first opens it again
  if (last) return last.set !== S.set || (S.set >= lastSet(m) && (m.ended||[]).includes(S.set)) ? last.set : null;
  return S.set > 1 ? S.set - 1 : null;
}
function undo(){
  const m = S.matches[S.activeId]; if (!m) return;
  S.keepSet = null; S.who = null;
  const back = undoBack(m);
  if (back != null){
    // takes back "End set": that set is open again, and nothing is removed from it yet
    m.ended = (m.ended||[]).filter(s => s !== back);
    S.set = back; m.curSet = back; S.tag = null; resumeClock(m);
    save(m); render(); return toast(L('Back in set {n}', {n:back}));
  }
  if (!m.log?.length) return;
  let last = m.log[m.log.length-1];
  m.log = m.log.slice(0,-1);
  S.tag = null;
  // typed-in points go back as one batch
  if (last.late){ while (m.log.length && m.log[m.log.length-1].late === last.late) m.log = m.log.slice(0,-1); save(m); render(); return toast(L('Undone: score typed in')); }
  // a time-out that stopped the clock: put the clock back as if it never stopped
  // (after Resume play the time-out's minute stays uncounted: the clock is not rewound across play)
  if (last.k === 'to'){ delete m.toOn; if (last.seg != null && m.onCourt && !m.courtSince){ m.playMs = Math.max(0, (m.playMs||0) - last.seg); m.stintMs = Math.max(0, (m.stintMs||0) - last.seg); m.courtSince = last.onAt; } save(m); render(); return toast(L('Undone: {what}', {what:evLabel(last, m).t})); }
  // a stat's automatic team point goes with it
  if ((last.k === 'us' || last.k === 'them') && last.auto && m.log.length && BYK[m.log[m.log.length-1].k]){ last = m.log[m.log.length-1]; m.log = m.log.slice(0,-1); }
  // the tap that restarted the clock after a set break is taken back: the break goes on, clock stopped
  if (last.rs && m.onCourt) m.courtSince = null;
  const dropSpell = () => { m.playMs = Math.max(0, (m.playMs||0) - (m.stintMs||0)); m.onCourt = false; m.courtSince = null; m.stintMs = 0; };
  if (last.k === 'on') dropSpell();
  // a stat that put the player on court by itself: take that back too
  else if (BYK[last.k] && m.log.length && m.log[m.log.length-1].k === 'on' && m.log[m.log.length-1].byStat){ m.log = m.log.slice(0,-1); dropSpell(); }
  // the final whistle's own "to the bench" (after Keep tracking): the time up to the whistle stays counted,
  // the clock restarts now - never across the hours or days between finishing and resuming
  if (last.k === 'off' && last.fin){ m.onCourt = true; m.courtSince = Date.now(); m.stintMs = last.dur||0; }
  // 'pre' = time already counted before a set break; a spell taken off during the break comes back still stopped
  else if (last.k === 'off'){ m.playMs = Math.max(0,(m.playMs||0) - ((last.dur||0) - (last.pre||0))); m.onCourt = true; m.stintMs = last.pre||0; m.courtSince = 'pre' in last ? last.onAt : (last.onAt || Date.now()); }
  save(m); render(); toast(L('Undone: {what}', {what:evLabel(last, m).t}));
}
function pickSet(n){
  const m = S.matches[S.activeId];
  // going forward with the set buttons instead of "End set": the set that was played is over
  if (m && n > S.set && !(m.ended||[]).includes(S.set)){ const sc = analyze(m).score[S.set]; if (sc && (sc.us || sc.them)){ m.ended = [...(m.ended||[]), S.set].sort((a,b)=>a-b); pauseClock(m); } }
  S.set = n;
  if (m){ m.curSet = n; m.maxSet = Math.max(m.maxSet||1, n); save(m); }
  render();
}
// force: asked and confirmed. End set next to Time-out ended a set at 12-10 with only a toast.
function endSet(force){
  const m = S.matches[S.activeId]; if (!m) return;
  const s = S.set, sc = analyze(m).score[s];
  // a stray tap before the first point must not move the match into the next set
  if (!sc || !(sc.us || sc.them)) return toast(L('Set {n} has no points yet', {n:s}));
  if (!force && !setOver(m, analyze(m))){ S.endAsk = true; S.barAt = Date.now(); return render(); }
  m.ended = [...new Set([...(m.ended||[]), s])].sort((a,b)=>a-b);
  pauseClock(m); S.barAt = Date.now();
  toast(L('Set {n}: {score}', {n:s, score:ordS(m, sc.us, sc.them)}));
  pickSet(s >= lastSet(m) ? s : s+1);
}
// The set buttons in a match move where the taps go: going back to an earlier set, or on from a set that is
// not over, is asked first (a tap on "2" sent the taps of set 3 to set 2).
function askSet(n){
  const m = S.matches[S.activeId]; if (!m || n === S.set) return render();
  const a = analyze(m), sc = a.score[S.set];
  if (n > S.set && (!sc || !(sc.us || sc.them) || setOver(m, a) || (m.ended||[]).includes(S.set))) return pickSet(n);
  S.setAsk = n; S.barAt = Date.now(); render();
}
// the question for End set or a set button
function askBar(m){
  const sc = analyze(m).score[S.set] || {us:0, them:0}, now = ordS(m, sc.us, sc.them);
  if (S.endAsk) return `<div class="tagbar" role="group" aria-label="${L('End set {n}', {n:S.set})}">
    <div class="q">${L('Set {n} is not over ({score}). End it anyway?', {n:S.set, score:now})}</div>
    <div class="two"><button id="b-endyes">${L('End set {n}', {n:S.set})}</button><button class="skip" id="b-askno">${L('Cancel')}</button></div></div>`;
  const n = S.setAsk; if (!n) return '';
  return `<div class="tagbar" role="group" aria-label="${L('Sets')}">
    <div class="q">${n < S.set ? L('Go back to set {n}? New taps will count in set {n}.', {n}) : L('Set {s} is not over ({score}). End it and go to set {n}?', {s:S.set, n, score:now})}</div>
    <div class="two"><button id="b-setgo" data-go="${n}">${L('Go to set {n}', {n})}</button><button class="skip" id="b-askno">${L('Cancel')}</button></div></div>`;
}
function finishMatch(result, score, endAt){
  const m = S.matches[S.activeId]; if (!m) return;
  // the final whistle belongs to the last set that was played, not an empty next set or one looked back at
  const played = scoredSets(analyze(m).score), offSet = played.length ? Math.max(...played) : S.set;
  if (m.onCourt){ const end = Math.max(endAt || Date.now(), m.courtSince||0), seg = m.courtSince ? end-m.courtSince : 0, pre = m.stintMs||0; push(m,{k:'off',dur:pre+seg,onAt:m.courtSince,pre,set:offSet,t:end,fin:1}); m.playMs=(m.playMs||0)+seg; m.onCourt=false; m.courtSince=null; m.stintMs=0; }
  // a set left open whose score finishes it is over now (also one left open by going back with the set buttons);
  // a set stopped half-way (abandoned at 10-12) is not a set won or lost
  const fsc = analyze(m).score, fin = s => { const x = fsc[s], hi = Math.max(x.us, x.them), lo = Math.min(x.us, x.them); return hi >= (s >= lastSet(m) ? 15 : 25) && hi - lo >= 2; };
  m.ended = [...new Set([...(m.ended||[]), ...scoredSets(fsc).filter(fin)])].sort((a,b)=>a-b);
  m.result = result; m.score = score; m.done = true; delete m.toOn;
  save(m);
  S.activeId = null; backup();
  S.view = 'match'; S.openId = m.id; render(); window.scrollTo(0,0);
}
// Close the open match (result guessed from sets won) and go straight to the new-match form.
function closeAndNew(){
  const m = S.matches[S.activeId]; if (!m) return;
  // an open set counts only when its score finishes it (5-0 in set 1 is not a set won)
  const {w, l} = setsDone(m), log = m.log||[];
  // a result saved before "Keep tracking" wins over the guess from sets won
  const sv = savedResult(m, w, l);
  finishMatch(sv.result, sv.score, log.length ? log[log.length-1].t : m.createdAt);
  S.view = 'live'; render(); window.scrollTo(0,0);
  toast(L('Saved. It is in Season.'));
}
// Player match -> team match: the player's taps so far go to their number, the chosen team's roster is copied in.
function switchToTeam(){
  const m = S.matches[S.activeId]; if (!m || isTeam(m)) return;
  const num = jnum(S.player.num || '');
  if (!num) return toast(L("Add the player's number first (Player tab)"));
  if (!S.team.players.length) return toast(L('Add the team first (Team tab)'));
  // the court clock is for one player only: close the spell now
  if (m.onCourt){ const seg = m.courtSince ? Date.now() - m.courtSince : 0, pre = m.stintMs||0; push(m, {k:'off', dur:pre+seg, onAt:m.courtSince, pre}); m.playMs = (m.playMs||0) + seg; m.onCourt = false; m.courtSince = null; m.stintMs = 0; }
  // a match that was a team match before (soloNum): its "no player" taps are teammates', its roster and team stay
  const back = !!m.soloNum;
  if (!back){ m.log.forEach(e => { if (BYK[e.k] && !e.p) e.p = num; }); m.teamSlot = S.slot; m.roster = JSON.parse(JSON.stringify(S.team.players)); }
  m.mode = 'team'; delete m.soloNum;
  if (!m.roster.some(p => p.num === num)) m.roster = [...m.roster, {num, name:S.player.name||''}].sort((a,b) => a.num - b.num);
  if (!m.home) m.home = S.team.name || '';
  S.tag = null; save(m); render(); window.scrollTo(0,0); toast(L("Now {team} · {name}'s taps are #{n}", {team:teamLabel(slotOf(m)), name:pName(), n:num}));
}
// Team match -> player match: every tap is kept, only the player's number is shown and counts in the player Season.
function switchToPlayer(){

// Hidden while a match is live: that match's screen is where Live leads.
const newMatchBtn = () => S.activeId && S.matches[S.activeId] ? '' : `<button class="btn btn-or" data-view="live">+ ${L('New match')}</button>`;
function resume(id){
  const m = S.matches[id]; if (!m) return;
  if (S.activeId && S.activeId !== id && S.matches[S.activeId]) return toast(L('Finish the live match first'));
  // a match that was over: carry on in the last set played, never in an empty extra set
  const {w, l} = setsWon(m), log = m.log||[];
  if ((w >= winSets(m) || l >= winSets(m)) && log.length && !log.some(e => e.set === (m.curSet||1))) m.curSet = log[log.length-1].set;
  m.done = false; S.choose = false; m.keepOver = overKey(m); save(m);
  S.activeId = id; S.set = m.curSet || 1; S.view = 'live'; render(); window.scrollTo(0,0);
}
function removeMatch(id){
  delete S.matches[id];
  // remembered until the cloud copy is gone, so a delete made before sign-in finishes still happens
  LS.set('ss.deleted', [...new Set([...(LS.get('ss.deleted')||[]), id])]);
  if (S.activeId === id) S.activeId = null;
  backup(); queue('matches/'+id);
  S.view = 'history'; S.openId = null; render(); toast(L('Match deleted'));
}

function arm(key){ S.armed = key; S.armAt = Date.now(); clearTimeout(S.armT); S.armT = setTimeout(()=>{ if (S.armed === key){ S.armed = null; if (!isTyping()) render(); } }, 4000); render(); }
// Greek in capitals has no stress accent (ΟΛΥΜΠΙΑΚΟΣ, not ΟΛΥΜΠΙΑΚΌΣ) but keeps the diaeresis (ΠΑΝΑΘΗΝΑΪΚΟΣ).
// Done here, not left to the browser: iPhones do not all drop it for text-transform:uppercase.
const greekPlain = s => s.normalize('NFD').replace(/([Ͱ-Ͽ]̈?)́/g, '$1').normalize('NFC');
function capsFix(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) if (/[Ά-ΐά-ΰό-ώ]/.test(n.data) && getComputedStyle(n.parentElement).textTransform === 'uppercase') n.data = greekPlain(n.data);
}

    const tc = $('#toclock'), e = m.toOn && [...(m.log||[])].reverse().find(x => x.k === 'to'); if (tc && e) tc.textContent = fmtTime(Date.now() - e.t); }, 1000);
}

// Opening the app on an open match: carry on with it, or save it and start another.
// Asked only after 20 minutes without a tap, so a reload in the middle of a set goes straight back.
function idleLong(){
  const m = S.activeId && S.matches[S.activeId]; if (!m) return false;
  const last = Math.max(m.createdAt||0, ...(m.log||[]).map(e => e.t||0));
  return Date.now() - last > 20*60e3;
}

// What is typed in the new-match steps, kept while going back and forth (and to the team page and back)

// Next: step 2 of a player match saves a name and number typed there; a team needs players

// a long word (PANATHINAIKOS) would split mid-word on a phone: shrink it instead
const nmLong = n => { const w = Math.max(...String(n).split(/\s+/).map(x => x.length)); return w > 11 ? ' long xl' : w > 9 ? ' long' : ''; };
// srv: this team serves now (a volt dot before the name)

// sets won: the "3-1" typed at the final whistle wins over the sets tracked (tracking may have stopped early)
function finalSets(m){ const x = /^(\d+)-(\d+)$/.exec(m.score||''); return x ? {w:+x[1], l:+x[2]} : setsWon(m); }
function scoreBug(m, a, opts){

  // away: the home team (the opponent) is on the left, like the hall's scoreboard. Taps still count for your team.

  const us = {name:homeName(m), sets:w, pts:sc.us, srv:opts.serving === 'us'}, them = {name:m.opp, sets:l, pts:sc.them, srv:opts.serving === 'them'};

  return `

    <div class="plus">

}

// team: {server, theyServe} for a team match. server = our server from the line-up (on the serve buttons, so a
// missed sub shows before the tap); while they serve our serve stats are off (a parent tapped Ace for their ace).
function pads(all, team){
  const btn = s => { const o = Object.assign({}, s, team && TEAM_LBL[s.k] || {}), sv = ['ace','serve','serr'].includes(o.k), srv = team && team.server && sv, off = team && team.theyServe && sv;
    return `<button class="stat ${o.g}" data-stat="${o.k}" ${off ? 'disabled' : ''} aria-label="${esc(L(o.l)+' '+L(o.s))}${srv ? ', ' + L('#{n} serves', {n:team.server}) : ''}, ${all[o.k]} ${L('so far')}"><span class="n">${all[o.k]}</span><span class="l">${esc(L(o.l + '|pad'))}</span><span class="s">${srv ? '#' + esc(team.server) : esc(L(o.s + '|pad'))}</span></button>`; };
  // a team match: reception graded in a row of its own, and two more errors
  if (team) return TEAM_PADS.map(G => `
  <section class="sec"><h3>${L(G.h)}</h3><div class="pad pad-n${G.keys.length}">${G.keys.map(k => btn(BYK[k])).join('')}</div></section>`).join('');
  return GROUPS.map(G=>`
  <section class="sec"><h3>${L(G.h)}</h3><div class="pad pad-${G.g}">
    ${STATS.filter(s=>s.g===G.g && !s.team).map(btn).join('')}
  </div></section>`).join('');
}
// link: each row opens that player's own page (not on the live screen, where a stray tap would leave the match)

function whoBar(m){
  if (!S.who || S.who.mid !== m.id) return '';

  const sb = !!S.who.setby, attr = sb ? 'data-setby' : 'data-who';
  // naming later: which rally it was, and how many are still to name
  const f = S.who.fix && analyze(m).feed.find(x => x.e === e), left = S.who.chain ? (m.log||[]).filter(needsWho).length : 0;
  // short: "Other number" and "Later" are in the grid, so the bar leaves the stat buttons free on most phones
  const tail = sb ? `<button type="button" class="skip" data-setby="">${L("Don't know")}</button>`
    : `<button type="button" class="skip" data-whoother="1">${L('Other')}<small>${L('number')}</small></button><button type="button" class="skip" data-who="?">${L("Don't know")}</button><button type="button" class="skip" data-who="">${S.who.fix ? L('Cancel') : L('Later')}</button>`;
  return `<div class="tagbar who" role="group" aria-label="${sb ? L('Who set it') : L('Which player')}">
    <div class="q" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>${esc(evLabel(e,m).t)}${f && !sb ? ` · ${L('set {n}', {n:e.set})}, ${f.us}–${f.them}` : ''}: ${sb ? L('set by?') : L('who?')}${left > 1 && !sb ? ` <small style="font-weight:400;opacity:.7">(${L('{n} to name|many', {n:left})})</small>` : ''}</span>${S.who.fix || sb ? '' : `<button class="skip" id="b-whoundo" style="height:40px;padding:0 14px;font-size:13px">${L('Wrong tap, undo')}</button>`}</div>
    <div class="nums">${whoButtons(m, attr, sb, court(m, e.set, S.who.i))}${tail}</div>
    ${S.whoOther && !sb ? `<form class="more" id="whoform">
      <input id="who-other" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="${L('Other number')}" aria-label="${L('Other number')}">
      <button type="submit">${L('Add')}</button>
    </form>` : ''}
  </div>`;
}
// The roster as number buttons (attr: data-who or data-setby). Asking who set it, the setters are marked.
function whoButtons(m, attr, sb, st){
  const btn = p => `<button ${attr}="${esc(p.num)}"${sb && p.pos === 'S' ? ' class="hint"' : ''}>${esc(p.num)}<small>${esc(first(p.name))}</small></button>`;
  if (!st) return (m.roster||[]).map(btn).join('');
  // the six on court first, in roster order (the buttons stay put at each rotation), then the bench
  const six = (m.roster||[]).filter(p => st.pos.includes(p.num)).concat(st.pos.filter(n => !(m.roster||[]).some(p => p.num === n)).map(n => rosterP(m, n)));
  return `<div class="court6">${six.map(btn).join('')}</div>` + (m.roster||[]).filter(p => !st.pos.includes(p.num)).map(btn).join('');
}

  const refuse = (msg, p, cls) => { toast(msg); const e = $('#t-err'); if (e){ e.textContent = msg; e.hidden = false; }
    const row = document.querySelectorAll('.rrow')[d.players.lastIndexOf(p)]; row?.querySelector(cls)?.focus(); return false; };

// Volleyball: best of five, the match is over at three sets won. A set is won at 25 (15 in the fifth)
// with two clear, no cap (26-24, 30-28). Matches saved before 2026-10-07 keep the length they were

function setOver(m, a){
  const sc = a.score[S.set]; if (!sc || (m.ended||[]).includes(S.set)) return null;
  const hi = Math.max(sc.us, sc.them), lo = Math.min(sc.us, sc.them);
  return hi >= (S.set >= lastSet(m) ? 15 : 25) && hi - lo >= 2 ? sc : null;
}

function setBar(m, a){

    const key = m.id + ':' + S.set;
    return S.keepSet === key ? '' : `<div class="tagbar" role="group" aria-label="${L('Set over')}">
    <div class="q">${L(sc.us > sc.them ? 'Set {n} is over: {team} won {score}' : 'Set {n} is over: {team} lost {score}', {n:S.set, team:esc(homeName(m)), score:sc.us + '–' + sc.them})}</div>
    <div class="two"><button id="b-setend">${L('End set {n}', {n:S.set})}</button><button class="skip" id="b-setkeep" data-key="${key}">${L('Keep playing')}</button></div></div>`;

  const {w, l} = setsWon(m);
  if ((w >= winSets(m) || l >= winSets(m)) && m.keepOver !== overKey(m)) return `<div class="tagbar" role="group" aria-label="${L('Match over')}">
    <div class="q">${L(w > l ? 'Game over: {team} won {sets} in sets. Confirm?' : 'Game over: {team} lost {sets} in sets. Confirm?', {team:esc(homeName(m)), sets:w + '–' + l})}</div>
    <div class="two"><button id="b-matchend">${L('Confirm, save match')}</button><button class="skip" id="b-matchkeep">${L('Keep tracking')}</button></div></div>`;

/* ---------- match report ---------- */
const WORDS = {ace:['ace','aces'], kill:['spike','spikes'], plase:['plasé','plasés'], block:['block','blocks'],
  dig:['defence','defences'], pass:['good reception','good receptions'], serve:['serve in','serves in'], assist:['good set','good sets'], att:['attack in','attacks in'],
  serr:['serve','serve'], aerr:['attack','attack'], rerr:['reception','reception'], berr:['block out','block out'], ferr:['net / fault','net / fault'],
  p3:['perfect pass','perfect passes'], p2:['good pass','good passes'], p1:['poor pass','poor passes'], bhe:['ball handling','ball handling'], pos:['position fault','position faults']};
// Greek: {n} marks where the number goes ("σερβίς 2")
const WORDS_EL = {ace:['άσος','άσοι'], kill:['καρφί','καρφιά'], plase:['πλασέ','πλασέ'], block:['μπλοκ','μπλοκ'],
  dig:['άμυνα','άμυνες'], pass:['καλή υποδοχή','καλές υποδοχές'], serve:['σερβίς μέσα','σερβίς μέσα'], assist:['καλή πάσα','καλές πάσες'], att:['επίθεση μέσα','επιθέσεις μέσα'],
  serr:['σερβίς {n}','σερβίς {n}'], aerr:['επίθεση {n}','επίθεση {n}'], rerr:['υποδοχή {n}','υποδοχή {n}'], berr:['μπλοκ άουτ {n}','μπλοκ άουτ {n}'], ferr:['δίχτυ / φάουλ {n}','δίχτυ / φάουλ {n}'],
  p3:['τέλεια υποδοχή','τέλειες υποδοχές'], p2:['καλή υποδοχή','καλές υποδοχές'], p1:['κακή υποδοχή','κακές υποδοχές'], bhe:['κράτημα / διπλή {n}','κράτημα / διπλή {n}'], pos:['λάθος θέσης {n}','λάθος θέσης {n}']};
const nWord = (n, k) => { const w = (S.lang === 'el' ? WORDS_EL : WORDS)[k][n === 1 ? 0 : 1]; return w.includes('{n}') ? w.replace('{n}', n) : n + ' ' + w; };

// Attack / serve / reception as "x of y" and a percentage. Only what was tapped counts.
// 199 of 200 is 99%, not 100%; 1 of 300 is 1%, not 0%

function pctRows(c, rs){

    <div class="pr"><span class="pl">${r.l}<small>${r.b ? `${L('{a} of {b}', {a:r.a, b:r.b})} · ${esc(r.n)}` : esc(r.n)}</small></span>

// Per set: how many rallies were played with the player on court, and +/- in them.
function setCourt(m){
  const out = {}; let on = false;
  (m.log||[]).forEach(e => {
    const o = out[e.set] || (out[e.set] = {rallies:0, onR:0, pm:0});
    if (e.k === 'on') on = true;
    else if (e.k === 'off') on = false;
    else if ((e.k === 'us' || e.k === 'them') && !e.late){ o.rallies++; if (on){ o.onR++; o.pm += e.k === 'us' ? 1 : -1; } }
  });
  return out;
}

// a set whose score was only typed in (arrived late / Fix score) and nothing was tapped
const typedOnly = (m, s) => { const es = (m.log||[]).filter(e => e.set === s && (e.k === 'us' || e.k === 'them' || BYK[e.k])); return es.length > 0 && es.every(e => e.late); };

// sets that were watched: a set only typed in (arrived late) does not lower the per-set average
function setsPlayed(m){ const a = analyze(m); return scoredSets(a.score).filter(s => !typedOnly(m, s)).length || 1; }

/* ---------- team flow: who served, side-out, where the points came from, runs ---------- */
// The first server of a set: chosen on the live screen (m.serve[set]), or read from the first rally
// (our ace / serve in / serve error = we served; our reception = they served). null = not known.
function firstServer(m, s){
  if (m.serve && m.serve[s]) return m.serve[s];
  for (const e of (m.log||[])){
    if (e.set !== s || e.late) continue;
    if (e.k === 'us' || e.k === 'them') return null;
    if (['ace','serve','serr'].includes(e.k)) return 'us';
    if (['pass','p3','p2','p1','rerr'].includes(e.k)) return 'them';

}
// The team serving now: the winner of the last rally (the first server before any). null after typed-in points.

  if (!p.length) return firstServer(m, s);
  return p[p.length-1].late ? null : p[p.length-1].k;

// Side-out: rallies won when the other team served. Break points: rallies won on our own serve.

// serr: our serve errors in the rallies counted as ours (so "serves in" never mixes counted and uncounted rallies)
function serveStats(m){

  scoredSets(analyze(m).score).forEach(s => {
    const r = sets[s] = {so:0, soOf:0, bp:0, bpOf:0, serr:0}; let cur = firstServer(m, s);
    (m.log||[]).forEach(e => {
      if (e.set !== s) return;
      if (e.k === 'serr' && cur === 'us') r.serr++;
      if (e.k !== 'us' && e.k !== 'them') return;
      if (e.late){ cur = null; return; }
      if (cur === 'us'){ r.bpOf++; if (e.k === 'us') r.bp++; }
      else if (cur === 'them'){ r.soOf++; if (e.k === 'us') r.so++; }

// Where the points came from: earned = our point stats; the rest of our points were their errors.

function pointSources(m){

  return {earned:pts(c), theirErr:Math.max(0, us - pts(c)), given:errs(c), theyEarned:Math.max(0, them - errs(c))};

// Hitting efficiency (kills - errors) / attempts, as volleyball writes it: .364, -.111
const attempts = c => c.kill + c.plase + c.aerr + c.att;

    if (e.late){ cur = null; n = 0; return; }
    if (e.k === cur) n++; else { cur = e.k; n = 1; }
    best[cur] = Math.max(best[cur], n);

const sumKeys = (list, keys) => list.reduce((t, x) => { keys.forEach(k => t[k] = (t[k]||0) + (x[k]||0)); return t; }, {});

// Side-out / break points / serves in, and where the points came from: one block for a match or a season

// Per player: hitting (kills, errors, attempts, efficiency) and serving (aces, errors, in %, ace:error)

/* ---------- line-up, rotation and the court ---------- */

const COURT_ORDER = [3, 2, 1, 4, 5, 0];
const ROMAN = ['I','II','III','IV','V','VI'];

// court and who serves. Winning the serve back (side-out) rotates the team; a sub swaps one player.
// Typed-in points lose who serves (unsure) until the next rally. onRally(e, st) sees each rally before it counts.
function courtWalk(m, upto, onRally){
  const log = m.log||[], end = upto == null ? log.length : upto, by = {};
  for (let i = 0; i < end; i++){
    const e = log[i];
    if (e.k === 'lineup'){ by[e.set] = {pos:e.pos.slice(), serving:e.serve || null, unsure:false}; continue; }
    const st = by[e.set]; if (!st) continue;
    if (e.k === 'sub'){ const j = st.pos.indexOf(e.out); if (j >= 0) st.pos[j] = e.in; continue; }
    if (e.k !== 'us' && e.k !== 'them') continue;
    if (e.late){ st.serving = null; st.unsure = true; continue; }

    else if (e.k === 'us' && !st.serving) st.unsure = true;

// The six on court in set s now (or before log index upto); null without a line-up in that set
const court = (m, s, upto) => courtWalk(m, upto)[s] || null;

// Season leaders: the top three in each count; hitting needs 10 attempts
function leadersHTML(rows){

// Season: one bar per match (oldest left), points or rating. Tap a bar to read it.
function seasonChart(list){
  if (list.length < 2) return '';
  const metric = S.chartMetric || 'pts';
  const ms = list.slice(0, 12).reverse();
  const val = m => { const c = counts(m); return metric === 'pts' ? pts(c) : Math.round(vir(c)*10)/10; };
  const vals = ms.map(val);
  const sel = S.chartSel && ms.find(m => m.id === S.chartSel) ? S.chartSel : ms[ms.length-1].id;
  const W = 320, H = 150, top = 16, bot = 22, hi = Math.max(1, ...vals), lo = Math.min(0, ...vals);
  const y = v => top + (hi - v) * (H - top - bot) / (hi - lo), base = y(0);
  const slot = W / ms.length, bw = Math.min(28, slot * 0.6);
  const bars = ms.map((m, i) => {
    const v = vals[i], x = i*slot + (slot-bw)/2, y1 = y(Math.max(v,0)), y2 = y(Math.min(v,0)), r = Math.min(4, (y2-y1)/2, bw/2);
    // rounded at the data end only, square on the baseline
    const d = v >= 0
      ? `M${x},${y2} V${y1+r} Q${x},${y1} ${x+r},${y1} H${x+bw-r} Q${x+bw},${y1} ${x+bw},${y1+r} V${y2} Z`
      : `M${x},${y1} V${y2-r} Q${x},${y2} ${x+r},${y2} H${x+bw-r} Q${x+bw},${y2} ${x+bw},${y2-r} V${y1} Z`;
    const isSel = m.id === sel, isMax = v === hi && v > 0;
    const lab = (isSel || isMax) ? `<text class="v" x="${x+bw/2}" y="${v >= 0 ? y1-4 : Math.min(y2+11, H-bot-2)}" text-anchor="middle">${v}</text>` : '';
    const dl = ms.length <= 8 || i === 0 || i === ms.length-1 ? `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(shortDate(m.date))}</text>` : '';
    return `<path class="bar${isSel?' sel':''}" d="${d}"/>${lab}${dl}<rect class="hit" data-csel="${m.id}" x="${i*slot}" y="0" width="${slot}" height="${H}"><title>${esc(L('vs {opp}', {opp:m.opp}))}: ${v}</title></rect>`;
  }).join('');
  const sm = ms.find(m => m.id === sel), sc = counts(sm), sa = analyze(sm);
  return `<section class="sec chart"><div class="sec-h"><h3>${L('Progress')}</h3>
      <div class="seg" role="group" aria-label="${L('Chart shows')}"><button data-metric="pts" aria-pressed="${metric==='pts'}">${L('Points')}</button><button data-metric="vir" aria-pressed="${metric==='vir'}">${L('Rating')}</button></div></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('{what} per match, last {n} matches', {what:L(metric==='pts'?'Points':'Rating'), n:ms.length})}">
      ${bars}<line class="base" x1="0" x2="${W}" y1="${base}" y2="${base}"/></svg>
    <div class="chart-d"><b>${L('vs {opp}', {opp:esc(sm.opp)})}</b> · ${esc(fmtDate(sm.date))} · ${nL(pts(sc), '{n} pt', '{n} pts')} · ${L('rating {r}', {r:fmtVir(vir(sc))})} · <span class="${pmClass(sa.pm)}">${fmtPM(sa.pm)}</span></div>
  </section>`;
}
function shortDate(d){ try{ const x = new Date(d+'T12:00'); return x.getDate() + '/' + (x.getMonth()+1); }catch(e){ return ''; } }

// The match report drawn on a canvas (1080 wide, Instagram/WhatsApp friendly), always dark.
const PIC = {bg:'#000000', soft:'#161616', soft2:'#2A2A2A', ink:'#FFFFFF', muted:'#9E9EA0', volt:'#D7FF3A', voltInk:'#111111', pos:'#3DDC84', neg:'#FF5A5F'};
function picFont(ctx, weight, size, head){
  ctx.font = `${weight} ${size}px ${head ? '"Archivo","Roboto Condensed","Arial Narrow",Arial,sans-serif' : '"Archivo",Helvetica,Arial,sans-serif'}`;
  try{ ctx.fontStretch = head ? 'ultra-condensed' : 'normal'; }catch(e){}

// largest size up to `size` at which the text fits in maxW
function picFit(ctx, text, maxW, weight, size, head){
  for (let z = size; z > 12; z -= 2){ picFont(ctx, weight, z, head); if (ctx.measureText(text).width <= maxW) return z; }
  return 12;
}
function picText(ctx, text, x, y, o){
  o = o || {};
  if (o.fit) picFit(ctx, text, o.fit, o.w || 800, o.size, o.head); else picFont(ctx, o.w || 500, o.size || 30, o.head);

function picTeam(ctx, text, x, y, maxW, align){

  const ws = text.split(/\s+/);
  if (z >= 46 || ws.length < 2){ picText(ctx, text, x, y, {w:800, size:64, head:true, align, fit:maxW}); return; }
  let best = null;
  picFont(ctx, 800, 50, true);
  for (let i = 1; i < ws.length; i++){
    const a = ws.slice(0,i).join(' '), b = ws.slice(i).join(' '), wd = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
    if (!best || wd < best.wd) best = {a, b, wd};

  const zz = Math.min(picFit(ctx, best.a, maxW, 800, 52, true), picFit(ctx, best.b, maxW, 800, 52, true));
  picText(ctx, best.a, x, y - zz*0.5, {w:800, size:zz, head:true, align, fit:maxW});

function picRound(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
// the sets shown: every set with a score or a stat

// A team match: the same top, then the team's numbers, every player with a stat, and set by set.

  picTiles(ctx, [[String(pts(c)), capsName(L('Points')), PIC.ink], [String(errs(c)), capsName(L('Errors')), PIC.ink], [String(c.ace), capsName(L('Aces')), PIC.ink], [String(c.block), capsName(L('Blocks')), PIC.ink]], W, P);

    y += 64;
  });

// Four number tiles under the name (the first in volt).

// any alphabet stays (spike-sheet-ολυμπιακός-2026-10-07.jpg); only spaces and signs become dashes

// Made ahead, when the match page opens: iOS only allows the share sheet straight from a tap,
// so the picture must already exist when the button is pressed.
async function prepPicture(m){
  const key = picKey(m);

  try{ await Promise.race([document.fonts.load('800 60px "Archivo"'), document.fonts.load('800 60px "Roboto Condensed"', 'Ω'), new Promise(r => setTimeout(r, 1500))]); }catch(e){}

  const blob = await new Promise(r => drawReport(m).toBlob(r, 'image/jpeg', 0.92));

  S.pic = {key, id:m.id, file:new File([blob], picName(m), {type:'image/jpeg'})};
  return S.pic;

  const pic = S.pic && S.pic.key === picKey(m) ? S.pic : null;
  // not made yet (tapped straight away): make it, then try; a phone that refuses a late share asks for one more tap
  if (!pic){ prepPicture(m).then(p => p && openShare(m, p, true)); return; }

function openShare(m, pic, late){

  if (navigator.canShare && navigator.canShare(data)){
    navigator.share(data).catch(err => {

}

  <div class="row" style="align-items:center"><div><div class="kicker">${L(m.result==='W'?'Final · Win':m.result==='L'?'Final · Loss':'Final')}${m.score?' '+esc(m.score):''}</div><h2>${vsLine(m)}</h2></div></div>
  ${scoreBug(m, a, {live:false})}
  ${tiles(c, {pm:a.pm, min:mins(playMs(m)), pmNote:`<em>${L('{a} won, {b} lost', {a:a.plus, b:a.minus})}</em>`, ptsNote:`<em>${L('{v} per set', {v:fmtVir(pts(c)/setsPlayed(m))})}</em>`})}
  <div class="row">
    <button class="btn btn-or" id="b-share" data-id="${m.id}" style="flex:1">${L('Share picture')}</button>
  </div>
  ${pctRows(c)}
  ${setCards(m, a)}
  ${a.stints.length ? `<section class="sec"><div class="sec-h"><h3>${L('Time on court')}</h3><span class="note">${nL(a.stints.length, '{n} spell', '{n} spells')}</span></div><div class="stints">${a.stints.map(st=>`
    <div class="stint"><span>${L('On at {score} (set {n})', {score:`<b>${st.inUs}–${st.inThem}</b>`, n:st.inSet})} · ${st.outSet!=null?L('off at {score} (set {n})', {score:`<b>${st.outUs}–${st.outThem}</b>`, n:st.outSet}):L('to the end')}${st.dur?' · '+L('{n} min', {n:mins(st.dur)}):''}</span><b class="${pmClass(st.plus-st.minus)}">${fmtPM(st.plus-st.minus)}</b></div>`).join('')}</div></section>` : ''}
  ${passTable([m])}
  <details class="more sec"><summary>${L('Full table')}</summary><span class="note">${esc(pName())}${S.player.num?' #'+esc(S.player.num):''}</span>${boxTable(rows,L('Sets'))}${legend()}</details>
  ${a.feed.length ? `<section class="sec"><div class="sec-h"><h3>${L('Play by play')}</h3><span class="note">${L('{n} events', {n:a.feed.length})}</span></div><div style="max-height:320px;overflow-y:auto">${feedHTML(m, a.feed.slice().reverse())}</div></section>` : ''}
  <div class="row">
    <button class="btn btn-dk" id="b-resume" data-id="${m.id}">${L('Keep tracking')}</button>
    <button class="btn btn-del ${armed?'armed':''}" id="b-del" data-id="${m.id}">${armed?L('Tap again to delete'):L('Delete')}</button>
  </div>
  ${newMatchBtn()}
  <button class="btn btn-dk" data-view="history">‹ ${L('Back to season')}</button>`;
}

function historyView(){
  const all = Object.values(S.matches).sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  // team matches have their own season, next to the player's
  // each saved team has its own season; a team shows here once it has a match
  // (a deleted team keeps its own season, under its old name)
  const slots = [...SLOTS.filter(k => all.some(m => isTeam(m) && seasonKey(m) === k)), ...new Set(all.filter(m => isTeam(m) && m.teamGone).map(seasonKey))];
  // the one-player season only for someone who has one (a player card or a one-player match)
  const solo = !!S.player.name || all.some(m => !isTeam(m));
  const mode = slots.includes(S.seasonMode) ? S.seasonMode : slots.length && (!solo || (S.seasonMode !== 'player' && all.every(isTeam))) ? slots[0] : 'player';
  if (mode !== 'player') S.seasonMode = mode;
  const seg = slots.length ? `<div><div class="seg" role="group" aria-label="${L('Season of')}">
    ${solo ? `<button data-season="player" aria-pressed="${mode==='player'}">${esc(pName())}</button>` : ''}${slots.map(k => `<button data-season="${esc(k)}" aria-pressed="${mode===k}">${esc(seasonLabel(k))}</button>`).join('')}</div></div>` : '';
  if (mode !== 'player') return teamSeason(all.filter(m => isTeam(m) && seasonKey(m) === mode), seg, mode);
  const list = all.filter(m => !isTeam(m));
  if (!list.length) return `${seg}<section class="panel"><h2>${L('Season')}</h2><p class="empty">${L('No matches yet.')}</p></section>${newMatchBtn()}`;
  const total = Object.fromEntries(STATS.map(s=>[s.k,0])); let time = 0, w = 0, l = 0, pm = 0, bestPts = null, bestVir = null;
  const per = list.map(m => { const c = counts(m), a = analyze(m); STATS.forEach(s=> total[s.k]+=c[s.k]); time += playMs(m); pm += a.pm; if (m.result==='W') w++; if (m.result==='L') l++;
    if (!bestPts || pts(c) > bestPts.v) bestPts = {v:pts(c), m}; if (!bestVir || vir(c) > bestVir.v) bestVir = {v:vir(c), m};
    return {m, c, a}; });
  const n = list.length, avg = v => (v/n).toFixed(1);
  const rows = per.map(p=>({label: fmtDate(p.m.date)+' '+p.m.opp, c:p.c})).concat({label:L('Season'), c:total, sum:true});
  return `${seg}
  <section class="player">
    <div class="jersey">${esc(S.player.num || '?')}</div>
    <div class="pinfo"><div class="pname${nmLong(pName())}">${esc(pName())}</div><div class="note">${esc(S.player.pos ? L(S.player.pos) : '')}${S.player.pos?' · ':''}${nL(n, '{n} match', '{n} matches')} · ${L('{w}W {l}L', {w, l})}</div>
      <div class="pline">
        <div><b>${avg(pts(total))}</b><span>${L('Pts / match')}</span></div>
        <div><b>${avg(vir(total))}</b><span>${L('Rtg / match')}</span></div>
        <div><b class="${pmClass(pm)}">${fmtPM(pm)}</b><span>${L('Season +/-')}</span></div>
      </div>
    </div>
  </section>
  ${tiles(total, {pm, min:mins(time), ptsNote:`<em>${L('best {v} vs {opp}', {v:bestPts.v, opp:esc(bestPts.m.opp)})}</em>`, virNote:`<em>${L('best {v}', {v:fmtVir(bestVir.v)})}</em>`, minNote:`<em>${L('{v} a match', {v:Math.round(mins(time)/n)})}</em>`})}
  ${pctRows(total)}
  ${seasonChart(list)}
  ${newMatchBtn()}
  <section class="sec"><div class="sec-h"><h3>${L('Game log')}</h3><button class="lnk" id="b-editlist">${S.editList?L('Done'):L('Remove matches')}</button></div>
  <div class="mlist">${per.map(({m,c,a})=>{ const live = m.id===S.activeId, armed = S.armed==='x-'+m.id;
    const info = `<span class="res ${live?'live':(m.result||'')}">${live?L('LIVE'):resLetter(m.result)}</span>
      <span><div class="t">${L('vs {opp}', {opp:esc(m.opp)})}</div><div class="d">${esc(fmtDate(m.date))}${m.score?' · '+esc(m.score):''} · ${L('{n} min', {n:mins(playMs(m))})} · <span class="${pmClass(a.pm)}">${fmtPM(a.pm)}</span></div></span>`;
    // remove mode: the row stops opening the match and gets its own delete button
    return S.editList ? `
    <div class="mitem medit">${info}
      <button class="btn btn-del xdel ${armed?'armed':''}" data-xdel="${m.id}" aria-label="${armed?L('Tap again to delete'):L('Delete')} ${L('vs {opp}', {opp:esc(m.opp)})}">${armed?L('Sure?'):L('Delete')}</button>
    </div>` : `
    <button class="mitem" data-open="${m.id}">${info}
      <span class="p vir">${fmtVir(vir(c))}<small>${L('RTG')}</small></span>
      <span class="p">${pts(c)}<small>${L('PTS')}</small></span>
    </button>`; }).join('')}</div>
  ${S.editList ? `<p class="note">${L('Tap Delete, then tap again to remove the match from every phone.')}</p>` : ''}</section>
  ${passTable(list)}
  <section class="sec"><div class="sec-h"><h3>${L('Season box score')}</h3></div>${boxTable(rows,L('Match'))}${legend()}</section>`;
}
