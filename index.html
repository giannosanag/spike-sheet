// Season: one bar per match (oldest left), points or rating. Tap a bar to read it.
function seasonChart(list){
  if (list.length < 2) return '';
  const metric = S.chartMetric || 'pts';
  const ms = list.slice(0, 12).reverse();
  const val = m => { const c = counts(m); return metric === 'pts' ? pts(c) : Math.round(vir(c)*10)/10; };
  const vals = ms.map(val);
  const sel = S.chartSel && ms.find(m => m.id === S.chartSel) ? S.chartSel : ms[ms.length-1].id;
  const W = 320, H = 150, top = 16, bot = 22, hi = Math.max(1, ...vals), lo = Math.min(0, ...vals);
  const y = v => top + (hi - v) * (H - top - bot) / (hi - lo), base = y(0);
  const slot = W / ms.length, bw = Math.min(28, slot * 0.6);
  const bars = ms.map((m, i) => {
    const v = vals[i], x = i*slot + (slot-bw)/2, y1 = y(Math.max(v,0)), y2 = y(Math.min(v,0)), r = Math.min(4, (y2-y1)/2, bw/2);
    // rounded at the data end only, square on the baseline
    const d = v >= 0
      ? `M${x},${y2} V${y1+r} Q${x},${y1} ${x+r},${y1} H${x+bw-r} Q${x+bw},${y1} ${x+bw},${y1+r} V${y2} Z`
      : `M${x},${y1} V${y2-r} Q${x},${y2} ${x+r},${y2} H${x+bw-r} Q${x+bw},${y2} ${x+bw},${y2-r} V${y1} Z`;
    const isSel = m.id === sel, isMax = v === hi && v > 0;
    const lab = (isSel || isMax) ? `<text class="v" x="${x+bw/2}" y="${v >= 0 ? y1-4 : Math.min(y2+11, H-bot-2)}" text-anchor="middle">${v}</text>` : '';
    const dl = ms.length <= 8 || i === 0 || i === ms.length-1 ? `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(shortDate(m.date))}</text>` : '';
    return `<path class="bar${isSel?' sel':''}" d="${d}"/>${lab}${dl}<rect class="hit" data-csel="${m.id}" x="${i*slot}" y="0" width="${slot}" height="${H}"><title>${esc('vs '+m.opp)}: ${v}</title></rect>`;
  }).join('');
  const sm = ms.find(m => m.id === sel), sc = counts(sm), sa = analyze(sm);
  return `<section class="sec chart"><div class="sec-h"><h3>Progress</h3>
      <div class="seg" role="group" aria-label="Chart shows"><button data-metric="pts" aria-pressed="${metric==='pts'}">Points</button><button data-metric="vir" aria-pressed="${metric==='vir'}">Rating</button></div></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${metric==='pts'?'Points':'Rating'} per match, last ${ms.length} matches">
      ${bars}<line class="base" x1="0" x2="${W}" y1="${base}" y2="${base}"/></svg>
    <div class="chart-d"><b>vs ${esc(sm.opp)}</b> · ${esc(fmtDate(sm.date))} · ${pts(sc)} pts · rating ${fmtVir(vir(sc))} · <span class="${pmClass(sa.pm)}">${fmtPM(sa.pm)}</span></div>
  </section>`;
}
function shortDate(d){ try{ const x = new Date(d+'T12:00'); return x.getDate() + '/' + (x.getMonth()+1); }catch(e){ return ''; } }

/* ---------- report picture ---------- */
// The match report drawn on a canvas (1080 wide, Instagram/WhatsApp friendly), always dark.
const PIC = {bg:'#000000', soft:'#161616', soft2:'#2A2A2A', ink:'#FFFFFF', muted:'#9E9EA0', volt:'#D7FF3A', voltInk:'#111111', pos:'#3DDC84', neg:'#FF5A5F'};
function picFont(ctx, weight, size, head){
  ctx.font = `${weight} ${size}px ${head ? '"Archivo","Roboto Condensed","Arial Narrow",Arial,sans-serif' : '"Archivo",Helvetica,Arial,sans-serif'}`;
  try{ ctx.fontStretch = head ? 'ultra-condensed' : 'normal'; }catch(e){}
}
// largest size up to `size` at which the text fits in maxW
function picFit(ctx, text, maxW, weight, size, head){
  for (let z = size; z > 12; z -= 2){ picFont(ctx, weight, z, head); if (ctx.measureText(text).width <= maxW) return z; }
  return 12;
}
function picText(ctx, text, x, y, o){
  o = o || {};
  if (o.fit) picFit(ctx, text, o.fit, o.w || 800, o.size, o.head); else picFont(ctx, o.w || 500, o.size || 30, o.head);
  ctx.fillStyle = o.color || PIC.ink; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic';
  ctx.fillText(text, x, y);
}
// capitals the Greek way: no accents on capital letters
const capsName = t => greekPlain(String(t||'').toUpperCase());
// a team name: one line when it fits big enough, otherwise two balanced lines
function picTeam(ctx, text, x, y, maxW, align){
  text = capsName(text);
  const z = picFit(ctx, text, maxW, 800, 64, true);
  const ws = text.split(/\s+/);
  if (z >= 46 || ws.length < 2){ picText(ctx, text, x, y, {w:800, size:64, head:true, align, fit:maxW}); return; }
  let best = null;
  picFont(ctx, 800, 50, true);
  for (let i = 1; i < ws.length; i++){
    const a = ws.slice(0,i).join(' '), b = ws.slice(i).join(' '), wd = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
    if (!best || wd < best.wd) best = {a, b, wd};
  }
  const zz = Math.min(picFit(ctx, best.a, maxW, 800, 52, true), picFit(ctx, best.b, maxW, 800, 52, true));
  picText(ctx, best.a, x, y - zz*0.5, {w:800, size:zz, head:true, align, fit:maxW});
  picText(ctx, best.b, x, y + zz*0.5, {w:800, size:zz, head:true, align, fit:maxW});
}
function picRound(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
// the sets shown: every set with a score or a stat
const picSets = (m, a) => Object.keys(a.score).map(Number).sort((x,y)=>x-y).filter(n => { const x = a.score[n], cs = counts(m, n); return x.us || x.them || pts(cs) || errs(cs); });
function drawReport(m){
  if (isTeam(m)) return drawTeamReport(m);
  const c = counts(m), a = analyze(m), court = setCourt(m), sets = picSets(m, a);
  // sets start at y 1290 (after three 96-high bars from 990); the footer needs 90 below the last line
  const W = 1080, P = 72, H = 1290 + sets.length * 64 + (passLine(m) ? 60 : 0) + 90;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  picHead(ctx, m, a, sets, W, H, P);
  // player
  const py = 640;
  ctx.fillStyle = PIC.volt; ctx.beginPath(); ctx.arc(P+64, py, 64, 0, 7); ctx.fill();
  picText(ctx, S.player.num || '?', P+64, py+2, {w:800, size:70, head:true, color:PIC.voltInk, align:'center', base:'middle'});
  picText(ctx, capsName(pName()), P+160, py+10, {w:800, size:76, head:true, fit:W-P-P-160});
  picText(ctx, [S.player.pos, `${fmtVir(pts(c)/setsPlayed(m))} points per set`].filter(Boolean).join(' · '), P+160, py+58, {size:30, color:PIC.muted, fit:W-P-P-160, w:500});
  // hero numbers
  picTiles(ctx, [[String(pts(c)), 'POINTS', PIC.ink], [fmtVir(vir(c)), 'RATING', PIC.ink], [fmtPM(a.pm), '+/-', a.pm > 0 ? PIC.pos : a.pm < 0 ? PIC.neg : PIC.ink], [String(mins(playMs(m))), 'MINUTES', PIC.ink]], W, P);
  // attack / serve / reception
  let y = picBars(ctx, c, W, P, 990);
  // set by set
  y += 12;
  sets.forEach(n => {
    const x = a.score[n], cs = counts(m, n), cr = court[n] || {onR:0, pm:0}, p = pts(cs), e = errs(cs);
    ctx.fillStyle = PIC.soft; picRound(ctx, P, y-40, W-2*P, 54, 14); ctx.fill();
    picText(ctx, `SET ${n}`, P+22, y-4, {w:800, size:34, head:true});
    picText(ctx, `${x.us}–${x.them}`, P+170, y-4, {w:700, size:30});
    if (typedOnly(m, n)){ picText(ctx, 'score typed in, no stats', P+330, y-4, {size:30, color:PIC.muted}); y += 64; return; }
    picText(ctx, `${p} pt${p === 1 ? '' : 's'} · ${e} error${e === 1 ? '' : 's'}`, P+330, y-4, {size:30, color:PIC.muted});
    if (cr.onR) picText(ctx, fmtPM(cr.pm), W-P-22, y-4, {w:700, size:30, align:'right', color:cr.pm > 0 ? PIC.pos : cr.pm < 0 ? PIC.neg : PIC.ink});
    else picText(ctx, 'bench', W-P-22, y-4, {size:28, align:'right', color:PIC.muted});
    y += 64;
  });
  const pl = passLine(m);
  if (pl) { picText(ctx, pl, P, y+14, {size:28, color:PIC.muted, fit:W-2*P, w:500}); y += 60; }
  return cv;
}
// A team match: the same top, then the team's numbers, every player with a stat, and set by set.
function drawTeamReport(m){
  const c = counts(m), a = analyze(m), sets = picSets(m, a), rows = playerRows([m]);
  // the flow line (side-out, where the points came from) under the bars
  const sv = serveStats(m).tot, ps = pointSources(m);
  const flow = [sv.soOf ? `Side-out ${pct100(sv.so, sv.soOf)}%` : '', sv.bpOf ? `Break points ${pct100(sv.bp, sv.bpOf)}%` : '', `Earned ${ps.earned}`, `Their errors ${ps.theirErr}`, `Our errors ${ps.given}`].filter(Boolean).join('  ·  ');
  // players start at 1360 (after the bars from 990 and a heading), 58 each; sets 64 each; footer 90; flow line 56
  const W = 1080, P = 72, H = 1360 + 56 + rows.length * 58 + 40 + sets.length * 64 + 90;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  picHead(ctx, m, a, sets, W, H, P);
  // the team
  const py = 640, name = homeName(m);
  ctx.fillStyle = PIC.volt; ctx.beginPath(); ctx.arc(P+64, py, 64, 0, 7); ctx.fill();
  picText(ctx, capsName(name[0] || 'T'), P+64, py+2, {w:800, size:70, head:true, color:PIC.voltInk, align:'center', base:'middle'});
  picText(ctx, capsName(name), P+160, py+10, {w:800, size:76, head:true, fit:W-P-P-160});
  const np = rows.filter(r => r.num).length;
  picText(ctx, `Whole team · ${np} player${np === 1 ? '' : 's'} with stats`, P+160, py+58, {size:30, color:PIC.muted, fit:W-P-P-160, w:500});
  picTiles(ctx, [[String(pts(c)), 'POINTS', PIC.ink], [String(errs(c)), 'ERRORS', PIC.ink], [String(c.ace), 'ACES', PIC.ink], [String(c.block), 'BLOCKS', PIC.ink]], W, P);
  let y = picBars(ctx, c, W, P, 990);
  picText(ctx, flow, P, y + 6, {size:28, color:PIC.muted, fit:W-2*P, w:500});
  y += 56;
  // players, best scorer first: points, errors, rating
  // (taps left without a number are a row too, so the column adds up to the tile above)
  y += 30;
  if (rows.length){
    picText(ctx, 'PLAYERS', P, y, {w:800, size:34, head:true});
    [['PTS', W-P-300], ['ERR', W-P-150], ['RTG', W-P]].forEach(([t, x]) => picText(ctx, t, x, y, {w:600, size:24, color:PIC.muted, align:'right'}));
  }
  y += 58;
  rows.forEach((r, i) => {
    if (i % 2 === 0){ ctx.fillStyle = PIC.soft; picRound(ctx, P-12, y-40, W-2*P+24, 54, 12); ctx.fill(); }
    if (r.num) picText(ctx, '#' + r.num, P+8, y-4, {w:800, size:34, head:true, color:PIC.volt});
    picText(ctx, r.num ? r.name || '' : 'No player', P+100, y-4, {w:600, size:30, fit:W-P-300-60-(P+100), color:r.num ? PIC.ink : PIC.muted});
    picText(ctx, String(pts(r.c)), W-P-300, y-4, {w:700, size:32, align:'right'});
    picText(ctx, String(errs(r.c)), W-P-150, y-4, {w:700, size:32, align:'right', color:PIC.muted});
    picText(ctx, fmtVir(vir(r.c)), W-P, y-4, {w:700, size:32, align:'right'});
    y += 58;
  });
  // set by set: the team's points and errors
  y += 40;
  sets.forEach(n => {
    const x = a.score[n], cs = counts(m, n), p = pts(cs), e = errs(cs);
    ctx.fillStyle = PIC.soft; picRound(ctx, P, y-40, W-2*P, 54, 14); ctx.fill();
    picText(ctx, `SET ${n}`, P+22, y-4, {w:800, size:34, head:true});
    picText(ctx, `${x.us}–${x.them}`, P+170, y-4, {w:700, size:30});
    picText(ctx, typedOnly(m, n) ? 'score typed in, no stats' : `${p} pt${p === 1 ? '' : 's'} · ${e} error${e === 1 ? '' : 's'}`, P+330, y-4, {size:30, color:PIC.muted});
    y += 64;
  });
  return cv;
}

function picName(m){ return ('spike-sheet-' + (m.opp||'match') + '-' + (m.date||'')).toLowerCase().replace(/[^\p{L}\p{N}-]+/gu, '-').replace(/-+/g, '-').replace(/-$/, '') + '.jpg'; }
// Made ahead, when the match page opens: iOS only allows the share sheet straight from a tap,
// so the picture must already exist when the button is pressed.
async function prepPicture(m){
  const key = picKey(m);
  if (S.pic && S.pic.key === key) return S.pic;
  try{ await Promise.race([document.fonts.load('800 60px "Archivo"'), document.fonts.load('800 60px "Roboto Condensed"', 'Ω'), new Promise(r => setTimeout(r, 1500))]); }catch(e){}
  // JPEG: about 10x faster to make than PNG on a phone, and WhatsApp turns pictures into JPEG anyway
  const blob = await new Promise(r => drawReport(m).toBlob(r, 'image/jpeg', 0.92));
  if (!blob) return null;
  S.pic = {key, id:m.id, file:new File([blob], picName(m), {type:'image/jpeg'})};
  return S.pic;
}
const picKey = m => m.id + ':' + (m.updatedAt||0) + ':' + (S.player.updatedAt||0);
function sharePicture(m){
  const pic = S.pic && S.pic.key === picKey(m) ? S.pic : null;
  // not made yet (tapped straight away): make it, then try; a phone that refuses a late share asks for one more tap
  if (!pic){ prepPicture(m).then(p => p && openShare(m, p, true)); return; }
  openShare(m, pic, false);
}
function openShare(m, pic, late){
  const data = {files:[pic.file], title:`${homeName(m)} vs ${m.opp}`};
  if (navigator.canShare && navigator.canShare(data)){
    navigator.share(data).catch(err => {
      if (err && err.name === 'AbortError') return;
      if (late && err && err.name === 'NotAllowedError') return toast('Picture ready. Tap Share picture again.');
      savePicture(pic.file);
    });
  } else savePicture(pic.file);
}
// no share sheet (a computer): save the picture instead
function savePicture(file){
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Picture saved');
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  // a bar in the season chart (SVG, not a button)
  const cs = e.target.closest('[data-csel]'); if (cs){ S.chartSel = cs.dataset.csel; S.armed = null; return render(); }
  const t = e.target.closest('button'); if (!t || (t.type === 'submit' && t.form)) return;
  // A bar opens or closes right under the finger: the second half of a double tap must not pick a number,
  // end a set, save the match, or tap the stat that was under the bar.
  const sinceBar = Date.now() - (S.barAt||0);
  if ((t.dataset.who != null || t.dataset.pass != null || t.dataset.to != null) && sinceBar < 350) return;
  if (['b-setend','b-setkeep','b-matchend','b-matchkeep','b-resumeplay','b-toundo'].includes(t.id) && sinceBar < 500) return;
  // (Undo sits where Skip was: a double tap on Skip must not take the stat back)
  if ((t.dataset.stat || ['b-court','b-us','b-them','b-undo'].includes(t.id)) && Date.now() - (S.barClosedAt||0) < 350) return;
  const wasArmed = S.armed;
  if (t.id !== 'b-del') S.armed = null;
  // any other button closes the "who passed" picker
  if (t.dataset.pass == null && t.dataset.who == null && !t.dataset.stat){ if (!['b-undo','b-whoundo'].includes(t.id)) whoLeft(); S.tag = null; S.who = null; clearTimeout(S.tagT); }
  if (t.dataset.to == null && t.form?.id !== 'fixform'){ S.toAsk = false; S.fixAsk = false; }
  if (t.dataset.to != null){ if (t.dataset.to) return timeOut(t.dataset.to); S.barClosedAt = Date.now(); return render(); }
  // new-match form: these switch in place, so what is typed stays
  if (t.dataset.ha){ S.nfAway = t.dataset.ha === 'away'; document.querySelectorAll('[data-ha]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ha === t.dataset.ha))); return; }
  if (t.dataset.slot){
    const keep = {}; document.querySelectorAll('#newform input').forEach(i => keep[i.id] = i.type === 'checkbox' ? i.checked : i.value);
    const late = $('#f-late')?.open;
    if (S.view === 'team' && teamDirty() && !saveTeamForm()) return;
    pickSlot(t.dataset.slot);
    if (S.view === 'team'){ dropDraft(); return render(); }
    render();
    Object.entries(keep).forEach(([id, v]) => { const i = document.getElementById(id); if (i){ if (i.type === 'checkbox') i.checked = v; else if (id !== 'f-home') i.value = v; } });
    if (late) $('#f-late').open = true;
    return;
  }
  if (t.dataset.fix != null){
    const m = S.matches[S.view === 'match' ? S.openId : S.activeId];
    if (m){ S.who = {mid:m.id, i:+t.dataset.fix, fix:1}; S.barAt = Date.now(); }
    return render();
  }
  // the team page opened from the new-match form: Save team leads back there
  // leaving the team page: what was typed is saved first, or the page stays and says what is missing.
  // Back to a live match is never blocked: the rally goes on, the typing waits on the team page.
  let waits = false;
  if (t.dataset.view && S.view === 'team' && teamDirty() && !saveTeamForm()){ if (!(t.dataset.view === 'live' && S.activeId)) return; waits = true; }
  // going to the team page from the new-match form: what was typed there is waiting on the way back
  if (t.dataset.view && t.closest('#newform')) S.nfDraft = Object.fromEntries(['f-opp','f-date','f-team','f-sets','f-now'].map(id => [id, $('#'+id).value]));
  if (t.dataset.view){
    // during a team match the team page shows that match's team, so a late player reaches the who bar
    const lm = S.activeId && S.matches[S.activeId];
    if (t.dataset.view === 'team' && isTeam(lm) && slotOf(lm) !== S.slot) pickSlot(slotOf(lm));
    if (S.view === 'team' && !waits) dropDraft();
    S.teamFrom = t.dataset.view === 'team' && !!t.closest('#newform'); S.view = t.dataset.view; S.openId = null; S.editList = false; render(); window.scrollTo(0,0);
    if (waits) toast('Team not saved yet: finish it on the Team page');
    return; }
  // Season list in remove mode: first tap arms the row, second tap deletes it
  if (t.dataset.xdel){
    const id = t.dataset.xdel;
    if (wasArmed === 'x-'+id){ if (Date.now() - (S.armAt||0) < 400){ S.armed = wasArmed; return; } return removeMatch(id); }
    return arm('x-'+id);
  }
  if (t.dataset.pass != null) return setPasser(t.dataset.pass);
  if (t.dataset.who != null) return setWho(t.dataset.who);
  if (t.dataset.tp){ const slot = S.view === 'match' ? slotOf(S.matches[S.openId]) : SLOTS.includes(S.seasonMode) ? S.seasonMode : 'team';
    S.view = 'tplayer'; S.tpNum = t.dataset.tp; S.seasonMode = slot; render(); window.scrollTo(0,0); return; }
  if (t.dataset.season){ S.seasonMode = t.dataset.season; S.editList = false; return render(); }
  // new-match form: switch without redrawing, so what is typed stays
  if (t.dataset.track){
    S.track = t.dataset.track; LS.set('ss.track', S.track);
    document.querySelectorAll('[data-track]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.track === S.track)));
    const ls = $('#l-starter'); if (ls) ls.hidden = S.track === 'team';
    ['#h-team', '#h-player', '#b-addp'].forEach((id, i) => { const el = $(id); if (el) el.hidden = (S.track === 'team') === (i > 0); });
    const gt = $('#g-team'); if (gt) gt.hidden = S.track !== 'team';
    const bs = $('#b-start'); if (bs) bs.hidden = S.track === 'team' && !S.team.players.length;
    const fh = $('#f-home'); if (fh && S.track === 'team') fh.value = S.team.name || '';
    return;
  }
  if (t.dataset.rm != null){ const d = readTeamRaw(); d.players.splice(+t.dataset.rm, 1); keepDraft(d); return render(); }
  if (t.id === 'b-addrow'){ const d = readTeamRaw(); d.players.push({num:'', name:''}); keepDraft(d); render(); const r = document.querySelectorAll('.t-num'); if (r.length) r[r.length-1].focus(); return; }
  if (t.dataset.stat) return tap(t.dataset.stat);
  if (t.dataset.set) return pickSet(+t.dataset.set);
  // the first server of the set on screen (side-out % in the report)
  if (t.dataset.serve){ const m = S.matches[S.activeId]; if (m){ m.serve = Object.assign({}, m.serve, {[S.set]: t.dataset.serve}); save(m); } return render(); }
  if (t.dataset.metric){ S.chartMetric = t.dataset.metric; return render(); }
  if (t.dataset.open){
    if (t.dataset.open === S.activeId){ S.view = 'live'; } else { S.view = 'match'; S.openId = t.dataset.open; }
    render(); window.scrollTo(0,0); return;
  }
  switch (t.id){
    case 'b-us': return teamPoint('us');
    case 'b-them': return teamPoint('them');
    case 'b-endset': case 'b-setend': return endSet();
    case 'b-setkeep': S.keepSet = t.dataset.key; return render();
    // kept on the match, so a reload or a locked phone does not ask again
    case 'b-matchkeep': { const m = S.matches[S.activeId]; m.keepOver = overKey(m); save(m); return render(); }
    case 'b-matchend': { const {w, l} = setsWon(S.matches[S.activeId]); return finishMatch(w > l ? 'W' : 'L', w + '-' + l); }
    case 'b-court': return toggleCourt();
    case 'b-toteam': return switchToTeam();
    case 'b-toplayer': return switchToPlayer();
    case 'b-timeout': S.toAsk = true; S.barAt = Date.now(); return render();
    case 'b-fix': S.fixAsk = true; S.barAt = Date.now(); render(); $('#fix-us')?.select(); return;
    case 'b-fixno': S.fixAsk = false; S.barClosedAt = Date.now(); return render();
    case 'b-undo': case 'b-whoundo': return undo();
    // the freeze closes under the finger; a tap synced in from another phone since is not taken back
    case 'b-toundo': { const m = S.matches[S.activeId], l = m?.log?.[m.log.length-1]; S.barClosedAt = Date.now(); return l?.k === 'to' ? undo() : resumePlay(); }
    case 'b-resumeplay': return resumePlay();
    case 'b-signin': return window.SS_auth ? window.SS_auth.signIn() : toast("Can't reach Google. Check the internet.");
    case 'b-signout':
      if (!window.SS_auth) return;
      // signing out takes the matches off this phone: the account must have them all first
      if (navigator.onLine === false) return toast('No internet. Sign out when it is back, so nothing is lost.');
      clearTimeout(S.flushT); await flush();
      // waiting saves: wait. A save the account refused will not go through by waiting: signing out is the cure.
      if (Object.keys(S.pending).length && !S.saveFailed) return toast('Still saving to your account. Try again in a moment.');
      toast('Signing out…');
      return window.SS_auth.signOut();
    case 'b-finish': {
      // "3-1" sets the result; Won with "1-3" is asked about, not saved
      let res = $('#fin-res').value; const sc = $('#fin-score').value.trim(), x = /^(\d+)\s*[-–:.\/]\s*(\d+)$/.exec(sc);
      if (x && +x[1] !== +x[2]){ const r = +x[1] > +x[2] ? 'W' : 'L'; if (res && res !== r) return toast(`${res === 'W' ? 'Won' : 'Lost'} with sets ${x[1]}-${x[2]}? Check the result`); res = r; }
      return finishMatch(res, x ? x[1] + '-' + x[2] : sc); }
    case 'b-resume': return resume(t.dataset.id);
    case 'b-closenew': S.choose = false; return closeAndNew();
    case 'b-continue': S.choose = false; render(); window.scrollTo(0,0); return;
    case 'b-editlist': S.editList = !S.editList; return render();
    case 'b-del':
      if (S.armed === 'del-'+t.dataset.id) { if (Date.now() - (S.armAt||0) < 400) return; S.armed = null; return removeMatch(t.dataset.id); }
      return arm('del-'+t.dataset.id);
    // the report as a picture, through the phone's share sheet (WhatsApp, Messages...)
    case 'b-share': return sharePicture(S.matches[t.dataset.id]);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'passform') return setPasser($('#pass-other').value);
  if (e.target.id === 'whoform') return setWho($('#who-other').value);
  if (e.target.id === 'teamform'){
    if (!saveTeamForm()) return;
    if (S.teamFrom && S.team.players.length){ S.teamFrom = false; S.view = 'live'; S.track = 'team'; LS.set('ss.track', 'team'); window.scrollTo(0,0); }
    return render();
  }
  if (e.target.id === 'fixform') return fixScore(+jnum($('#fix-us').value || 0), +jnum($('#fix-them').value || 0));
  if (e.target.id === 'newform' && trackMode() === 'team' && !S.team.players.length){ S.view = 'team'; return render(); }
  if (e.target.id === 'newform'){
    const sets = parseScores($('#f-sets').value), now = parseScores($('#f-now').value);
    if (!sets) return toast('Sets already played: type them like 25-20, 22-25');
    if (!now || now.length > 1) return toast('Score now: type it like 10-12');
    if (sets.length >= 5) return toast('At most 4 sets already played');
    if ([0, 1].some(i => sets.filter(s => s[i] > s[1-i]).length >= 3)) return toast('Those sets already finish the match');
    startMatch({opp:$('#f-opp').value.trim(), home:$('#f-home').value.trim(), date:$('#f-date').value, team:$('#f-team').value.trim(), starter:$('#f-starter').checked, mode:trackMode(), away:!!S.nfAway, sets, now:now[0]});
  }
  if (e.target.id === 'pform'){
    S.player = Object.assign({}, S.player, {name:$('#p-name').value.trim(), num:$('#p-num').value.trim(), pos:$('#p-pos').value});
    savePlayer(); toast('Player saved'); S.view = S.activeId || !Object.keys(S.matches).length ? 'live' : 'history'; render();
  }
});
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#teamform')) keepDraft(readTeamRaw()); });
window.addEventListener('pagehide', () => { backup(); flush(); });
// back from the browser's page cache: another copy of the app may have changed things meanwhile
window.addEventListener('pageshow', e => { if (e.persisted){ restore(); if (!isTyping()) render(); } });
// Android Back (and Escape on a computer): first close the open bar, then go back to Live; only Back on
// Live with nothing open leaves the app. The time-out screen stays until Resume play.
function goBack(){
  const m = S.activeId && S.matches[S.activeId];
  if (S.view === 'live' && m && m.toOn) return true;
  if (S.who || S.tag || S.toAsk || S.fixAsk){ whoLeft(); S.who = null; S.tag = null; S.toAsk = false; S.fixAsk = false; clearTimeout(S.tagT); S.barClosedAt = Date.now(); render(); return true; }
  if (S.view !== 'live'){
    // the team page: saved like leaving it by a tab; refused, the typing waits there
    if (S.view === 'team'){ if (teamDirty() && !saveTeamForm()) toast('Team not saved yet: finish it on the Team page'); else dropDraft(); }
    S.view = 'live'; S.openId = null; S.editList = false; render(); window.scrollTo(0,0); return true; }
  return false;
}
history.pushState({ss:1}, '');
window.addEventListener('popstate', () => {
  if (goBack()) return history.pushState({ss:1}, '');
  // nothing to close: a second Back straight after (within 2 s, no tap between) leaves the app, a stray one does not
  toast('Press Back again to leave');
  S.guardOff = true; clearTimeout(S.guardT); S.guardT = setTimeout(rearm, 2000);
});
function rearm(){ if (S.guardOff){ S.guardOff = false; history.pushState({ss:1}, ''); } }
// any tap after the warning: Back is a "close" again, never a "leave"
document.addEventListener('pointerdown', rearm, true);
document.addEventListener('click', rearm, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !isTyping()) goBack(); });
// the same phone has the app open twice (home-screen app and a browser tab): take the other one's
// changes at once, so an old screen can never save over newer taps
window.addEventListener('storage', e => {
  if (!e.key || !(e.key.startsWith('ss.m.') || ['ss.active','ss.player','ss.team','ss.team2'].includes(e.key))) return;
  // several keys change together (one per match): one reload for the lot
  clearTimeout(S.stT); S.stT = setTimeout(() => { restore(); if (!isTyping()) render(); }, 30);
});

restore();
// asks the browser not to clear this site's data when the phone runs low (Chrome on Android grants it)
try{ navigator.storage?.persist?.(); }catch(e){}
S.choose = idleLong();
render();
if (S.activeId) keepAwake();
syncNote();
</script>

// Same small interface the app already uses: doc(path).set/delete/onSnapshot, collection(path).onSnapshot.
// Writes return at once: Firestore keeps them queued on the phone until there is signal.
function database(uid){
  const base = 'users/' + uid + '/';
  const fail = (e, p) => window.SS_writeFailed(e, p);
  const meta = {includeMetadataChanges: true};
  return {
    doc: p => ({
      set: body => { F.setDoc(F.doc(fs, base + p), body).then(window.SS_writeOk, e => fail(e, p)); return Promise.resolve(); },
      delete: () => { F.deleteDoc(F.doc(fs, base + p)).then(window.SS_writeOk, e => fail(e, p)); return Promise.resolve(); },
      onSnapshot: (cb, err) => F.onSnapshot(F.doc(fs, base + p), meta,
        s => cb({exists: s.exists(), data: () => s.data(), metadata: s.metadata}), err),
    }),
    collection: p => ({
      onSnapshot: (cb, err) => F.onSnapshot(F.collection(fs, base + p), meta,
        s => cb({docs: s.docs.map(d => ({id: d.id, data: () => d.data(), pending: d.metadata.hasPendingWrites})),
                 docChanges: () => s.docChanges().map(c => ({type: c.type, doc: {id: c.doc.id}})),
                 metadata: s.metadata}), err),
    }),
  };
}
