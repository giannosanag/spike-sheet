<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Spike Sheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Spike Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Roboto+Condensed:wght@600..800&display=swap">
<style>
/* Sportswear-app look: black on white, heavy condensed caps, pills, one volt highlight. */
:root{
  --bg:#FFFFFF; --soft:#F5F5F5; --soft2:#EDEDED; --ink:#111111; --muted:#707072; --faint:#9E9EA0; --line:#E5E5E5;
  --btn:#111111; --btn-ink:#FFFFFF; --volt:#D7FF3A; --volt-ink:#111111; --hi:#111111;
  --pos:#0E7A3A; --neg:#D30005;
  --head:"Archivo","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000000; --soft:#161616; --soft2:#222222; --ink:#FFFFFF; --muted:#9E9EA0; --faint:#6B6B6D; --line:#2A2A2A;
  --btn:#FFFFFF; --btn-ink:#111111; --volt:#D7FF3A; --volt-ink:#111111; --hi:#D7FF3A;
  --pos:#3DDC84; --neg:#FF5A5F;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --soft:#161616; --soft2:#222222; --ink:#FFFFFF; --muted:#9E9EA0; --faint:#6B6B6D; --line:#2A2A2A;
  --btn:#FFFFFF; --btn-ink:#111111; --volt:#D7FF3A; --volt-ink:#111111; --hi:#D7FF3A;
  --pos:#3DDC84; --neg:#FF5A5F;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);padding-inline:16px;padding-block:0 110px;-webkit-tap-highlight-color:transparent}
.fab-i{font-size:22px;line-height:1}
/* every button answers the finger, like a native app */
.btn,.mitem,.seg button,.setsel button,.tabs button,.brand,.xdel,.tagbar button,.lnk{transition:transform .08s,opacity .08s}
.btn:active,.xdel:active,.tagbar button:active{transform:scale(.97)}
.mitem:active,.seg button:active,.setsel button:active,.tabs button:active,.brand:active,.lnk:active{opacity:.6}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
/* no double-tap zoom: quick repeated taps on a stat must count, not zoom the page */
html,body{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.big,.stat .n,.tile b,.pline b,.clock,td,.pbp .sc,.mitem .p{font-variant-numeric:tabular-nums}
/* condensed caps display */
.brand,h2,.big,.stat .n,.tile b,.pline b,.mitem .p,.pname,.team .nm,.jersey{font-family:var(--head);font-stretch:62%;font-weight:800;text-transform:uppercase;letter-spacing:-.005em}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-size:28px;line-height:1}
.brand .ball{width:12px;height:12px;border-radius:50%;background:var(--volt);box-shadow:0 0 0 2px var(--ink)}
.brand em{font-style:normal}
.tabs{display:flex;gap:18px}
.tabs button{font-size:15px;font-weight:500;padding:6px 0;color:var(--muted);border-bottom:2px solid transparent}
.tabs button{position:relative}.tabs button::before{content:'';position:absolute;inset:-8px -4px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
/* the language, from any page */
.tabs .langb,body.playing .tabs .langb{align-self:center;padding:2px 7px;border:1.5px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;color:var(--ink)}

.note{font-size:13px;color:var(--muted)}
.kicker{font-size:13px;font-weight:500;color:var(--muted)}
h2{font-size:34px;line-height:.95;margin:0;text-wrap:balance;overflow-wrap:break-word}
h3{font-size:16px;font-weight:600;margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.panel{background:var(--soft);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.panel form{margin:0;width:100%}

label{font-size:13px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.btn{font-weight:500;font-size:15px;padding:14px 22px;border-radius:999px;text-align:center;border:1.5px solid var(--line);background:var(--bg)}
.btn-or{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn-dk{background:var(--bg)}
.btn-del{color:var(--neg)}
.btn-del.armed{background:var(--neg);color:#fff;border-color:var(--neg)}

/* score */
.bug{background:var(--soft);border-radius:20px;overflow:hidden}
.bug-top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 0;gap:8px}
.bug-top .comp{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setflag{font-size:12px;font-weight:600;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:999px;white-space:nowrap}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 18px 14px}
.team{display:flex;flex-direction:column;gap:4px;min-width:0}
.team.away{text-align:right;align-items:flex-end}
.team{position:relative}.team>.srv{position:absolute;top:5px;left:-12px;margin:0}.team.away>.srv{left:auto;right:-12px}
.team .nm{font-size:22px;line-height:1;overflow-wrap:normal;word-break:normal;hyphens:none}.team .nm.long{font-size:16px}.team .nm.xl{font-size:14px}@media (max-width:360px){.team .nm.long{font-size:13px}.team .nm.xl{font-size:11px}}
/* a name never runs into the score: smaller on small phones, and a word still too long breaks inside its own half */
.team .nm{max-width:100%;overflow-wrap:anywhere}
@media (max-width:360px){.team .nm{font-size:17px}}
@media (max-width:340px){.team .nm{font-size:15px}}
.team .sw{font-size:12px;color:var(--muted)}
.big{display:flex;align-items:center;gap:8px;font-size:84px;line-height:.85}
.big i{font-style:normal;color:var(--muted);font-size:50px}
/* a live score keeps room for two digits: the names do not re-wrap (and every button jump) at 10 */
.big.live span{min-width:2ch;text-align:center}
.big span{color:var(--muted)} .big .hi{color:var(--ink)}
.pips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 18px 14px}
.pip{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.pip.w{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}.pip.l{color:var(--muted)}
.plus{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.plus button{padding:16px 10px;min-height:44px;border-radius:999px;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;line-height:1.15}.plus button.long{font-size:13px}.plus button.xl{font-size:12px}
.plus .us{background:var(--btn);color:var(--btn-ink)}
.plus .them{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.plus button:active{transform:scale(.97)}
.bug-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 12px;gap:8px;flex-wrap:wrap}
.setsel{display:flex;gap:4px;align-items:center}
.setsel button{font-size:14px;font-weight:600;width:44px;height:44px;border-radius:50%;color:var(--muted)}
.setsel button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lnk{font-size:14px;font-weight:600;padding:12px 6px;text-decoration:underline;text-underline-offset:3px}

/* player */
.player{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:4px 0}
.jersey{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--volt);color:var(--volt-ink)}
.pinfo{min-width:0}
.pname{font-size:26px;line-height:1;overflow-wrap:anywhere}.pname.long{font-size:22px}.pname.xl{font-size:19px}
.pline{display:flex;gap:22px;margin-top:8px;flex-wrap:wrap}
.pline div{display:flex;flex-direction:column}
.pline b{font-size:30px;line-height:.95}
.pline span{font-size:12px;color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
#clock{font-variant-numeric:tabular-nums}
.choose{gap:12px}.choose p{margin:0}
.dot-ok{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pos);margin-right:7px;vertical-align:1px}
#syncnote .lnk{padding:10px 2px;margin:-10px 0;font-size:13px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pos);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}

/* stat pad */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad-err,.pad-play{grid-template-columns:repeat(5,1fr)}.pad-err .stat,.pad-play .stat{padding-inline:2px}
.stat{background:var(--soft);border-radius:16px;min-height:88px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .15s,transform .08s}
.stat:active{transform:scale(.95)}.stat.off{opacity:.6}
.stat .n{font-size:36px;line-height:.9}
.stat .l{font-size:13px;font-weight:600;line-height:1.15;text-align:center}
.stat .s{font-size:12px;color:var(--muted);line-height:1.1;text-align:center}
.stat.err .n{color:var(--neg)}
.stat.flash{background:var(--volt);color:var(--volt-ink)}
.stat.flash .s{color:var(--volt-ink)}
.undo{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.undo span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo .btn{padding:9px 18px;font-size:14px}

/* play by play */
.pbp{display:flex;flex-direction:column}
.pbp div,.pbp button{text-align:left;width:100%;display:grid;grid-template-columns:44px 56px 1fr;gap:10px;align-items:center;padding:9px 0;min-height:44px;border-bottom:1px solid var(--line);font-size:14px}
.pbp .st{font-size:12px;color:var(--muted)}
.pbp .sc{font-weight:600}
.pbp .ev.pt{font-weight:600} .pbp .ev.err{color:var(--neg)} .pbp .ev.sub{color:var(--pos);font-weight:500} .pbp .ev.team{color:var(--muted)}

/* tables */
.tbl{overflow-x:auto}
.pbpbox{max-height:320px;overflow-y:auto}
.moretop{gap:2px}
details.kpi{border-top:1px solid var(--line);padding:6px 0}details.kpi summary{font-size:15px}
.kpis{display:flex;flex-direction:column}
.kr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kr:last-child{border-bottom:0}.kr small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kr b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 8px;text-align:right;white-space:nowrap;font-size:14px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);padding-left:0}
thead th{font-size:12px;font-weight:500;color:var(--muted);border-bottom:1.5px solid var(--ink)}
tbody td{border-top:1px solid var(--line)}
tbody tr:first-child td{border-top:0}
tr.sum td{font-weight:700;border-top:1.5px solid var(--ink)}
td.k{font-weight:700}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pct{display:flex;flex-direction:column;gap:14px;background:var(--soft);border-radius:16px;padding:16px}
.pr{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:6px 12px}
.pr .pl{font-weight:600}.pr .pl small{font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.pr b{font-family:var(--head);font-stretch:62%;font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.pbar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--soft2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--hi)}
.setc{background:var(--soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.setc-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.setc-h b{font-family:var(--head);font-stretch:62%;font-weight:800;font-size:22px;text-transform:uppercase}
.setc-h span{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.setc p{margin:0;font-size:14px;line-height:1.35}.setc .m{color:var(--muted)}
details.more summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:' ›'}details.more[open] summary::after{content:' ⌄'}
/* long team names on a small phone: the switch wraps onto two lines instead of pushing the page sideways
   (22px corners: round on one line, still neat on two) */
.seg{display:inline-flex;background:var(--soft);border-radius:22px;padding:3px;max-width:100%;flex-wrap:wrap}
.seg button{font-size:13px;font-weight:600;padding:13px 16px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.tagbar .more input.sm{flex:0 1 80px;text-align:center}
.tagbar #fixform{flex-wrap:wrap}.tagbar #fixform>*{flex:1 1 40%}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickteam{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:16px 20px;border-radius:18px}
.pickteam b{font-size:18px}.pickteam small{font-size:13px;opacity:.75}
.pick button{padding:18px 8px;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-weight:700;overflow-wrap:anywhere}
.pick button small{display:block;font-size:12px;font-weight:500;margin-top:4px;opacity:.7}
.pick button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
/* New match: our team and home/away are questions, as big as "Team or player?" */
.qh{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:10px}
label.qh{margin-bottom:0;gap:8px}
.ours input{border:2px solid var(--ink);font-weight:600}
.ours .note{font-weight:400}
/* time-out: the whole screen waits for Resume play */
.freeze{position:fixed;inset:0;z-index:11;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.freeze h2{font-size:64px}
.freeze .fz-team{font-size:20px;font-weight:700}
.freeze .fz-clock{font-family:var(--head);font-stretch:62%;font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.freeze .btn{font-size:18px;font-weight:700;padding:20px}
.freeze .btn-or{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
/* the time-out card: this set at a glance; the number bar can open over the time-out page */
.freeze .tocard{background:var(--soft);border-radius:16px;padding:2px 14px;text-align:left}
.freeze .tocard .kr{font-size:14px}.freeze .tocard .kr b{white-space:normal}
.todots{display:inline-flex;gap:3px;margin-right:8px;vertical-align:1px}.todots i{width:8px;height:8px;border-radius:50%;background:var(--faint)}.todots i.w{background:var(--volt);box-shadow:0 0 0 1px var(--ink)}
.freeze ~ .tagbar{z-index:12}
/* time is up: a volt notice, and a tap anywhere goes back to the match */
.freeze .fz-up{display:none}
.freeze.up{cursor:pointer}.freeze.up .fz-clock{color:var(--muted)}
.freeze.up .fz-up{display:block;align-self:center;width:auto;background:var(--volt);color:var(--volt-ink);font-weight:800;font-size:17px;padding:12px 20px;border-radius:999px;animation:upnow 1.2s ease-in-out infinite alternate}
@keyframes upnow{to{transform:scale(1.06)}}
/* the time-outs a team has left in this set, as dots under its name */
.tod{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}.tod i{width:6px;height:6px;border-radius:50%;background:var(--ink)}.tod i.used{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}
/* team flow: who serves, season leaders */
.srv{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--volt);box-shadow:0 0 0 1.5px var(--ink);margin-right:6px;vertical-align:2px}
.serveq{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:600}
.leads{display:flex;flex-direction:column}
.lead{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.lead .lt{font-size:13px;color:var(--muted)}
.lead .lp{display:flex;flex-wrap:wrap;gap:4px 14px}
.lead button{font-size:14px;text-align:left;padding:2px 0;position:relative}.lead button::before{content:'';position:absolute;inset:-10px 0}.lead b{font-variant-numeric:tabular-nums;margin-left:3px}
/* court mode (a live team match): score, +1, every stat and Undo / Time-out / End set on one phone
   screen with no scrolling during a rally */
body.playing>.wrap{gap:10px}
body.playing header{padding-block:10px 0;gap:8px}
body.playing .brand{font-size:20px}
body.playing .tabs{gap:12px}body.playing .tabs button{font-size:14px;padding:4px 0}
/* the date line goes: the set number is on the End set button, the sets played on the pips */
body.playing .bug-top{display:none}
body.playing .score{padding-top:10px}
body.playing .serveq{flex-wrap:nowrap}
body.playing .serveq .seg{flex-wrap:nowrap;min-width:0}
body.playing .serveq .seg button{max-width:9.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a narrow phone: the question above, the two team names the full width (not cut short) */
@media (max-width:419px){body.playing .serveq{flex-direction:column;align-items:stretch;gap:6px}body.playing .serveq .seg button{flex:1;max-width:none}}
body.playing #syncnote:not(.warn){display:none}
body.playing #app{gap:10px}
body.playing .bug-top{padding-top:10px}
body.playing .score{padding:4px 18px 6px}
body.playing .big,body.watch .big{font-size:56px;gap:4px}body.playing .big i,body.watch .big i{font-size:34px}
@media (min-width:361px){body.playing .team .nm.xl,body.watch .team .nm.xl{font-size:13px}}
body.playing .pips{padding-bottom:8px}
body.playing .plus{padding-bottom:10px}
body.playing .plus button{padding:13px 10px}
/* a long team name never makes the score taller: it pushed Undo / Time-out / End set off a small phone
   (sideways the score has its own column, so the whole name stays) */
@media (orientation:portrait), (min-height:541px){
  body.playing .team .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  body.playing .plus button{white-space:nowrap}
}
body.playing .sec{gap:5px}
body.playing .sec h3{font-size:12px;font-weight:600;color:var(--muted)}
body.playing .padzone .sec-h .note{font-size:12px;line-height:1.2}
body.playing .stat{min-height:60px;padding:7px 2px 6px;border-radius:14px}
body.playing .stat .n{font-size:24px}
.padzone{display:flex;flex-direction:column;gap:10px}
.pad-n6{grid-template-columns:repeat(6,minmax(0,1fr))}.pad-n6 .stat{padding-inline:1px}.pad-n6 .stat .l{font-size:12px}.pad-n6 .stat .s{font-size:12px}
.tagbar.who .nums button.hint{box-shadow:inset 0 0 0 3px var(--volt)}
.acts{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;margin-top:8px}
.act.who{display:flex;flex-direction:column;justify-content:center;align-items:center}
.act.who small{font-size:11px;font-weight:500;opacity:.75}
.act.who.on{background:var(--volt);color:var(--volt-ink)}
/* one-player match: in / out of court, volt while on court, with the time played */
.act.crt{display:flex;flex-direction:column;justify-content:center;align-items:center}
.act.crt small{font-size:11px;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.act.crt.on{background:var(--volt);color:var(--volt-ink)}

<div class="wrap">

    <button class="brand" data-view="live" aria-label="Spike Sheet, home"><span class="ball" aria-hidden="true"></span><span>Spike <em>Sheet</em></span></button>

<script>
const STATS = [
  {k:'ace',   l:'Ace',        s:'serve point', g:'pt',  a:'ACE'},
  {k:'kill',  l:'Spike',      s:'kill',        g:'pt',  a:'SPK'},
  {k:'plase', l:'Plasé',      s:'placed over', g:'pt',  a:'PLA'},
  {k:'block', l:'Block',      s:'point',       g:'pt',  a:'BLK'},
  {k:'dig',   l:'Defence',    s:'good dig',    g:'play',a:'DEF'},
  {k:'pass',  l:'Reception',  s:'good pass',   g:'play',a:'REC'},
  // team matches grade each reception 3 / 2 / 1 (0 = the reception error); 'pass' stays for player matches and old ones
  {k:'p3',    l:'Pass 3',     s:'perfect',     g:'rec', a:'R3', team:1},
  {k:'p2',    l:'Pass 2',     s:'good',        g:'rec', a:'R2', team:1},
  {k:'p1',    l:'Pass 1',     s:'poor',        g:'rec', a:'R1', team:1},
  {k:'serve', l:'Serve in',   s:'no point',    g:'play',a:'SRV'},
  {k:'assist',l:'Set',        s:'good set',    g:'play',a:'SET'},
  {k:'att',   l:'Attack in',  s:'no point',    g:'play',a:'ATT'},
  {k:'serr',  l:'Serve',      s:'error',       g:'err', a:'SE'},
  {k:'aerr',  l:'Attack',     s:'error',       g:'err', a:'AE'},
  {k:'rerr',  l:'Reception',  s:'error',       g:'err', a:'RE'},
  {k:'berr',  l:'Block out',  s:'their point', g:'err', a:'BO', full:'Block out'},
  {k:'ferr',  l:'Net / fault',s:'error',       g:'err', a:'NF'},
  // team matches: double / lift / carry, and a team out of position (no player asked)
  {k:'bhe',   l:'Handling',   s:'double / lift', g:'err', a:'BH', full:'Ball handling error', team:1},
  {k:'pos',   l:'Position',   s:'fault',       g:'err', a:'PF', full:'Position fault', team:1, noWho:1},
];
const GROUPS = [{g:'pt',h:'Points won'},{g:'play',h:'Good plays'},{g:'err',h:'Errors'}];
// The pads of a team match: reception has its own row, graded
const TEAM_PADS = [{h:'Our points', keys:['ace','kill','plase','block']}, {h:'Reception', keys:['p3','p2','p1','rerr']},
  {h:'Good plays', keys:['dig','serve','assist','att']}, {h:'Our errors · their point', keys:['serr','aerr','berr','ferr','bhe','pos']}];
const TEAM_LBL = {rerr:{l:'Pass 0', s:'error'}};
// Basic (m.basic): the six plays that end most rallies, three to a row, for someone new to stats; Full: every stat
const BASIC_PADS = [{h:'Our points', hp:'Points won', keys:['ace','kill','block']}, {h:'Our errors · their point', hp:'Errors', keys:['serr','aerr','rerr']}];
const BYK = Object.fromEntries(STATS.map(s=>[s.k,s]));
const PT_KEYS = ['ace','kill','plase','block'];
const ERR_KEYS = ['serr','aerr','rerr','berr','ferr','bhe','pos'];
const TAG_KEYS = ['kill','plase'];
const WEIGHT = {ace:1,kill:1,plase:1,block:1,dig:1,pass:.5,p3:.5,p2:.5,p1:0,assist:.5,serve:0,att:0,serr:-1,aerr:-1,rerr:-1,berr:-.5,ferr:-1,bhe:-1,pos:-1};
// a stat that still needs a player's number (a position fault is the team's)
const needsWho = e => BYK[e.k] && !e.p && !BYK[e.k].noWho && !e.nk;

const S = {matches:{}, player:{name:'', num:'', pos:''}, teams:{team:{name:'', players:[]}, team2:{name:'', players:[]}}, slot:'team', activeId:null, view:'live', openId:null, set:1, db:null, pending:{}, flushing:false, timer:null, armed:null, unsubs:[], user:null};
// Words on screen: the English text is the key, EL holds the Greek. {name} in a text is filled from v.
// "Player|tab": one English word with two Greek ones (the part after | is not shown in English;
// without its own Greek it takes the plain word's).

// Volleyball: best of five, the match is over at three sets won. A set is won at 25 (15 in the fifth)
// with two clear, no cap (26-24, 30-28). Matches saved before 2026-10-07 keep the length they were
// played with: bestOf 3, or no bestOf at all (best of three).
const winSets = m => m && m.bestOf === 5 ? 3 : 2, lastSet = m => m && m.bestOf === 5 ? 5 : 3;
// Asked, never done by itself: some leagues play other lengths, and one wrong tap must not close a set.
function setOver(m, a){
  const sc = a.score[S.set]; if (!sc || (m.ended||[]).includes(S.set)) return null;
  const hi = Math.max(sc.us, sc.them), lo = Math.min(sc.us, sc.them);
  return hi >= (S.set >= lastSet(m) ? 15 : 25) && hi - lo >= 2 ? sc : null;
}
const overKey = m => { const {w, l} = setsWon(m); return m.id + ':' + w + '-' + l; };
function setBar(m, a){
  const sc = setOver(m, a);
  if (sc){
    const key = m.id + ':' + S.set + ':' + sc.us + '-' + sc.them;
    return S.keepSet === key ? '' : `<div class="tagbar" role="group" aria-label="${L('Set over')}">
    <div class="q">${L('Is set {n} over? ({score})', {n:S.set, score:ordS(m, sc.us, sc.them)})}</div>
    <div class="two"><button id="b-setend">${L('Yes, end set {n}', {n:S.set})}</button><button class="skip" id="b-setkeep" data-key="${key}">${L('No, keep playing')}</button></div></div>`;
  }
  const {w, l} = setsWon(m);
  if ((w >= winSets(m) || l >= winSets(m)) && m.keepOver !== overKey(m)) return `<div class="tagbar" role="group" aria-label="${L('Match over')}">
    <div class="q">${L(w > l ? 'Is the match over? {team} won {sets} in sets.' : 'Is the match over? {team} lost {sets} in sets.', {team:esc(homeName(m)), sets:w + '–' + l})}</div>

// Attacks by who passed to the player: attempts, points, errors.
function passTable(matches){

    const r = by[e.from] || (by[e.from] = {pts:0, kill:0, plase:0});
    r.pts++; r[e.k]++;
  }));

    <div class="mates">${rows.map(([n,r])=>`<div class="mate"><span style="color:var(--ink);font-size:15px;font-weight:600">${esc(n)}</span><b>${r.pts}<small>${L(r.pts === 1 ? 'point' : 'points')}</small></b><b>${r.kill}<small>${L(r.kill === 1 ? 'spike' : 'spikes')}</small></b><b>${r.plase}<small>${L('plasé')}</small></b></div>`).join('')}</div></section>`;
}
function passLine(m){
  const by = {};
  (m.log||[]).forEach(e => { if (e.from && TAG_KEYS.includes(e.k)) by[e.from] = (by[e.from]||0) + 1; });
  const t = Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`${n} ${v}`).join(', ');

// The result saved before "Keep tracking" is kept, unless the match went on for more sets since:
// then "2-1 Won" would be stale, and the count from the sets is right.
function savedResult(m, w, l){
  const sc = String(m.score||''), old = /^\d+-\d+$/.test(sc) ? sc.split('-').reduce((a,b) => a + +b, 0) : null;
  const stale = old != null && w + l > old;
  return {result: (!stale && m.result) || (w > l ? 'W' : l > w ? 'L' : ''), score: (!stale && sc) || (w||l ? w+'-'+l : '')};

// The final-whistle guess: ended sets, plus an open set only when its score already finishes it
// (a set left at 10-12 in the middle of the match is not a lost set).
function setsDone(m){
  const {score} = analyze(m); let w = 0, l = 0;
  scoredSets(score).forEach(s => { const x = score[s], hi = Math.max(x.us, x.them), lo = Math.min(x.us, x.them);
    if (!(m.ended||[]).includes(s) && !(hi >= (s >= lastSet(m) ? 15 : 25) && hi - lo >= 2)) return;
    if (x.us > x.them) w++; else if (x.them > x.us) l++; });
  return {w, l};
}

const WORDS = {ace:['ace','aces'], kill:['spike','spikes'], plase:['plasé','plasés'], block:['block','blocks'],

  dig:['άμυνα','άμυνες'], pass:['καλή υποδοχή','καλές υποδοχές'], serve:['σερβίς μέσα','σερβίς μέσα'], assist:['καλή πάσα','καλές πάσες'], att:['επίθεση μέσα','επιθέσεις μέσα'],
  serr:['σερβίς','σερβίς'], aerr:['επίθεση','επιθέσεις'], rerr:['υποδοχή','υποδοχές'], berr:['άουτ από μπλοκ μας','άουτ από μπλοκ μας'], ferr:['φιλέ / φάουλ','φιλέ / φάουλ'],
  p3:['τέλεια υποδοχή','τέλειες υποδοχές'], p2:['καλή υποδοχή','καλές υποδοχές'], p1:['κακή υποδοχή','κακές υποδοχές'], bhe:['κράτημα ή διπλή','κράτημα ή διπλή'], pos:['λάθος θέσης','λάθη θέσης']};
const nWord = (n, k) => n + ' ' + (S.lang === 'el' ? WORDS_EL : WORDS)[k][n === 1 ? 0 : 1];
const listOf = (c, keys) => keys.filter(k => c[k]).map(k => nWord(c[k], k)).join(', ');

// How the lead moved in set s, rally by rally: our lead up, theirs down, a dashed line at each time-out.

/* ---------- team flow: who served, side-out, where the points came from, runs ---------- */

function firstServer(m, s){
  if (m.serve && m.serve[s]) return m.serve[s];

    if (e.set !== s || e.late) continue;
    if (e.k === 'us' || e.k === 'them') break;

  for (let z = size; z > 12; z -= 2){ picFont(ctx, weight, z, head); if (ctx.measureText(text).width <= maxW) return z; }
  return 12;
}
function picText(ctx, text, x, y, o){
  o = o || {};
  if (o.fit) picFit(ctx, text, o.fit, o.w || 800, o.size, o.head); else picFont(ctx, o.w || 500, o.size || 30, o.head);
  ctx.fillStyle = o.color || PIC.ink; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic';
  ctx.fillText(text, x, y);

// capitals the Greek way: no accents on capital letters
const capsName = t => greekPlain(String(t||'').toUpperCase());
// a team name: one line when it fits big enough, otherwise two balanced lines
function picTeam(ctx, text, x, y, maxW, align){
  text = capsName(text);
  const z = picFit(ctx, text, maxW, 800, 64, true);
  const ws = text.split(/\s+/);
  if (z >= 46 || ws.length < 2){ picText(ctx, text, x, y, {w:800, size:64, head:true, align, fit:maxW}); return; }
  let best = null;
  picFont(ctx, 800, 50, true);
  for (let i = 1; i < ws.length; i++){
    const a = ws.slice(0,i).join(' '), b = ws.slice(i).join(' '), wd = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
    if (!best || wd < best.wd) best = {a, b, wd};
  }
  const zz = Math.min(picFit(ctx, best.a, maxW, 800, 52, true), picFit(ctx, best.b, maxW, 800, 52, true));
  picText(ctx, best.a, x, y - zz*0.5, {w:800, size:zz, head:true, align, fit:maxW});
  picText(ctx, best.b, x, y + zz*0.5, {w:800, size:zz, head:true, align, fit:maxW});
}

// A team match: the same top, then the team's numbers, every player with a stat, and set by set.

// Four number tiles under the name (the first in volt).
function picTiles(ctx, hero, W, P){

// Attack / serve / reception bars from y; returns the y after them. noErr: a line without a % names no errors.

// any alphabet stays (spike-sheet-ολυμπιακός-2026-10-07.jpg); only spaces and signs become dashes
function picName(m){ return ('spike-sheet-' + (m.opp||'match') + '-' + (m.date||'')).toLowerCase().replace(/[^\p{L}\p{N}-]+/gu, '-').replace(/-+/g, '-').replace(/-$/, '') + '.jpg'; }
// Made ahead, when the match page opens: iOS only allows the share sheet straight from a tap,
// so the picture must already exist when the button is pressed.
async function prepPicture(m){
  const key = picKey(m);
  if (S.pic && S.pic.key === key) return S.pic;
  try{ await Promise.race([document.fonts.load('800 60px "Archivo"'), document.fonts.load('800 60px "Roboto Condensed"', 'Ω'), new Promise(r => setTimeout(r, 1500))]); }catch(e){}
  // JPEG: about 10x faster to make than PNG on a phone, and WhatsApp turns pictures into JPEG anyway
  const blob = await new Promise(r => drawReport(m).toBlob(r, 'image/jpeg', 0.92));
  if (!blob) return null;
  S.pic = {key, id:m.id, file:new File([blob], picName(m), {type:'image/jpeg'})};
  return S.pic;
}
const picKey = m => m.id + ':' + (m.updatedAt||0) + ':' + (S.player.updatedAt||0) + ':' + S.lang;
function sharePicture(m){
  const pic = S.pic && S.pic.key === picKey(m) ? S.pic : null;
  // not made yet (tapped straight away): make it, then try; a phone that refuses a late share asks for one more tap
  if (!pic){ prepPicture(m).then(p => p && openShare(m, p, true)); return; }
  openShare(m, pic, false);
}
function openShare(m, pic, late){
  const data = {files:[pic.file], title:vsText(m)};
  if (navigator.canShare && navigator.canShare(data)){
    navigator.share(data).catch(err => {
      if (err && err.name === 'AbortError') return;
      if (late && err && err.name === 'NotAllowedError') return toast(L('Picture ready. Tap Share picture again.'));
      savePicture(pic.file);
    });
  } else savePicture(pic.file);
}
// no share sheet (a computer): save the picture instead
function savePicture(file){
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);

// The result as one line for WhatsApp, in the hall's order: "Pana 3–1 Oly (25–20, 22–25, 25–18, 25–23)"

// a line of text (and a link) through the phone's share sheet; without one (a computer) it is copied

// The live score link: anyone with it sees the two team names and the score (no players) as it changes, without

function liveShare(m){

// One pass over a match's rallies, per set: the biggest lead each way, points from 20-all (10-all in the deciding
// set), the side-out after each pass grade, and our serving turns (a turn starts with our first serve of the set
// or when we win the serve back). Typed-in points count for the score only.
function rallyWalk(m){
  const out = {};
  (m.log||[]).forEach(e => {
    const x = out[e.set] || (out[e.set] = {us:0, them:0, lead:{us:0, them:0}, clutch:{us:0, them:0},
      pass:{3:[0, 0], 2:[0, 0], 1:[0, 0]}, pg:null, srv:firstServer(m, e.set), turnOf:null, turns:0, run:0, best:0});
    if (e.k === 'p3' || e.k === 'p2' || e.k === 'p1') x.pg = e.k[1];
    if (e.k !== 'us' && e.k !== 'them') return;
    const w = e.k, cl = e.set >= lastSet(m) ? 10 : 20;
    if (e.late){ x[w]++; x.srv = null; x.turnOf = null; x.pg = null; return; }
    if (x.us >= cl && x.them >= cl) x.clutch[w]++;
    if (x.srv === 'them' && x.pg){ x.pass[x.pg][1]++; if (w === 'us') x.pass[x.pg][0]++; }
    x.pg = null;
    if (x.srv === 'us'){ if (x.turnOf !== 'us'){ x.turns++; x.run = 0; } if (w === 'us') x.best = Math.max(x.best, ++x.run); }
    x.turnOf = x.srv;
    x[w]++; x.srv = w;
    const d = x.us - x.them;
    if (d > 0) x.lead.us = Math.max(x.lead.us, d); else if (d < 0) x.lead.them = Math.max(x.lead.them, -d);
  });

}
// the next five rallies after each side's time-outs: [won, lost] for us
function afterTimeouts(m){

}

    h.setUint32(14, c, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, n.length, true);
    e.setUint32(0, 0x02014b50, true); e.setUint16(4, 20, true); e.setUint16(6, 20, true); e.setUint16(8, 0x0800, true); e.setUint16(14, 0x21, true);
    e.setUint32(16, c, true); e.setUint32(20, d.length, true); e.setUint32(24, d.length, true); e.setUint16(28, n.length, true); e.setUint32(42, off, true);
    parts.push(new Uint8Array(h.buffer), n, d); dir.push(new Uint8Array(e.buffer), n);
    off += 30 + n.length + d.length;
  });
  const size = dir.reduce((t, x) => t + x.length, 0), end = new DataView(new ArrayBuffer(22));

}
// sheets: [{name, rows:[[text or number, ...]], widths:[...]}]; the first row of each sheet is bold
function xlsx(sheets){
  const x = v => String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const col = i => { let t = ''; for (i++; i; i = Math.floor((i - 1) / 26)) t = String.fromCharCode(65 + (i - 1) % 26) + t; return t; };
  const NS = 'http://schemas.openxmlformats.org', XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const cell = (v, r, c) => v == null || v === '' ? '' : typeof v === 'number' && isFinite(v)
    ? `<c r="${col(c)}${r+1}"${r ? '' : ' s="1"'}><v>${v}</v></c>` : `<c r="${col(c)}${r+1}" t="inlineStr"${r ? '' : ' s="1"'}><is><t xml:space="preserve">${x(v)}</t></is></c>`;
  const sheet = sh => `${XML}<worksheet xmlns="${NS}/spreadsheetml/2006/main">${sh.widths ? `<cols>${sh.widths.map((w, i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : ''}<sheetData>${sh.rows.map((row, r) => `<row r="${r+1}">${row.map((v, c) => cell(v, r, c)).join('')}</row>`).join('')}</sheetData></worksheet>`;
  const names = sheets.map((sh, i) => (String(sh.name).replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31).trim() || 'Sheet' + (i + 1)));
  return zipStore([
    ['[Content_Types].xml', `${XML}<Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels', `${XML}<Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml', `${XML}<workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets>${names.map((n, i) => `<sheet name="${x(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels', `${XML}<Relationships xmlns="${NS}/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i+1}" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml', `${XML}<styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
    ...sheets.map((sh, i) => [`xl/worksheets/sheet${i+1}.xml`, sheet(sh)])
  ], 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
// The match as an Excel file: the match, the box score (every player, or every set for one player),
// the sets and the play by play. Scores in the hall's order, like the scoreboard.
function matchSheets(m){
  const a = analyze(m), team = isTeam(m), cols = STATS.filter(s => team || m.soloNum || !s.team), sets = scoredSets(a.score).sort((p, q) => p - q);
  const {w, l} = finalSets(m), r1 = v => Math.round(v * 10) / 10, sv = serveStats(m).sets;
  const info = [[L('Match'), vsText(m)],
    [L('Date'), m.date || ''], [L('Competition'), m.team || ''], [L('Home or away'), L(m.away ? 'Away' : 'Home')],
    [L('Result'), m.result === 'W' ? L('Won') : m.result === 'L' ? L('Lost') : ''], [L('Sets'), ordS(m, w, l)],
    ...sets.map(n => [L('Set {n}', {n}), ordS(m, a.score[n].us, a.score[n].them)])];
  const line = (lead, c) => [...lead, pts(c), r1(vir(c)), errs(c), ...cols.map(t => c[t.k] || 0)];
  const tail = [L('Points'), L('Rating'), L('Errors'), ...cols.map(t => statName(t.k))];
  const pt = team ? playTime([m]) : {}, onc = Object.keys(pt).length ? n => pt[n] ? [minutes(pt[n].ms), pt[n].pm] : ['', ''] : () => [];
  const box = team
    ? [[L('Number'), L('Name'), L('Position'), ...onc('').map((x, i) => i ? '+/-' : L('Minutes')), ...tail], ...playerRows([m]).map(r => { const p = (m.roster||[]).find(x => x.num === r.num) || {};
        return line([r.num ? +r.num : '', r.num ? r.name || '' : L('No player'), posName(p.pos), ...onc(r.num)], r.c); }), line([L('Team'), '', '', ...onc('')], counts(m))]
    : [[L('Sets'), ...tail], ...sets.map(n => line([L('Set {n}', {n})], counts(m, n))), line([L('Match')], counts(m))];
  const court = team ? null : setCourt(m);
  const setRows = [[L('Sets'), homeName(m), m.opp, L('Result'), L('Points'), L('Errors'), ...(team ? [L('Side-out') + ' %', L('Break points') + ' %', L('Longest run') + ': ' + homeName(m), L('Longest run') + ': ' + m.opp]
      : [L('Rallies on court'), '+/-'])],
    ...sets.map(n => { const x = a.score[n], cs = counts(m, n), res = (m.ended||[]).includes(n) ? L(x.us > x.them ? 'won' : x.them > x.us ? 'lost' : 'tied') : L('not finished');
      if (!team){ const cr = court[n] || {onR:0, pm:0}; return [n, x.us, x.them, res, pts(cs), errs(cs), cr.onR, cr.pm]; }
      const t = sv[n] || {}, rn = runs(m, n);
      return [n, x.us, x.them, res, pts(cs), errs(cs), t.soOf ? pct100(t.so, t.soOf) : '', t.bpOf ? pct100(t.bp, t.bpOf) : '', rn.us, rn.them]; })];
  const name = n => ((m.roster||[]).find(p => p.num === n) || {}).name || '';
  const pbp = [['#', L('Sets'), L('Score'), L('Play by play'), L('Number'), L('Name'), team ? L('Set by') : L('Pass from')],
    ...a.feed.map((f, i) => [i + 1, f.e.set, ordS(m, f.us, f.them), evLabel(f.e, m).t, f.e.p ? +f.e.p : '', f.e.p ? name(f.e.p) : '', team ? (f.e.s ? +f.e.s : '') : (f.e.from || '')])];
  return [{name:L('Match'), rows:info, widths:[18, 36]}, {name:L('Box score'), rows:box, widths:team ? [10, 18, 14] : [12]},
    {name:L('Sets'), rows:setRows}, {name:L('Play by play'), rows:pbp, widths:[6, 6, 9, 44, 10, 18, 10]}];
}
function exportMatch(m){
  if (!m) return;
  shareFile(new File([xlsx(matchSheets(m))], picName(m).replace(/\.jpg$/, '.xlsx'), {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), vsText(m));
}
// a file to the phone: the share sheet where it takes the file (iPhone), else a download (Android, computers)
function shareFile(file, title){
  const data = {files:[file], title};
  if (navigator.canShare && navigator.canShare(data)) navigator.share(data).catch(err => { if (err && err.name !== 'AbortError') saveFile(file); });
  else saveFile(file);
}
function saveFile(file){
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast(L('Saved: {name}', {name:file.name}));
}
// PDF: the page through the phone's Print (Save as PDF), every folded section open, on white paper
function printPage(){
  if (typeof window.print !== 'function') return toast(L('This browser cannot print. Open the app in Safari or Chrome.'));
  const shut = [...document.querySelectorAll('#app details:not([open])')];
  shut.forEach(d => d.open = true);

// "3 min ago", "5 h ago", else the date and time
function ago(t){
  if (!t) return '–';
  const d = Date.now() - t;
  if (d < 60e3) return L('just now');
  if (d < 3600e3) return L('{n} min ago', {n:Math.round(d / 60e3)});
  if (d < 24 * 3600e3) return L('{n} h ago', {n:Math.round(d / 3600e3)});
  const x = new Date(t), two = v => String(v).padStart(2, '0');
  return fmtDate(x.getFullYear() + '-' + two(x.getMonth() + 1) + '-' + two(x.getDate())) + ' ' + two(x.getHours()) + ':' + two(x.getMinutes());
}

      <button class="btn btn-dk" id="b-adback">‹ ${L('Back')}</button>`; }
  // everyone: the totals, the versions in use, the latest matches, then each person (a problem or a live match marked)
  const now = Date.now(), dayAgo = now - 864e5, weekAgo = now - 7 * 864e5, seen = x => (x.profile||{}).last || 0;
  const all = users.flatMap(x => x.matches.map(m => ({m, x}))), probs = x => admIssues(x.profile).filter(i => i.t > weekAgo);
  const count = vals => Object.entries(vals.reduce((t, v) => (t[v] = (t[v] || 0) + 1, t), {})).sort((a, b) => b[1] - a[1]).map(([k, n]) => esc(k) + ' ×' + n).join(' · ');
  const recent = all.slice().sort((a, b) => (b.m.updatedAt || b.m.createdAt || 0) - (a.m.updatedAt || a.m.createdAt || 0)).slice(0, 8);
  // came back: of the accounts old enough to tell (matches on two days, or the 1st over 30 days ago), those whose

  const dayOf = t => new Date(t).toDateString(), firsts = users.map(x => x.matches.map(m => m.createdAt || 0).filter(Boolean).sort((p, q) => p - q)
    .filter((t, i, a) => !i || dayOf(t) !== dayOf(a[i-1]))).filter(t => t.length >= 2 || (t.length && now - t[0] > 30 * 864e5));
  const back = firsts.filter(t => t.length >= 2 && t[1] - t[0] <= 30 * 864e5).length, open = all.filter(({m}) => !m.done && now - (m.updatedAt || m.createdAt || 0) > 864e5).length;
  const upOf = p => { const ph = admPhones(p); return {up:Math.max(0, ...ph.map(q => q.up || 0)), wait:ph.reduce((t, q) => t + (+q.wait || 0), 0)}; };
  return `${head(nL(users.length, '{n} person', '{n} people'))}
    <p class="note" style="margin:0">${L('Someone shows here after opening this version of the app once while signed in.')} ${L('People who never sign in keep their matches on their phone only.')}</p>
    <button class="btn btn-dk" id="b-adload">${L('Read again')}</button></section>
    <div class="tiles">
      <div class="tile hero"><b>${users.filter(x => seen(x) > weekAgo).length}</b><span>${L('Active this week')}</span><em>${L('{d} today', {d:users.filter(x => seen(x) > dayAgo).length})}</em></div>
      <div class="tile"><b>${all.length}</b><span>${L('Matches')}</span><em>${L('{n} this week', {n:all.filter(({m}) => (m.createdAt||0) > weekAgo).length})}</em></div>
      <div class="tile"><b>${all.filter(({m}) => admLive(m)).length}</b><span>${L('Live now')}</span></div>
      <div class="tile"><b class="${users.some(x => probs(x).length) ? 'neg' : ''}">${users.filter(x => probs(x).length).length}</b><span>${L('Problems')}</span><em>${L('phones, last 7 days')}</em></div>
      <div class="tile"><b>${firsts.length ? back + '/' + firsts.length : '–'}</b><span>${L('Came back')}</span><em>${L('a 2nd match within 30 days')}</em></div>
      <div class="tile"><b class="${open ? 'neg' : ''}">${open}</b><span>${L('Unfinished')}</span><em>${L('matches open over a day')}</em></div>
    </div>
    <div class="kpis">

      <div class="kr"><span>${L('Devices')}</span><b style="white-space:normal">${count(users.map(x => (x.profile||{}).kind || '?'))}</b></div>

        <div class="d">${L('Last seen')} ${ago(p.last)} · ${esc(p.ver || '?')} · ${esc(p.kind || '?')} · ${nL(activeDays(p), '{n} day in 30', '{n} days in 30')}${u.up ? ' · ' + L('uploaded {t}', {t:ago(u.up)}) : ''}${u.wait ? ` · <span class="neg">${nL(u.wait, '{n} save waiting', '{n} saves waiting')}</span>` : ''}</div>
        <div class="d">${nL(x.matches.length, '{n} match', '{n} matches')} (${L('{t} team, {p} one player', {t:team, p:x.matches.length - team})})${x.teams.filter(t => t && t.name).map(t => ' · ' + esc(t.name)).join('')}</div></span></button>`; }).join('')}</div></section>`;

// a match not finished and changed in the last two hours is being tracked now; a profile's problems, newest last
const admLive = m => !m.done && Date.now() - (m.updatedAt || 0) < 2 * 3600e3;
const admIssues = p => (p && Array.isArray(p.issues) ? p.issues : []).filter(i => i && i.t && i.m);
// (each account writes its own profile: anything that is not a phone's entry is left out)
const admPhones = p => Object.values((p && p.phones) || {}).filter(q => q && typeof q === 'object');

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  // a bar in the season chart (SVG, not a button)
  const cs = e.target.closest('[data-csel]'); if (cs){ S.chartSel = cs.dataset.csel; S.armed = null; return render(); }
  // the time-out is over: a tap anywhere on its page goes back to the match ("Wrong tap" still undoes; Who? still names)
  if (e.target.closest('.freeze.up') && !e.target.closest('#b-toundo, #b-toname')){ S.who = null; S.whoOther = false; return resumePlay(); }
  const t = e.target.closest('button'); if (!t || (t.type === 'submit' && t.form)) return;
  // A bar opens or closes right under the finger: the second half of a double tap must not pick a number,
  // end a set, save the match, or tap the stat that was under the bar.
  const sinceBar = Date.now() - (S.barAt||0);
  if ((t.dataset.who != null || t.dataset.setby != null || t.dataset.pass != null || t.dataset.to != null) && sinceBar < 350) return;
  if ((t.dataset.subin != null || t.dataset.libin != null || t.dataset.lin != null) && sinceBar < 500) return;
  if (['b-setkeep','b-matchkeep','b-resumeplay','b-toundo','b-askno','b-serveskip'].includes(t.id) && sinceBar < 500) return;
  // ("How it works" opens where "Later" of the first-serve question was: a double tap must not close it for good)
  if (t.id === 'b-howok' && Date.now() - (S.barClosedAt||0) < 500) return;
  // a "Yes" that opens where the finger just was (End set, then the match-over question): a slow second tap too
  if (['b-setend','b-matchend','b-endyes','b-setgo','b-servey','b-endmatch'].includes(t.id) && sinceBar < 800) return;
  // (Undo sits where Skip was: a double tap on Skip must not take the stat back)
  if ((t.dataset.stat || ['b-court','b-us','b-them','b-undo'].includes(t.id)) && Date.now() - (S.barClosedAt||0) < 350) return;
  const wasArmed = S.armed;
  if (t.id !== 'b-del') S.armed = null;
  // any other button closes the "who passed" picker
  // ("Other #" opens the number box inside the bar; Who? names the stats left without one, so it says nothing)
  if (t.dataset.whoother){ S.whoOther = true; render(); $('#who-other')?.focus(); return; }
  if (t.dataset.pass == null && t.dataset.who == null && t.dataset.setby == null && !t.dataset.stat){ if (!['b-undo','b-whoundo','b-name','b-toname'].includes(t.id)) whoLeft(); S.tag = null; S.who = null; S.whoOther = false; clearTimeout(S.tagT); }
  if (t.dataset.subin == null) S.sub = null;
  if (t.dataset.to == null && t.form?.id !== 'fixform'){ S.toAsk = false; S.fixAsk = false; }
  S.endAsk = false; S.setAsk = null; S.serveAsk = null;
  if (t.dataset.to != null){ if (t.dataset.to) return timeOut(t.dataset.to); S.toAsk = false; S.barClosedAt = Date.now(); return render(); }
  // new-match form: these switch in place, so what is typed stays
  if (t.dataset.ha){ S.nfAway = t.dataset.ha === 'away'; document.querySelectorAll('[data-ha]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ha === t.dataset.ha))); return; }
  if (t.dataset.lvl){ S.nfBasic = t.dataset.lvl === 'basic'; document.querySelectorAll('[data-lvl]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lvl === t.dataset.lvl))); return; }
  if (t.dataset.slot){
    const keep = {}; document.querySelectorAll('#newform input').forEach(i => keep[i.id] = i.type === 'checkbox' ? i.checked : i.value);
    const late = $('#f-late')?.open;
    if (S.view === 'team' && teamDirty() && !saveTeamForm()) return;
    pickSlot(t.dataset.slot);
    if (S.view === 'team'){ dropDraft(); return render(); }
    render();
    Object.entries(keep).forEach(([id, v]) => { const i = document.getElementById(id); if (i){ if (i.type === 'checkbox') i.checked = v; else if (id !== 'f-home') i.value = v; } });
    if (late) $('#f-late').open = true;
    return;
  }
  if (t.dataset.fix != null){
    const m = S.matches[S.view === 'match' ? S.openId : S.activeId];
    if (m){ S.who = {mid:m.id, i:+t.dataset.fix, fix:1}; S.barAt = Date.now(); }
    return render();
  }
  // the team page opened from the new-match form: Save team leads back there
  // leaving the team page: what was typed is saved first, or the page stays and says what is missing.
  // Back to a live match is never blocked: the rally goes on, the typing waits on the team page.
  let waits = false;
  if (t.dataset.view && S.view === 'team' && teamDirty() && !saveTeamForm()){ if (!(t.dataset.view === 'live' && S.activeId)) return; waits = true; }
  // going to the team page from the new-match form: what was typed there is waiting on the way back
  if (t.dataset.view && t.closest('#newform')) keepNf();
  if (t.dataset.view){
    // during a team match the team page shows that match's team, so a late player reaches the who bar
    const lm = S.activeId && S.matches[S.activeId];
    if (t.dataset.view === 'team' && isTeam(lm) && slotOf(lm) !== S.slot) pickSlot(slotOf(lm));
    if (S.view === 'team' && !waits) dropDraft();
    if (t.dataset.view !== 'live') dropPractice();
    // the logo on a live score page leads into the app (a scorer may open their own link in the installed app)
    if (S.watch){ S.watch = null; document.body.classList.remove('watch'); history.replaceState(history.state, '', location.pathname + location.search); syncNote(); }
    S.teamFrom =t.dataset.view === 'team' && !!t.closest('#newform'); S.view = t.dataset.view; S.openId = null; S.editList = false; render(); window.scrollTo(0,0);
    if (waits) toast(L('Team not saved yet: finish it on the Team page'));
    return; }
  // Season list in remove mode: first tap arms the row, second tap deletes it
  if (t.dataset.xdel){
    const id = t.dataset.xdel;
    if (wasArmed === 'x-'+id){ if (Date.now() - (S.armAt||0) < 400){ S.armed = wasArmed; return; } return removeMatch(id); }
    return arm('x-'+id);
  }
  if (t.dataset.pass != null) return setPasser(t.dataset.pass);
  if (t.dataset.who != null) return setWho(t.dataset.who);
  if (t.dataset.setby != null) return setBy(t.dataset.setby);
  if (t.dataset.tp){ const slot = S.view === 'match' ? seasonKey(S.matches[S.openId]) : S.seasonMode && S.seasonMode !== 'player' ? S.seasonMode : 'team';
    S.view = 'tplayer'; S.tpNum = t.dataset.tp; S.seasonMode = slot; render(); window.scrollTo(0,0); return; }
  if (t.dataset.season){ S.seasonMode = t.dataset.season; S.editList = false; return render(); }
  // new-match form: switch without redrawing, so what is typed stays
  if (t.dataset.track){
    keepNf(); S.track = t.dataset.track; LS.set('ss.track', S.track);
    if (S.nfDraft) delete S.nfDraft['f-home'];
    S.nfStep = 2; render(); window.scrollTo(0,0); return;
  }
  // step 2 of a team match: a team with players goes on to step 3; an empty one opens the team page
  if (t.dataset.nfslot){
    keepNf(); pickSlot(t.dataset.nfslot); if (S.nfDraft) delete S.nfDraft['f-home'];
    if (S.team.players.length){ S.nfStep = 3; render(); window.scrollTo(0,0); return; }
    S.teamFrom = true; S.view = 'team'; render(); window.scrollTo(0,0); return;
  }
  // a player row goes on a second tap (the ✕ sits next to the position box)
  if (t.dataset.rm != null){
    if (wasArmed !== 'rm-' + t.dataset.rm){ arm('rm-' + t.dataset.rm); return toast(L('Tap again to delete')); }
    if (Date.now() - (S.armAt||0) < 400){ S.armed = wasArmed; return; }
    const d = readTeamRaw(); d.players.splice(+t.dataset.rm, 1); keepDraft(d); return render(); }
  if (t.id === 'b-addrow') return addRow();
  // our serve stat while the score says they serve: asked (a missed rally), not refused without a word
  if (t.dataset.stat){ if (t.dataset.off){ S.serveAsk = t.dataset.stat; S.barAt = Date.now(); return render(); } return tap(t.dataset.stat); }
  if (t.dataset.set) return askSet(+t.dataset.set);
  // the first server of the set on screen (side-out % in the report)
  if (t.dataset.serve){ const m = S.matches[S.activeId]; if (m){ m.serve = Object.assign({}, m.serve, {[S.set]: t.dataset.serve}); save(m); S.barClosedAt = Date.now(); toast(L('First serve: {team}', {team:t.dataset.serve === 'us' ? homeName(m) : m.opp})); } return render(); }
  if (t.dataset.libin != null){ const m = S.matches[S.activeId];
    if (m && t.dataset.libin){ push(m, {k:'sub', out:t.dataset.libout, in:t.dataset.libin}); save(m); toast(L('Sub: #{a} in for #{b}', {a:t.dataset.libin, b:t.dataset.libout})); }
    else S.libSkip = t.dataset.libkey;
    S.barClosedAt = Date.now(); return render(); }
  // the libero in for a player in the back row (or Later, for this rotation)
  if (t.dataset.lin != null){ const m = S.matches[S.activeId];
    if (m && t.dataset.lin){ push(m, {k:'sub', out:t.dataset.lout, in:t.dataset.lin}); save(m); toast(L('Sub: #{a} in for #{b}', {a:t.dataset.lin, b:t.dataset.lout})); }
    else S.libInSkip = t.dataset.lkey;
    S.barClosedAt = Date.now(); return render(); }
  // the line-up sheet: pick a spot, put a player in it (a player is in one spot only), who serves first
  if (t.dataset.luspot != null && S.lu){ S.lu.spot = +t.dataset.luspot; return render(); }
  if (t.dataset.luput != null && S.lu){ const lu = S.lu, n = t.dataset.luput, j = lu.pos.indexOf(n);
    if (j >= 0) lu.pos[j] = '';
    lu.pos[lu.spot] = n;
    // on to the next empty spot, in serving order
    const nx = [1,2,3,4,5].map(d => (lu.spot + d) % 6).find(i => !lu.pos[i]); if (nx != null) lu.spot = nx;
    return render(); }
  if (t.dataset.luserve && S.lu){ S.lu.serve = t.dataset.luserve; return render(); }
  // a player on the court: who comes in for them
  if (t.dataset.subspot != null){ const m = S.matches[S.activeId]; if (m){ S.sub = {mid:m.id, i:+t.dataset.subspot}; S.barAt = Date.now(); } return render(); }

    if (st && t.dataset.subin){ const out = st.pos[S.sub.i]; push(m, {k:'sub', out, in:t.dataset.subin}); save(m); toast(L('Sub: #{a} in for #{b}', {a:t.dataset.subin, b:out})); }
    S.sub = null; S.barClosedAt = Date.now(); return render(); }
