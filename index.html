/* ---------- events ---------- */
document.addEventListener('click', async e => {
  // a bar in the season chart (SVG, not a button)
  const cs = e.target.closest('[data-csel]'); if (cs){ S.chartSel = cs.dataset.csel; S.armed = null; return render(); }
  const t = e.target.closest('button'); if (!t || (t.type === 'submit' && t.form)) return;
  // A bar opens or closes right under the finger: the second half of a double tap must not pick a number,
  // end a set, save the match, or tap the stat that was under the bar.
  const sinceBar = Date.now() - (S.barAt||0);
  if ((t.dataset.who != null || t.dataset.setby != null || t.dataset.subin != null || t.dataset.pass != null || t.dataset.to != null) && sinceBar < 350) return;
  if (['b-setend','b-setkeep','b-matchend','b-matchkeep','b-resumeplay','b-toundo','b-endyes','b-setgo','b-askno'].includes(t.id) && sinceBar < 500) return;
  // (Undo sits where Skip was: a double tap on Skip must not take the stat back)
  if ((t.dataset.stat || ['b-court','b-us','b-them','b-undo'].includes(t.id)) && Date.now() - (S.barClosedAt||0) < 350) return;
  const wasArmed = S.armed;
  if (t.id !== 'b-del') S.armed = null;
  // any other button closes the "who passed" picker
  // ("Other #" opens the number box inside the bar; Who? names the stats left without one, so it says nothing)
  if (t.dataset.whoother){ S.whoOther = true; render(); $('#who-other')?.focus(); return; }
  if (t.dataset.pass == null && t.dataset.who == null && t.dataset.setby == null && !t.dataset.stat){ if (!['b-undo','b-whoundo','b-name'].includes(t.id)) whoLeft(); S.tag = null; S.who = null; S.whoOther = false; clearTimeout(S.tagT); }
  if (t.dataset.subin == null) S.sub = null;
  if (t.dataset.to == null && t.form?.id !== 'fixform'){ S.toAsk = false; S.fixAsk = false; }
  S.endAsk = false; S.setAsk = null;
  if (t.dataset.to != null){ if (t.dataset.to) return timeOut(t.dataset.to); S.barClosedAt = Date.now(); return render(); }
  // new-match form: these switch in place, so what is typed stays
  if (t.dataset.ha){ S.nfAway = t.dataset.ha === 'away'; document.querySelectorAll('[data-ha]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ha === t.dataset.ha))); return; }
  if (t.dataset.slot){
    const keep = {}; document.querySelectorAll('#newform input').forEach(i => keep[i.id] = i.type === 'checkbox' ? i.checked : i.value);
    const late = $('#f-late')?.open;
    if (S.view === 'team' && teamDirty() && !saveTeamForm()) return;
    pickSlot(t.dataset.slot);
    if (S.view === 'team'){ dropDraft(); return render(); }
    render();
    Object.entries(keep).forEach(([id, v]) => { const i = document.getElementById(id); if (i){ if (i.type === 'checkbox') i.checked = v; else if (id !== 'f-home') i.value = v; } });
    if (late) $('#f-late').open = true;
    return;
  }
  if (t.dataset.fix != null){
    const m = S.matches[S.view === 'match' ? S.openId : S.activeId];
    if (m){ S.who = {mid:m.id, i:+t.dataset.fix, fix:1}; S.barAt = Date.now(); }
    return render();
  }
  // the team page opened from the new-match form: Save team leads back there
  // leaving the team page: what was typed is saved first, or the page stays and says what is missing.
  // Back to a live match is never blocked: the rally goes on, the typing waits on the team page.
  let waits = false;
  if (t.dataset.view && S.view === 'team' && teamDirty() && !saveTeamForm()){ if (!(t.dataset.view === 'live' && S.activeId)) return; waits = true; }
  // going to the team page from the new-match form: what was typed there is waiting on the way back
  if (t.dataset.view && t.closest('#newform')) keepNf();
  if (t.dataset.view){
    // during a team match the team page shows that match's team, so a late player reaches the who bar
    const lm = S.activeId && S.matches[S.activeId];
    if (t.dataset.view === 'team' && isTeam(lm) && slotOf(lm) !== S.slot) pickSlot(slotOf(lm));
    if (S.view === 'team' && !waits) dropDraft();
    S.teamFrom = t.dataset.view === 'team' && !!t.closest('#newform'); S.view = t.dataset.view; S.openId = null; S.editList = false; render(); window.scrollTo(0,0);
    if (waits) toast(L('Team not saved yet: finish it on the Team page'));
    return; }
  // Season list in remove mode: first tap arms the row, second tap deletes it
  if (t.dataset.xdel){
    const id = t.dataset.xdel;
    if (wasArmed === 'x-'+id){ if (Date.now() - (S.armAt||0) < 400){ S.armed = wasArmed; return; } return removeMatch(id); }
    return arm('x-'+id);
  }
  if (t.dataset.pass != null) return setPasser(t.dataset.pass);
  if (t.dataset.who != null) return setWho(t.dataset.who);
  if (t.dataset.setby != null) return setBy(t.dataset.setby);
  if (t.dataset.tp){ const slot = S.view === 'match' ? seasonKey(S.matches[S.openId]) : S.seasonMode && S.seasonMode !== 'player' ? S.seasonMode : 'team';
    S.view = 'tplayer'; S.tpNum = t.dataset.tp; S.seasonMode = slot; render(); window.scrollTo(0,0); return; }
  if (t.dataset.season){ S.seasonMode = t.dataset.season; S.editList = false; return render(); }
  // new-match form: switch without redrawing, so what is typed stays
  if (t.dataset.track){
    keepNf(); S.track = t.dataset.track; LS.set('ss.track', S.track);
    if (S.nfDraft) delete S.nfDraft['f-home'];
    S.nfStep = 2; render(); window.scrollTo(0,0); return;
  }
  // step 2 of a team match: a team with players goes on to step 3; an empty one opens the team page
  if (t.dataset.nfslot){
    keepNf(); pickSlot(t.dataset.nfslot); if (S.nfDraft) delete S.nfDraft['f-home'];
    if (S.team.players.length){ S.nfStep = 3; render(); window.scrollTo(0,0); return; }
    S.teamFrom = true; S.view = 'team'; render(); window.scrollTo(0,0); return;
  }
  if (t.dataset.rm != null){ const d = readTeamRaw(); d.players.splice(+t.dataset.rm, 1); keepDraft(d); return render(); }
  if (t.id === 'b-addrow') return addRow();
  if (t.dataset.stat) return tap(t.dataset.stat);
  if (t.dataset.set) return askSet(+t.dataset.set);
  // the first server of the set on screen (side-out % in the report)
  if (t.dataset.serve){ const m = S.matches[S.activeId]; if (m){ m.serve = Object.assign({}, m.serve, {[S.set]: t.dataset.serve}); save(m); } return render(); }
  // the line-up sheet: pick a spot, put a player in it (a player is in one spot only), who serves first
  if (t.dataset.luspot != null && S.lu){ S.lu.spot = +t.dataset.luspot; return render(); }
  if (t.dataset.luput != null && S.lu){ const lu = S.lu, n = t.dataset.luput, j = lu.pos.indexOf(n);
    if (j >= 0) lu.pos[j] = '';
    lu.pos[lu.spot] = n;
    // on to the next empty spot, in serving order
    const nx = [1,2,3,4,5].map(d => (lu.spot + d) % 6).find(i => !lu.pos[i]); if (nx != null) lu.spot = nx;
    return render(); }
  if (t.dataset.luserve && S.lu){ S.lu.serve = t.dataset.luserve; return render(); }
  // a player on the court: who comes in for them
  if (t.dataset.subspot != null){ const m = S.matches[S.activeId]; if (m){ S.sub = {mid:m.id, i:+t.dataset.subspot}; S.barAt = Date.now(); } return render(); }
  if (t.dataset.subin != null){ const m = S.matches[S.activeId], st = m && S.sub && court(m, S.set);
    if (st && t.dataset.subin){ const out = st.pos[S.sub.i]; push(m, {k:'sub', out, in:t.dataset.subin}); save(m); toast(L('Sub: #{a} in for #{b}', {a:t.dataset.subin, b:out})); }
    S.sub = null; S.barClosedAt = Date.now(); return render(); }
  if (t.dataset.metric){ S.chartMetric = t.dataset.metric; return render(); }
  // the language, kept on this phone
  if (t.dataset.lang){ S.lang = t.dataset.lang; LS.set('ss.lang', S.lang); syncNote(); return render(); }
  if (t.dataset.open){
    if (t.dataset.open === S.activeId){ S.view = 'live'; } else { S.view = 'match'; S.openId = t.dataset.open; }
    render(); window.scrollTo(0,0); return;
  }
  switch (t.id){
    case 'b-us': return teamPoint('us');
    case 'b-them': return teamPoint('them');
    case 'b-endset': return endSet();
    case 'b-setend': case 'b-endyes': return endSet(true);
    case 'b-setgo': return pickSet(+t.dataset.go);
    case 'b-askno': return render();
    case 'b-setkeep': S.keepSet = t.dataset.key; return render();
    // kept on the match, so a reload or a locked phone does not ask again
    case 'b-matchkeep': { const m = S.matches[S.activeId]; m.keepOver = overKey(m); save(m); return render(); }
    case 'b-matchend': { const {w, l} = setsWon(S.matches[S.activeId]); return finishMatch(w > l ? 'W' : 'L', w + '-' + l); }
    case 'b-court': return toggleCourt();
    case 'b-toteam': return switchToTeam();
    case 'b-toplayer': return switchToPlayer();
    case 'b-timeout': S.toAsk = true; S.barAt = Date.now(); return render();
    case 'b-fix': S.fixAsk = true; S.barAt = Date.now(); render(); $('#fix-us')?.select(); return;
    case 'b-fixno': S.fixAsk = false; S.barClosedAt = Date.now(); return render();
    case 'b-undo': case 'b-whoundo': return undo();
    // between rallies: name the stats left without a number, one after another
    case 'b-name': { const m = S.matches[S.activeId], i = m ? firstUnnamed(m) : -1; if (i >= 0){ S.who = {mid:m.id, i, fix:1, chain:1}; S.barAt = Date.now(); } return render(); }
    // the freeze closes under the finger; a tap synced in from another phone since is not taken back
    case 'b-toundo': { const m = S.matches[S.activeId], l = m?.log?.[m.log.length-1]; S.barClosedAt = Date.now(); return l?.k === 'to' ? undo() : resumePlay(); }
    case 'b-resumeplay': return resumePlay();
    case 'b-lineup': { const m = S.matches[S.activeId]; return m && openLineup(m); }
    case 'b-lusame': { const m = S.matches[S.activeId], prev = m && S.lu && lineupOf(m, S.lu.set - 1); if (prev){ S.lu.pos = prev.slice(); S.lu.spot = 0; } return render(); }
    case 'b-luclear': if (S.lu){ S.lu.pos = Array(6).fill(''); S.lu.spot = 0; } return render();
    case 'b-lucancel': S.lu = null; S.barClosedAt = Date.now(); return render();
    case 'b-lusave': return saveLineup();
    case 'b-nfback': keepNf(); S.nfStep = Math.max(1, (S.nfStep || 1) - 1); render(); window.scrollTo(0,0); return;
    case 'b-signin': return window.SS_auth ? window.SS_auth.signIn() : toast(L("Can't reach Google. Check the internet."));
    case 'b-signout':
      if (!window.SS_auth) return;
      // signing out takes the matches off this phone: the account must have them all first
      if (navigator.onLine === false) return toast(L('No internet. Sign out when it is back, so nothing is lost.'));
      clearTimeout(S.flushT); await flush();
      // waiting saves: wait. A save the account refused will not go through by waiting: signing out is the cure.
      if (Object.keys(S.pending).length && !S.saveFailed) return toast(L('Still saving to your account. Try again in a moment.'));
      toast(L('Signing out…'));
      return window.SS_auth.signOut();
    case 'b-finish': {
      // "3-1" sets the result; Won with "1-3" is asked about, not saved
      let res = $('#fin-res').value; const sc = $('#fin-score').value.trim(), x = /^(\d+)\s*[-–:.\/]\s*(\d+)$/.exec(sc);
      if (x && +x[1] !== +x[2]){ const r = +x[1] > +x[2] ? 'W' : 'L'; if (res && res !== r) return toast(L(res === 'W' ? 'Won with sets {s}? Check the result' : 'Lost with sets {s}? Check the result', {s:x[1] + '-' + x[2]})); res = r; }
      return finishMatch(res, x ? x[1] + '-' + x[2] : sc); }
    case 'b-resume': return resume(t.dataset.id);
    case 'b-closenew': S.choose = false; return closeAndNew();
    case 'b-continue': S.choose = false; render(); window.scrollTo(0,0); return;
    case 'b-editlist': S.editList = !S.editList; return render();
    case 'b-del':
      if (S.armed === 'del-'+t.dataset.id) { if (Date.now() - (S.armAt||0) < 400) return; S.armed = null; return removeMatch(t.dataset.id); }
      return arm('del-'+t.dataset.id);
    // the team on the team page: first tap arms, a second tap (not a double tap) deletes
    case 'b-delteam':
      if (wasArmed === 'delteam'){ if (Date.now() - (S.armAt||0) < 400){ S.armed = wasArmed; return; } S.armed = null; return deleteTeam(); }
      return arm('delteam');
    // the report as a picture, through the phone's share sheet (WhatsApp, Messages...)
    case 'b-share': return sharePicture(S.matches[t.dataset.id]);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'passform') return setPasser($('#pass-other').value);
  if (e.target.id === 'whoform') return setWho($('#who-other').value);
  if (e.target.id === 'teamform'){
    if (!saveTeamForm()) return;
    if (S.teamFrom && S.team.players.length){ S.teamFrom = false; S.view = 'live'; S.track = 'team'; LS.set('ss.track', 'team'); S.nfStep = 3; window.scrollTo(0,0); }
    return render();
  }
  if (e.target.id === 'fixform') return fixScore(+jnum($('#fix-us').value || 0), +jnum($('#fix-them').value || 0));
  if (e.target.id === 'newform' && (S.nfStep || 1) < 4) return nfNext();
  if (e.target.id === 'newform' && trackMode() === 'team' && !S.team.players.length){ S.view = 'team'; return render(); }
  if (e.target.id === 'newform'){
    const sets = parseScores($('#f-sets').value), now = parseScores($('#f-now').value);
    if (!sets) return toast(L('Sets already played: type them like 25-20, 22-25'));
    if (!now || now.length > 1) return toast(L('Score now: type it like 10-12'));
    if (sets.length >= 5) return toast(L('At most 4 sets already played'));
    if ([0, 1].some(i => sets.filter(s => s[i] > s[1-i]).length >= 3)) return toast(L('Those sets already finish the match'));
    startMatch({opp:$('#f-opp').value.trim(), home:$('#f-home').value.trim(), date:$('#f-date').value, team:$('#f-team').value.trim(), starter:!!$('#f-starter')?.checked, mode:trackMode(), away:!!S.nfAway, sets, now:now[0]});
  }
  if (e.target.id === 'pform'){
    S.player = Object.assign({}, S.player, {name:$('#p-name').value.trim(), num:$('#p-num').value.trim(), pos:$('#p-pos').value});
    savePlayer(); toast(L('Player saved')); S.view = S.activeId || !Object.keys(S.matches).length ? 'live' : 'history'; render();
  }
});
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#teamform')) keepDraft(readTeamRaw()); });
window.addEventListener('pagehide', () => { backup(); flush(); });
// back from the browser's page cache: another copy of the app may have changed things meanwhile
window.addEventListener('pageshow', e => { if (e.persisted){ restore(); if (!isTyping()) render(); } });
// Android Back (and Escape on a computer): first close the open bar, then go back to Live; only Back on
// Live with nothing open leaves the app. The time-out screen stays until Resume play.
function goBack(){
  const m = S.activeId && S.matches[S.activeId];
  if (S.view === 'live' && m && m.toOn) return true;
  if (S.lu || S.sub){ S.lu = null; S.sub = null; S.barClosedAt = Date.now(); render(); return true; }
  // the new-match steps: Back goes one step back
  if (S.view === 'live' && !m && (S.nfStep || 1) > 1){ keepNf(); S.nfStep--; render(); window.scrollTo(0,0); return true; }
  if (S.who || S.tag || S.toAsk || S.fixAsk || S.endAsk || S.setAsk){ whoLeft(); S.who = null; S.whoOther = false; S.tag = null; S.toAsk = false; S.fixAsk = false; S.endAsk = false; S.setAsk = null; clearTimeout(S.tagT); S.barClosedAt = Date.now(); render(); return true; }
  if (S.view !== 'live'){
    // the team page: saved like leaving it by a tab; refused, the typing waits there
    if (S.view === 'team'){ if (teamDirty() && !saveTeamForm()) toast(L('Team not saved yet: finish it on the Team page')); else dropDraft(); }
    S.view = 'live'; S.openId = null; S.editList = false; render(); window.scrollTo(0,0); return true; }
  return false;
}
history.pushState({ss:1}, '');
window.addEventListener('popstate', () => {
  if (goBack()) return history.pushState({ss:1}, '');
  // nothing to close: a second Back straight after (within 2 s, no tap between) leaves the app, a stray one does not
  toast(L('Press Back again to leave'));
  S.guardOff = true; clearTimeout(S.guardT); S.guardT = setTimeout(rearm, 2000);
});
function rearm(){ if (S.guardOff){ S.guardOff = false; history.pushState({ss:1}, ''); } }
// any tap after the warning: Back is a "close" again, never a "leave"
document.addEventListener('pointerdown', rearm, true);
document.addEventListener('click', rearm, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !isTyping()) goBack(); });
// The team page: the phone's Enter (Next) goes to the next box, and after the last name to a new row.
// It never saves: Enter after the first name saved a one-player team and left the page.
document.addEventListener('keydown', e => {
  const el = e.target; if (e.key !== 'Enter' || el.tagName !== 'INPUT' || !el.closest('#teamform')) return;
  e.preventDefault();
  const rows = [...document.querySelectorAll('.rrow')], row = el.closest('.rrow'), i = rows.indexOf(row);
  if (!row) return rows[0]?.querySelector('.t-num').focus();
  if (el.classList.contains('t-num')) return row.querySelector('.t-pn').focus();
  if (i < rows.length - 1) return rows[i+1].querySelector('.t-num').focus();
  if (row.querySelector('.t-num').value || el.value) addRow(); else el.blur();
});
// the same phone has the app open twice (home-screen app and a browser tab): take the other one's
// changes at once, so an old screen can never save over newer taps
window.addEventListener('storage', e => {
  if (!e.key || !(e.key.startsWith('ss.m.') || ['ss.active','ss.player','ss.team','ss.team2'].includes(e.key))) return;
  // several keys change together (one per match): one reload for the lot
  clearTimeout(S.stT); S.stT = setTimeout(() => { restore(); if (!isTyping()) render(); }, 30);
});

restore();
S.lang = LS.get('ss.lang') || (/^el\b/i.test(navigator.language || '') ? 'el' : 'en');
// asks the browser not to clear this site's data when the phone runs low (Chrome on Android grants it)
try{ navigator.storage?.persist?.(); }catch(e){}
S.choose = idleLong();
render();
if (S.activeId) keepAwake();
syncNote();
</script>

// Same small interface the app already uses: doc(path).set/delete/onSnapshot, collection(path).onSnapshot.
// Writes return at once: Firestore keeps them queued on the phone until there is signal.
function database(uid){
  const base = 'users/' + uid + '/';
  const fail = (e, p) => window.SS_writeFailed(e, p);
  const meta = {includeMetadataChanges: true};
  return {
    doc: p => ({
      set: body => { F.setDoc(F.doc(fs, base + p), body).then(window.SS_writeOk, e => fail(e, p)); return Promise.resolve(); },
      delete: () => { F.deleteDoc(F.doc(fs, base + p)).then(window.SS_writeOk, e => fail(e, p)); return Promise.resolve(); },
      onSnapshot: (cb, err) => F.onSnapshot(F.doc(fs, base + p), meta,
        s => cb({exists: s.exists(), data: () => s.data(), metadata: s.metadata}), err),
    }),
    collection: p => ({
      onSnapshot: (cb, err) => F.onSnapshot(F.collection(fs, base + p), meta,
        s => cb({docs: s.docs.map(d => ({id: d.id, data: () => d.data(), pending: d.metadata.hasPendingWrites})),
                 docChanges: () => s.docChanges().map(c => ({type: c.type, doc: {id: c.doc.id}})),
                 metadata: s.metadata}), err),
    }),
  };
}
const provider = new A.GoogleAuthProvider();
window.SS_auth = {
  // Full-page sign-in: works in Safari, Chrome and home-screen apps, where popups don't.
  async signIn(){
    try{ await A.signInWithRedirect(auth, provider); }
    catch(e){ window.SS_toast(window.SS_L('Sign-in failed ({code})', {code:e.code})); }
  },
  // Signing out takes the matches off this phone, so first wait until the account has every tap (at most 6 s).
  async signOut(){
    try{
      const done = await Promise.race([F.waitForPendingWrites(fs).then(() => true), new Promise(r => setTimeout(() => r(false), 6000))]);
      if (!done) return window.SS_toast(window.SS_L('Still saving to your account. Try again in a moment.'));
    }catch(e){}
    return A.signOut(auth);
  },
};
A.getRedirectResult(auth).catch(e => window.SS_toast(window.SS_L('Sign-in failed ({code})', {code:e.code})));
A.onAuthStateChanged(auth, u => window.SS_onUser(u ? {uid: u.uid, email: u.email} : null, u ? database(u.uid) : null));
