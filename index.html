<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Spike Sheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Spike Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Roboto+Condensed:wght@600..800&display=swap">
<style>
/* Sportswear-app look: black on white, heavy condensed caps, pills, one volt highlight. */
:root{
  --bg:#FFFFFF; --soft:#F5F5F5; --soft2:#EDEDED; --ink:#111111; --muted:#707072; --faint:#9E9EA0; --line:#E5E5E5;
  --btn:#111111; --btn-ink:#FFFFFF; --volt:#D7FF3A; --volt-ink:#111111; --hi:#111111;
  --pos:#128A43; --neg:#D30005;
  --head:"Archivo","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000000; --soft:#161616; --soft2:#222222; --ink:#FFFFFF; --muted:#9E9EA0; --faint:#6B6B6D; --line:#2A2A2A;
  --btn:#FFFFFF; --btn-ink:#111111; --volt:#D7FF3A; --volt-ink:#111111; --hi:#D7FF3A;
  --pos:#3DDC84; --neg:#FF5A5F;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --soft:#161616; --soft2:#222222; --ink:#FFFFFF; --muted:#9E9EA0; --faint:#6B6B6D; --line:#2A2A2A;
  --btn:#FFFFFF; --btn-ink:#111111; --volt:#D7FF3A; --volt-ink:#111111; --hi:#D7FF3A;
  --pos:#3DDC84; --neg:#FF5A5F;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);padding-inline:16px;padding-block:0 110px;-webkit-tap-highlight-color:transparent}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:10px 18px 10px 14px;border-radius:999px;background:var(--btn);color:var(--btn-ink);box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:left;font-weight:700;font-size:15px;line-height:1.1}
.fab small{display:block;font-size:11px;font-weight:500;opacity:.75;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab-i{font-size:22px;line-height:1}
.fab:active{transform:scale(.96)}
/* every button answers the finger, like a native app */
.btn,.court button,.mitem,.seg button,.setsel button,.tabs button,.brand,.xdel,.tagbar button,.lnk{transition:transform .08s,opacity .08s}
.btn:active,.court button:active,.xdel:active,.tagbar button:active{transform:scale(.97)}
.mitem:active,.seg button:active,.setsel button:active,.tabs button:active,.brand:active,.lnk:active{opacity:.6}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
/* no double-tap zoom: quick repeated taps on a stat must count, not zoom the page */
html,body{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{opacity:.3;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.big,.stat .n,.tile b,.pline b,.clock,td,.pbp .sc,.mitem .p{font-variant-numeric:tabular-nums}
/* condensed caps display */
.brand,h2,.big,.stat .n,.tile b,.pline b,.mitem .p,.pname,.team .nm,.jersey{font-family:var(--head);font-stretch:62%;font-weight:800;text-transform:uppercase;letter-spacing:-.005em}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-size:28px;line-height:1}
.brand .ball{width:12px;height:12px;border-radius:50%;background:var(--volt);box-shadow:0 0 0 2px var(--ink)}
.brand em{font-style:normal}
.tabs{display:flex;gap:18px}
.tabs button{font-size:15px;font-weight:500;padding:6px 0;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.note{font-size:13px;color:var(--muted)}
.kicker{font-size:13px;font-weight:500;color:var(--muted)}
h2{font-size:34px;line-height:.95;margin:0;text-wrap:balance;overflow-wrap:break-word}
h3{font-size:16px;font-weight:600;margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.panel{background:var(--soft);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.panel form{margin:0;width:100%}

label{font-size:13px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.btn{font-weight:500;font-size:15px;padding:14px 22px;border-radius:999px;text-align:center;border:1.5px solid var(--line);background:var(--bg)}
.btn-or{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn-dk{background:var(--bg)}
.btn-del{color:var(--neg)}
.btn-del.armed{background:var(--neg);color:#fff;border-color:var(--neg)}

/* score */
.bug{background:var(--soft);border-radius:20px;overflow:hidden}
.bug-top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 0;gap:8px}
.bug-top .comp{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setflag{font-size:12px;font-weight:600;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:999px;white-space:nowrap}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 18px 14px}
.team{display:flex;flex-direction:column;gap:4px;min-width:0}
.team.away{text-align:right;align-items:flex-end}
.team .nm{font-size:22px;line-height:1;overflow-wrap:anywhere}.team .nm.long{font-size:16px}.team .nm.xl{font-size:14px}@media (max-width:360px){.team .nm.long{font-size:13px}.team .nm.xl{font-size:11px}}
.team .sw{font-size:12px;color:var(--muted)}
.big{display:flex;align-items:center;gap:8px;font-size:84px;line-height:.85}
.big i{font-style:normal;color:var(--faint);font-size:50px}
.big span{color:var(--faint)} .big .hi{color:var(--ink)}
.pips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 18px 14px}
.pip{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.pip.w{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}.pip.l{color:var(--muted)}
.plus{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.plus button{padding:16px 10px;border-radius:999px;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plus .us{background:var(--btn);color:var(--btn-ink)}
.plus .them{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.plus button:active{transform:scale(.97)}
.bug-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 12px;gap:8px;flex-wrap:wrap}
.setsel{display:flex;gap:4px;align-items:center}
.setsel button{font-size:14px;font-weight:600;width:40px;height:40px;border-radius:50%;color:var(--muted)}
.setsel button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lnk{font-size:14px;font-weight:600;padding:12px 6px;text-decoration:underline;text-underline-offset:3px}

/* player */
.player{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:4px 0}
.jersey{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--volt);color:var(--volt-ink)}
.pinfo{min-width:0}
.pname{font-size:26px;line-height:1;overflow-wrap:anywhere}.pname.long{font-size:22px}.pname.xl{font-size:19px}
.pline{display:flex;gap:22px;margin-top:8px;flex-wrap:wrap}
.pline div{display:flex;flex-direction:column}
.pline b{font-size:30px;line-height:.95}
.pline span{font-size:12px;color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.court{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:16px;background:var(--soft)}
.court.is-on{background:var(--volt);color:var(--volt-ink)}
.cst{min-width:0}.cst b{display:block;font-family:var(--head);font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:24px;line-height:1}
.cst>span{font-size:13px;opacity:.75}#clock{font-variant-numeric:tabular-nums}
.court button{flex:none;font-size:15px;font-weight:600;padding:12px 18px;border-radius:999px;background:var(--volt);color:var(--volt-ink)}
.court.is-on button{background:var(--volt-ink);color:var(--volt)}
.choose{gap:12px}.choose p{margin:0}
.dot-ok{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pos);margin-right:7px;vertical-align:1px}
#syncnote .lnk{padding:10px 2px;margin:-10px 0;font-size:13px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pos);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}

/* stat pad */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad-err,.pad-play{grid-template-columns:repeat(5,1fr)}.pad-err .stat,.pad-play .stat{padding-inline:2px}
.stat{background:var(--soft);border-radius:16px;min-height:88px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .15s,transform .08s}
.stat:active{transform:scale(.95)}
.stat .n{font-size:36px;line-height:.9}
.stat .l{font-size:13px;font-weight:600;line-height:1.15;text-align:center}
.stat .s{font-size:11px;color:var(--muted);line-height:1.1;text-align:center}
.stat.err .n{color:var(--neg)}
.stat.flash{background:var(--volt);color:var(--volt-ink)}
.stat.flash .s{color:var(--volt-ink)}
.undo{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.undo span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo .btn{padding:9px 18px;font-size:14px}

/* play by play */
.pbp{display:flex;flex-direction:column}
.pbp div,.pbp button{text-align:left;width:100%;display:grid;grid-template-columns:44px 56px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.pbp .st{font-size:12px;color:var(--faint)}
.pbp .sc{font-weight:600}
.pbp .ev.pt{font-weight:600} .pbp .ev.err{color:var(--neg)} .pbp .ev.sub{color:var(--pos);font-weight:500} .pbp .ev.team{color:var(--muted)}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 8px;text-align:right;white-space:nowrap;font-size:14px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);padding-left:0}
thead th{font-size:12px;font-weight:500;color:var(--muted);border-bottom:1.5px solid var(--ink)}
tbody td{border-top:1px solid var(--line)}
tbody tr:first-child td{border-top:0}
tr.sum td{font-weight:700;border-top:1.5px solid var(--ink)}
td.k{font-weight:700}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pct{display:flex;flex-direction:column;gap:14px;background:var(--soft);border-radius:16px;padding:16px}
.pr{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:6px 12px}
.pr .pl{font-weight:600}.pr .pl small{font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.pr b{font-family:var(--head);font-stretch:62%;font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.pbar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--soft2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--hi)}
.setc{background:var(--soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.setc-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.setc-h b{font-family:var(--head);font-stretch:62%;font-weight:800;font-size:22px;text-transform:uppercase}
.setc-h span{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.setc p{margin:0;font-size:14px;line-height:1.35}.setc .m{color:var(--muted)}
details.more summary{cursor:pointer;font-weight:600;padding:6px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:' ›'}details.more[open] summary::after{content:' ⌄'}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.tagbar .more input.sm{flex:0 1 80px;text-align:center}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{padding:18px 8px;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-weight:700;overflow-wrap:anywhere}
.pick button small{display:block;font-size:12px;font-weight:500;margin-top:4px;opacity:.7}
.pick button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
/* New match: our team and home/away are questions, as big as "Team or player?" */
.qh{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:10px}
label.qh{margin-bottom:0;gap:8px}
.ours input{border:2px solid var(--ink);font-weight:600}
.ours .note{font-weight:400}
/* time-out: the whole screen waits for Resume play */
.freeze{position:fixed;inset:0;z-index:11;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.freeze h2{font-size:64px}
.freeze .fz-team{font-size:20px;font-weight:700}
.freeze .fz-clock{font-family:var(--head);font-stretch:62%;font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.freeze .btn{font-size:18px;font-weight:700;padding:20px}
.freeze .btn-or{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
/* team flow: who serves, season leaders */
.srv{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--volt);box-shadow:0 0 0 1.5px var(--ink);margin-right:6px;vertical-align:2px}
.serveq{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:600}
.leads{display:flex;flex-direction:column}
.lead{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.lead .lt{font-size:13px;color:var(--muted)}
.lead .lp{display:flex;flex-wrap:wrap;gap:4px 14px}
.lead button{font-size:14px;text-align:left;padding:2px 0}.lead b{font-variant-numeric:tabular-nums;margin-left:3px}
/* a phone on its side: the time-out screen scrolls and shrinks instead of cutting off its buttons */
.freeze{overflow-y:auto;justify-content:safe center}
@media (max-height:480px){.freeze{gap:8px}.freeze h2,.freeze .fz-clock{font-size:40px}.freeze .btn{padding:14px}}
/* a pull-down at the top must not reload the page in the middle of a match */
html,body{overscroll-behavior-y:contain}
/* no sideways jump of the column on a computer when a page starts to scroll */
html{scrollbar-gutter:stable}
/* landscape iPhone: buttons clear of the notch and the rounded corners */
.tagbar{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
/* keyboard focus shows on the dark bars too */
.tagbar :focus-visible{outline-color:var(--volt)}
/* a mouse gets a hover, not only the press */
@media (hover:hover){.btn:hover,.stat:hover,.mitem:hover,.tagbar button:hover,.court button:hover,.plus button:hover,.pick button:hover{filter:brightness(.92)}}
/* tablet / computer: bars, Undo and the time-out screen stay with the 560 px column, not the window edges */
.freeze>*{width:100%;max-width:560px;margin-inline:auto}
@media (min-width:600px){
  .tagbar{max-width:592px;margin-inline:auto;border-radius:20px 20px 0 0}
  .fab{right:max(16px, calc(50% - 280px))}
}
@media (max-width:599px){.fab{right:max(16px, env(safe-area-inset-right, 0px))}}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar{fill:var(--muted)}.chart .bar.sel{fill:var(--hi)}
.chart .base{stroke:var(--line);stroke-width:1}
.chart text{font:500 10px var(--font);fill:var(--muted)}.chart text.v{font-weight:700;fill:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}
.chart-d{font-size:14px;min-height:20px}
.tile{background:var(--soft);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile b{font-size:36px;line-height:.9}
.tile span{font-size:12px;font-weight:500;line-height:1.25}
.tile em{font-style:normal;font-size:11px;color:var(--muted);line-height:1.25}
.tile.hero{background:var(--ink);color:var(--bg)}
.tile.hero em{color:var(--faint)}

.stints{display:flex;flex-direction:column}
.stint{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 0;font-size:14px;border-bottom:1px solid var(--line)}
.stint b{font-weight:700}

.mlist{display:flex;flex-direction:column}
.mitem{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:14px 0;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.res{font-size:12px;font-weight:700;min-width:34px;height:26px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:var(--soft);color:var(--muted)}
.res.W{background:var(--ink);color:var(--bg)}.res.L{background:var(--soft2);color:var(--muted)}.res.live{background:var(--volt);color:var(--volt-ink)}
.mitem .t{font-weight:600;overflow-wrap:anywhere}
.mitem .d{font-size:12px;color:var(--muted)}
.mitem.medit{grid-template-columns:auto 1fr auto!important}.xdel{padding:9px 16px;font-size:14px;min-width:84px}
.mitem .p{text-align:right;font-size:28px;line-height:.9}
.mitem .p small{display:block;font:500 10px var(--font);color:var(--faint);text-transform:none;letter-spacing:0}
.empty{color:var(--muted);padding:12px 0;text-align:center}
.check{flex-direction:row!important;align-items:center;gap:10px;color:var(--ink)!important;font-size:15px!important}
.check input{width:22px;height:22px;accent-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;z-index:10;max-width:calc(100% - 32px);width:max-content;text-align:center;border-radius:16px}
/* a message must never sit on, or take the tap of, a number in an open bar */
.toast{pointer-events:none}
body:has(.tagbar) .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
textarea{width:100%;height:150px;background:var(--soft);color:var(--ink);border:0;border-radius:12px;font:14px var(--font);padding:12px}
/* phone fit: nested wraps must fill, never grow to their content */
.wrap .wrap{margin:0;width:100%;max-width:none;min-width:0}
.sec,.tbl,.panel,.bug,.player{min-width:0;max-width:100%}
.row>*{min-width:0}
input,select{min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:48px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
/* who passed to the player */
.tagbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--ink);color:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -8px 24px rgba(0,0,0,.25)}
.tagbar .q{font-size:14px;font-weight:600}
.tagbar .nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:42vh;overflow-y:auto}
.tagbar button{height:44px;border-radius:12px;background:var(--bg);color:var(--ink);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.tagbar .more{display:flex;gap:6px}
.tagbar .more input{flex:1;height:44px;min-width:0;background:transparent;color:var(--bg);border:1.5px solid var(--faint);border-radius:12px;padding:0 12px;font-size:16px}
.tagbar .more input::placeholder{color:var(--faint)}
.tagbar .more button{padding:0 16px;font-size:15px}
.tagbar.who .nums{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.tagbar.who .nums button{height:54px;line-height:1.05}
.tagbar.who .nums small{display:block;font-size:10px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.roster{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:72px 1fr auto;gap:8px}
.rrow .rm{padding:0 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
@media (max-width:440px){.tabs{gap:14px}.brand{font-size:24px}}
.tagbar .two{display:flex;gap:6px}.tagbar .two button{flex:1;font-size:15px}
.tagbar button.skip{padding:0 18px;background:transparent;color:var(--bg);box-shadow:inset 0 0 0 1.5px var(--faint);font-size:15px}
.mates{display:flex;flex-direction:column}
.mate{display:grid;grid-template-columns:1fr auto auto auto;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.mates button.mate{width:100%;text-align:left;font:inherit;font-size:14px}
.mate b{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.mate small{display:block;font-size:11px;color:var(--muted);font-weight:400}
@media (max-width:440px){
  .big{font-size:66px}.big i{font-size:40px}
  .pad{gap:5px}.stat{min-height:80px}.stat .n{font-size:30px}.stat .l{font-size:12px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .mitem{grid-template-columns:auto 1fr auto}.mitem .vir{display:none}
  .player{grid-template-columns:auto 1fr}
}
@media (prefers-reduced-motion:reduce){.stat,.live-dot{animation:none;transition:none}}

<body>
<div class="wrap">
  <header>
    <button class="brand" data-view="live" aria-label="Spike Sheet, home"><span class="ball" aria-hidden="true"></span><span>Spike <em>Sheet</em></span></button>
    <nav class="tabs" aria-label="Views">
      <button data-view="live">Live</button>
      <button data-view="history">Season</button>
      <button data-view="player">Player</button>
      <button data-view="team">Team</button>
    </nav>
  </header>
  <div id="syncnote" class="note" hidden></div>
  <main id="app" class="wrap" style="max-width:none"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const STATS = [
  {k:'ace',   l:'Ace',        s:'serve point', g:'pt',  a:'ACE'},
  {k:'kill',  l:'Spike',      s:'kill',        g:'pt',  a:'SPK'},
  {k:'plase', l:'Plasé',      s:'placed over', g:'pt',  a:'PLA'},
  {k:'block', l:'Block',      s:'point',       g:'pt',  a:'BLK'},
  {k:'dig',   l:'Defence',    s:'good dig',    g:'play',a:'DEF'},
  {k:'pass',  l:'Reception',  s:'good pass',   g:'play',a:'REC'},
  {k:'serve', l:'Serve in',   s:'no point',    g:'play',a:'SRV'},
  {k:'assist',l:'Set',        s:'good set',    g:'play',a:'SET'},
  {k:'att',   l:'Attack in',  s:'no point',    g:'play',a:'ATT'},
  {k:'serr',  l:'Serve',      s:'error',       g:'err', a:'SE'},
  {k:'aerr',  l:'Attack',     s:'error',       g:'err', a:'AE'},
  {k:'rerr',  l:'Reception',  s:'error',       g:'err', a:'RE'},
  {k:'berr',  l:'Block out',  s:'their point', g:'err', a:'BO', full:'Block out'},
  {k:'ferr',  l:'Net / fault',s:'error',       g:'err', a:'NF'},
];
const GROUPS = [{g:'pt',h:'Points won'},{g:'play',h:'Good plays'},{g:'err',h:'Errors'}];
const BYK = Object.fromEntries(STATS.map(s=>[s.k,s]));
const PT_KEYS = ['ace','kill','plase','block'];
const ERR_KEYS = ['serr','aerr','rerr','berr','ferr'];
const TAG_KEYS = ['kill','plase'];
const WEIGHT = {ace:1,kill:1,plase:1,block:1,dig:1,pass:.5,assist:.5,serve:0,att:0,serr:-1,aerr:-1,rerr:-1,berr:-.5,ferr:-1};

const S = {matches:{}, player:{name:'', num:'', pos:''}, teams:{team:{name:'', players:[]}, team2:{name:'', players:[]}}, slot:'team', activeId:null, view:'live', openId:null, set:1, db:null, pending:{}, flushing:false, timer:null, armed:null, unsubs:[], user:null};
// Two saved teams per account (settings/team and settings/team2). S.team is the one chosen now.
const SLOTS = ['team', 'team2'];
Object.defineProperty(S, 'team', {get(){ return S.teams[S.slot]; }, set(v){ S.teams[S.slot] = v; }});
const teamOf = slot => S.teams[slot] || S.teams.team;
const slotOf = m => m && m.teamSlot === 'team2' ? 'team2' : 'team';
const teamLabel = slot => teamOf(slot).name || (slot === 'team2' ? 'Team 2' : 'Team 1');

/* ---------- storage ---------- */
const LS = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  // true when it was written
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); if (S.lsFail && k.startsWith('ss.m.')){ S.lsFail = false; syncNote(); } return true; }catch(e){ if (!S.lsFail){ S.lsFail = true; setTimeout(()=>{ toast('This phone cannot save. Free some space.'); syncNote(); }, 0); } return false; } },
};
// Each match has its own key (ss.m.<id>): a tap writes only the match that changed, not the whole
// season (a season is over 1 MB, too slow to write on every tap on a cheap phone).
// written: id -> the updatedAt that is on the phone (only set when the write worked, so a write
// refused for space is tried again on the next save).
let written = {};
function backup(){
  Object.values(S.matches).forEach(m => { if (written[m.id] !== (m.updatedAt||0) && LS.set('ss.m.' + m.id, m)) written[m.id] = m.updatedAt||0; });
  Object.keys(written).forEach(id => { if (!S.matches[id]){ try{ localStorage.removeItem('ss.m.' + id); }catch(e){} delete written[id]; } });
  // the old one-key copy still holds matches that did not fit before: drop each one once it has its own
  // key or was deleted, so it can never bring a deleted match back
  if (S.oldLeft){ const old = LS.get('ss.matches') || {}; let ch = false;
    Object.keys(old).forEach(id => { if (!S.matches[id] || written[id] != null){ delete old[id]; ch = true; } });
    if (!Object.keys(old).length){ try{ localStorage.removeItem('ss.matches'); }catch(e){} S.oldLeft = false; } else if (ch) LS.set('ss.matches', old); }
  LS.set('ss.active', S.activeId); LS.set('ss.player', S.player); LS.set('ss.team', S.teams.team); LS.set('ss.team2', S.teams.team2);
}
function restore(){
  const ms = {};
  try{ for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith('ss.m.')){ const x = LS.get(k); if (x && x.id) ms[x.id] = x; } } }catch(e){}
  written = {}; Object.values(ms).forEach(x => written[x.id] = x.updatedAt||0);
  // before 2026-10-07 every match sat in one key: each one moves to its own key (the newer copy wins)
  // and leaves the old key at once; the key goes when it is empty
  const old = LS.get('ss.matches');
  S.oldLeft = false;
  if (old && typeof old === 'object'){
    Object.keys(old).forEach(id => { const x = old[id];
      if (!x || !x.id || (ms[x.id] && (ms[x.id].updatedAt||0) >= (x.updatedAt||0))){ delete old[id]; return; }
      ms[x.id] = x;
      try{ localStorage.setItem('ss.m.' + x.id, JSON.stringify(x)); written[x.id] = x.updatedAt||0; delete old[id]; }catch(e){} });
    if (!Object.keys(old).length) try{ localStorage.removeItem('ss.matches'); }catch(e){}
    else { S.oldLeft = true; LS.set('ss.matches', old); }
  }
  S.matches = ms;
  const p = LS.get('ss.player'); if (p && typeof p === 'object') S.player = Object.assign(S.player, p);
  SLOTS.forEach(k => { const t = LS.get('ss.' + k); if (t && typeof t === 'object') S.teams[k] = Object.assign({name:'', players:[]}, t); });
  S.slot = LS.get('ss.slot') === 'team2' ? 'team2' : 'team';
  const td = LS.get('ss.teamDraft'); if (td && td.d && Array.isArray(td.d.players)){ S.teamDraft = td.d; S.draftSlot = td.slot; }
  S.activeId = LS.get('ss.active');
  if (S.activeId && (!S.matches[S.activeId] || S.matches[S.activeId].done)) S.activeId = null;
  const a = S.activeId && S.matches[S.activeId];
  if (a) S.set = a.curSet || 1;
}
// Always newer than the copy it was made from, even if this phone's clock is behind the phone that saved it last:
// otherwise the older cloud copy would win and take the new taps away.
const stamp = o => Math.max(Date.now(), (o.updatedAt||0) + 1);
function save(m){
  m.updatedAt = stamp(m);
  S.matches[m.id] = m;
  backup(); queue('matches/'+m.id);
}
function saveTeam(){ S.team.updatedAt = stamp(S.team); backup(); queue('settings/' + S.slot); }
function savePlayer(){ S.player.updatedAt = stamp(S.player); backup(); queue('settings/player'); }
function queue(path){
  if (!S.db) return;
  S.pending[path] = true;
  clearTimeout(S.flushT); S.flushT = setTimeout(flush, 500);
}
function bodyFor(path){
  if (path === 'settings/player') return S.player;
  if (path === 'settings/team' || path === 'settings/team2') return S.teams[path.slice(9)];
  return S.matches[path.slice(8)];
}
async function flush(){
  if (S.flushing || !S.db) return;
  S.flushing = true;
  try{
    for (const path of Object.keys(S.pending)){
      delete S.pending[path];
      const body = bodyFor(path);
      // a refused write comes back through SS_writeFailed, which queues it again
      try{
        if (body) await S.db.doc(path).set(JSON.parse(JSON.stringify(body)));
        else await S.db.doc(path).delete();
      }catch(e){ S.pending[path] = true; }
    }
  } finally { S.flushing = false; }
  if (S.db && Object.keys(S.pending).length) { clearTimeout(S.flushT); S.flushT = setTimeout(flush, 3000); }
}
function connect(db){
  S.db = db;
  // Upload only what this phone has that is newer than the shared copy, and
  // only after reading the shared copy, so an older phone never overwrites a newer one.
  let first = true;
  const lastSync = LS.get('ss.synced') || 0;
  // ids the cloud has confirmed it holds. Only such a match may be dropped here when the cloud
  // no longer has it (deleted on another phone). A match the cloud never took is uploaded, never dropped.
  const hadList = Array.isArray(LS.get('ss.cloud'));
  const known = new Set(LS.get('ss.cloud') || []);
  S.unsubs.push(db.collection('matches').onSnapshot(snap => {
    let changed = false;
    const seen = new Set();
    const reconcile = first && !snap.metadata?.fromCache;
    const deleted = new Set(LS.get('ss.deleted') || []);
    snap.docs.forEach(d => {
      const r = d.data(); if (!r) return;
      if (deleted.has(d.id)) { if (!S.matches[d.id]) queue('matches/'+d.id); return; }
      seen.add(d.id);
      if (!snap.metadata?.fromCache && !d.pending) known.add(d.id);
      const local = S.matches[d.id];
      if (!local || (r.updatedAt||0) > (local.updatedAt||0)) { S.matches[d.id] = JSON.parse(JSON.stringify(r)); changed = true; }
      else if (reconcile && (local.updatedAt||0) > (r.updatedAt||0)) queue('matches/'+d.id);
    });
    if (reconcile){
      // a match only on this phone: upload it if it was made since the last sync,
      // otherwise it was deleted on the other phone, so drop it here too
      Object.keys(S.matches).forEach(id => {
        if (seen.has(id)) return;
        // (a phone updated from an older version has no list yet: it falls back to the time of its last sync, once)
        const gone = hadList ? known.has(id) : (S.matches[id].updatedAt||0) <= lastSync;
        if (!gone) queue('matches/'+id);
        else { delete S.matches[id]; if (S.activeId === id) S.activeId = null; changed = true; }
      });
      first = false;
    }
    if (!snap.metadata?.fromCache){
      LS.set('ss.synced', Date.now());
      // a delete is done once the cloud no longer has the match
      const ids = new Set(snap.docs.map(d => d.id));
      [...deleted].forEach(id => { if (!ids.has(id)) deleted.delete(id); });
      LS.set('ss.deleted', [...deleted]);
    }
    snap.docChanges().forEach(c => {
      if (c.type !== 'removed') return;
      const id = c.doc.id, was = known.delete(id);
      // gone from the cloud: drop it here only if the cloud really had it (another phone deleted it).
      // A new match whose upload was refused also shows as "removed": that one stays on the phone.
      if (was && S.matches[id] && !S.pending['matches/'+id]) { delete S.matches[id]; changed = true; }
    });
    if (!snap.metadata?.fromCache){
      [...known].forEach(id => { if (!seen.has(id) && !deleted.has(id)) known.delete(id); });
      LS.set('ss.cloud', [...known]);
    }
    const act = S.activeId && S.matches[S.activeId];
    if (S.activeId && (!act || act.done)) { S.activeId = null; S.choose = false; changed = true; }
    if (changed){ backup(); if (!isTyping()) render(); }
  }, () => {}));
  let firstP = true;
  S.unsubs.push(db.doc('settings/player').onSnapshot(d => {
    const r = d.exists && d.data();
    if (r && (r.updatedAt||0) > (S.player.updatedAt||0)) { S.player = Object.assign({}, r); backup(); if (!isTyping()) render(); }
    else if (firstP && !d.metadata?.fromCache && (S.player.updatedAt||0) > ((r && r.updatedAt)||0)) queue('settings/player');
    if (!d.metadata?.fromCache) firstP = false;
  }, () => {}));
  SLOTS.forEach(k => {
    let firstT = true;
    S.unsubs.push(db.doc('settings/' + k).onSnapshot(d => {
      const r = d.exists && d.data();
      if (r && (r.updatedAt||0) > (S.teams[k].updatedAt||0)) { S.teams[k] = Object.assign({name:'', players:[]}, r); backup(); if (!isTyping()) render(); }
      else if (firstT && !d.metadata?.fromCache && (S.teams[k].updatedAt||0) > ((r && r.updatedAt)||0)) queue('settings/' + k);
      if (!d.metadata?.fromCache) firstT = false;
    }, () => {}));
  });
  flush();
}
function disconnect(){
  S.unsubs.forEach(u => { try{ u(); }catch(e){} });
  S.unsubs = []; S.db = null; S.pending = {}; S.saveFailed = false; clearTimeout(S.flushT);
}
// keepUnsaved: on sign-out, a match the account never took stays on the phone (it is the only copy)
function clearLocal(keepUnsaved, keepCards){
  const had = keepUnsaved && LS.get('ss.cloud'), keep = {};
  if (Array.isArray(had)) Object.values(S.matches).forEach(m => { if (!had.includes(m.id)) keep[m.id] = m; });
  S.matches = keep; S.activeId = null; dropDraft();
  try{ localStorage.removeItem('ss.matches'); }catch(e){} S.oldLeft = false;
  // keepCards: a save was being refused, so the player card and roster may exist only here
  if (!keepCards){ S.player = {name:'', num:'', pos:''}; S.teams = {team:{name:'', players:[]}, team2:{name:'', players:[]}}; }
  try{ localStorage.removeItem('ss.synced'); localStorage.removeItem('ss.deleted'); localStorage.removeItem('ss.cloud'); }catch(e){}
  backup();
}
// Called by the Firebase module whenever the signed-in account changes.
window.SS_onUser = (u, db) => {
  const prev = LS.get('ss.uid'), refused = S.saveFailed;
  disconnect();
  if (u){
    // another account used this phone before: never mix their matches in
    if (prev && prev !== u.uid) clearLocal();
    LS.set('ss.uid', u.uid);
    S.user = u;
    connect(db);
  } else {
    S.user = null;
    // signed out: take this account's matches off the phone (they stay in the cloud)
    if (prev){ clearLocal(true, refused); try{ localStorage.removeItem('ss.uid'); }catch(e){} }
  }
  syncNote(); render();
};
// The cloud refused a write: keep the match on the phone, say so once, and try again every 20 s.
window.SS_writeFailed = (e, path) => {
  if (!S.db) return;
  if (path) S.pending[path] = true;
  if (!S.saveFailed){
    S.saveFailed = true; syncNote();
    toast(e && e.code === 'permission-denied' ? 'Not saved to your account. Sign out and in again.' : 'Not saved to your account yet. Trying again.');
  }
  clearTimeout(S.flushT); S.flushT = setTimeout(flush, 20000);
};
window.SS_writeOk = () => { if (S.saveFailed){ S.saveFailed = false; syncNote(); } };
window.SS_toast = t => toast(t);
function syncNote(){
  const n = document.getElementById('syncnote');
  n.hidden = false;
  n.innerHTML = S.user
    ? (S.saveFailed ? `Saved on this phone. Not in your account yet (${esc(S.user.email || 'your account')}). Trying again.`
      : `<span class="dot-ok"></span>Synced to ${esc(S.user.email || 'your account')}`)
    : `Saving on this phone only. <button class="lnk" id="b-signin">Sign in with Google</button> to sync and back up.`
      // iPhone Safari deletes a site's data after 7 days unused; the home-screen app keeps it
      + (/iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone ? ' On iPhone, also add it to the Home Screen: Safari deletes it after a week unused.' : '');
  // the phone is full: said all the time, not once
  if (S.lsFail) n.innerHTML = `<b style="color:var(--neg)">This phone is full: new taps are not saved. Free some space.</b> ` + n.innerHTML;
}
const isTyping = () => ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);

/* ---------- analysis ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// A team match (mode 'team'): each stat event has p = the jersey number; roster = the players at the start.
const isTeam = m => !!m && m.mode === 'team';
// a jersey number as typed -> digits only, no leading zeros ("07" and "7" are the same player)
const jnum = n => String(n).replace(/\D/g,'').slice(0,3).replace(/^0+(?=\d)/,'');
const trackMode = () => S.track || LS.get('ss.track') || 'player';
const zeroCounts = () => Object.fromEntries(STATS.map(s=>[s.k,0]));
// One row per player over the given team matches, best scorer first. '' = taps left without a number.
function playerRows(ms){
  const by = {};
  ms.forEach(m => {
    const names = Object.fromEntries((m.roster||[]).map(p => [p.num, p.name]));
    (m.log||[]).forEach(e => {
      if (!BYK[e.k]) return;
      const n = e.p || '', r = by[n] || (by[n] = {num:n, name:'', c:zeroCounts()});
      r.c[e.k]++; if (!r.name && names[n]) r.name = names[n];
    });
  });
  return Object.values(by).sort((a,b) => pts(b.c)-pts(a.c) || vir(b.c)-vir(a.c));
}
const pLabel = r => r.num ? '#' + r.num + (r.name ? ' ' + r.name : '') : 'No player';
function whoTxt(e, m){
  if (!e.p) return '';
  const pl = (m.roster||[]).find(x => x.num === e.p);
  return ' · #' + e.p + (pl && pl.name ? ' ' + pl.name : '');
}
// p: only the taps of that jersey number (team matches)
function counts(m, set, p){
  const c = Object.fromEntries(STATS.map(s=>[s.k,0]));
  // a team match switched to the player: only that player's number counts
  if (p == null && !isTeam(m) && m.soloNum) p = m.soloNum;
  (m.log||[]).forEach(e => { if (BYK[e.k] && (set == null || e.set === set) && (p == null || e.p === p)) c[e.k]++; });
  return c;
}
const pts = c => PT_KEYS.reduce((a,k)=>a+(c[k]||0),0);
const errs = c => ERR_KEYS.reduce((a,k)=>a+(c[k]||0),0);
const vir = c => STATS.reduce((a,s)=>a+WEIGHT[s.k]*(c[s.k]||0),0);
const fmtVir = v => (Math.round(v*10)/10).toString();
const fmtPM = v => (v>0?'+':'')+v;
const pmClass = v => v>0?'pos':v<0?'neg':'';

// Replays the log: running set scores, the player's court stints and +/-.
function analyze(m){
  const score = {}, stints = []; let on = null, plus = 0, minus = 0; const feed = [];
  const sc = s => score[s] || (score[s] = {us:0, them:0});
  (m.log||[]).forEach(e => {
    const s = sc(e.set);
    if (e.k === 'us' || e.k === 'them'){
      s[e.k]++;
      // missed points (arrived late, Fix score): only the score, never the player's +/-, not one line each in the feed
      if (e.late){ const f = feed[feed.length-1]; if (f && f.e.late === e.late){ f.us = s.us; f.them = s.them; } else feed.push({e, us:s.us, them:s.them}); return; }
      if (on){ if (e.k === 'us'){ on.plus++; plus++; } else { on.minus++; minus++; } }
    } else if (e.k === 'on'){
      on = {inSet:e.set, inUs:s.us, inThem:s.them, plus:0, minus:0, t:e.t};
      stints.push(on);
    } else if (e.k === 'off' && on){
      on.outSet = e.set; on.outUs = s.us; on.outThem = s.them; on.dur = e.dur; on = null;
    }
    // an automatic team point belongs to the stat just before it
    if (e.auto && feed.length){ const f = feed[feed.length-1]; f.us = s.us; f.them = s.them; }
    else feed.push({e, us:s.us, them:s.them});
  });
  return {score, stints, plus, minus, pm: plus - minus, feed, onNow: !!on};
}
// open: also count every set with a score that was not ended, as the final whistle will end it
function setsWon(m){
  const {score} = analyze(m); let w = 0, l = 0;
  (m.ended||[]).forEach(s => { const x = score[s]; if (!x) return; if (x.us > x.them) w++; else if (x.them > x.us) l++; });
  return {w, l};
}
const scoredSets = score => Object.keys(score).map(Number).filter(s => score[s].us || score[s].them);
function playMs(m){ return (m.playMs||0) + (m.onCourt && m.courtSince ? Date.now() - m.courtSince : 0); }
function fmtTime(ms){
  const t = Math.floor(ms/1000), h = Math.floor(t/3600), mi = Math.floor(t%3600/60), s = t%60;
  return h ? `${h}:${String(mi).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${mi}:${String(s).padStart(2,'0')}`;
}
const mins = ms => Math.round(ms/60000);
function fmtDate(d){ try{ return new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}); }catch(e){ return d; } }
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

function buzz(){ try{ navigator.vibrate && navigator.vibrate(12); }catch(e){} }
let wake = null;

document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState !== 'visible'){ S.hiddenAt = Date.now(); return; }
  if (!S.activeId) return;

});
const pName = () => S.player.name || 'Player';
// mid-sentence: the name, or "the player" (no he/she anywhere)
const pWho = () => esc(S.player.name || 'the player');
const pWhose = () => S.player.name ? esc(S.player.name) + "'s" : "the player's";
const homeName = m => m.home || 'Us';
function evLabel(e, m){
  if (e.late) return {t:'Score typed in', c:'team'};
  if (e.k === 'to') return {t:'Time-out ' + (e.side === 'us' ? homeName(m) : (m.opp||'them')), c:'sub'};
  if (BYK[e.k]) return {t: (BYK[e.k].full || BYK[e.k].l + (BYK[e.k].g==='err' ? ' error' : '')) + (e.from ? ' · pass from ' + e.from : '') + whoTxt(e, m), c: BYK[e.k].g==='play' ? '' : BYK[e.k].g};
  if (e.k === 'us') return {t:'Point ' + homeName(m), c:'team'};
  if (e.k === 'them') return {t:'Point ' + (m.opp||'them'), c:'team'};
  if (e.k === 'on') return {t: pName() + ' on court', c:'sub'};
  if (e.k === 'off') return {t: pName() + ' to the bench', c:'sub'};

}

/* ---------- actions ---------- */
function pickSlot(k){ S.slot = k; LS.set('ss.slot', k); }
// "25-20, 22-25" -> [[25,20],[22,25]]; null when something typed is not a score
function parseScores(t){
  const parts = String(t||'').split(/[,;\s]+/).filter(Boolean);
  const out = parts.map(p => { const x = p.match(/^(\d{1,2})[-–:./](\d{1,2})$/); return x ? [+x[1], +x[2]] : null; });
  return out.every(Boolean) ? out : null;
}
// Points that were missed (arrived late, or a gap): only the score, marked `late` with one batch id,
// so they carry no stats, no +/- and no court time, and one Undo takes the whole batch back.
function pushLate(m, set, us, them){
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  for (let i = 0; i < us; i++) push(m, {k:'us', set, late:id});
  for (let i = 0; i < them; i++) push(m, {k:'them', set, late:id});
}
function startMatch(f){
  const id = 'm' + Date.now().toString(36);
  const m = {id, opp:f.opp||'Opponent', home:f.home||'', date:f.date||today(), team:f.team||'', log:[], playMs:0, onCourt:false, courtSince:null, curSet:1, maxSet:1, ended:[], result:'', score:'', done:false, createdAt:Date.now(), bestOf:5};
  if (f.away) m.away = true;
  if (f.mode === 'team'){ m.mode = 'team'; m.teamSlot = S.slot; m.roster = JSON.parse(JSON.stringify(S.team.players)); if (!m.home) m.home = S.team.name || ''; }
  // started late: the sets already played are over, the match carries on in the next one
  (f.sets||[]).forEach(([u, t], i) => { pushLate(m, i+1, u, t); m.ended.push(i+1); });
  S.set = (f.sets||[]).length + 1; m.curSet = m.maxSet = S.set;
  if (f.now) pushLate(m, S.set, f.now[0], f.now[1]);
  S.activeId = id; S.choose = false; S.nfAway = false; S.nfDraft = null;
  save(m);
  if (f.starter && !isTeam(m)) courtOn(m);
  keepAwake(); render(); window.scrollTo(0,0);
}
function push(m, e){ m.log = (m.log||[]).concat(Object.assign({set:S.set, t:Date.now()}, e)); }
function tap(k){
  const m = S.matches[S.activeId]; if (!m) return;

  if (S.lastStat && S.lastStat.k === k && Date.now() - S.lastStat.at < 400) return;
  S.lastStat = {k, at:Date.now()};
  whoLeft();
  S.tag = null; S.who = null; clearTimeout(S.tagT);
  const team = isTeam(m);
  // a stat means the player is playing: put them on court if the tap was forgotten
  let rs = false;
  if (team){} else if (!m.onCourt){ courtOn(m, true); toast(pName() + ' put on court'); } else rs = resumeClock(m);
  push(m, Object.assign(rs ? {k, rs:1} : {k}, m.soloNum && !team ? {p:m.soloNum} : {}));
  const idx = m.log.length - 1;
  // the player's point wins the rally for the team; an error gives it to the other team
  if (PT_KEYS.includes(k)) push(m, {k:'us', auto:1});
  if (ERR_KEYS.includes(k)) push(m, {k:'them', auto:1});
  // a spike or plasé: ask which number passed the ball
  // a team match: ask which number did it
  if (team){
    S.who = {mid:m.id, i:idx}; S.barAt = Date.now();
    // closes under a finger reaching for a number: that tap must not hit what is underneath
    S.tagT = setTimeout(()=>{ if (!isTyping()){ whoLeft(); S.who = null; S.barAt = S.barClosedAt = Date.now(); render(); } }, 20000);
  } else if (TAG_KEYS.includes(k)){
    S.tag = {mid:m.id, i:idx}; S.barAt = Date.now();
    S.tagT = setTimeout(()=>{ if (!isTyping()){ S.tag = null; S.barAt = S.barClosedAt = Date.now(); render(); } }, 20000);
  }
  save(m); buzz(); render();
  const el = document.querySelector(`[data-stat="${k}"]`);
  if (el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
// n: a jersey number, or '' for "None"
function setPasser(n){
  const m = S.tag && S.matches[S.tag.mid], e = m && m.log[S.tag.i];
  n = jnum(n);
  if (e && n){
    e.from = '#' + n; save(m); toast('Pass from #' + n);
    const known = +n >= 1 && +n <= 20 || (S.player.extraNums||[]).includes(n);
    if (!known){ S.player.extraNums = [...(S.player.extraNums||[]), n].sort((a,b)=>a-b); savePlayer(); }
  }
  S.tag = null; S.barAt = S.barClosedAt = Date.now(); clearTimeout(S.tagT); render();
}
// The who bar is closing by another tap (next stat, a point, End set, time-out) or by itself:
// say that the stat has no player yet. Skip and Undo are choices and say nothing.
function whoLeft(){
  const m = S.who && !S.who.fix && S.matches[S.who.mid], e = m && m.log[S.who.i];
  // after the tap's own message ("Set 1: 25-20"), so this one is the one left on screen
  if (e && BYK[e.k] && !e.p){ const t = `${evLabel(e, m).t}: no player. Tap it in Play by play to add one`; setTimeout(() => toast(t), 0); }
}
// n: a jersey number, or '' for "Skip". A number that is not on the roster joins it for this match.
function setWho(n){
  const m = S.who && S.matches[S.who.mid], e = m && m.log[S.who.i];
  n = jnum(n);
  if (e && n){
    e.p = n;
    if (!(m.roster||[]).some(p => p.num === n)) m.roster = [...(m.roster||[]), {num:n, name:''}];
    save(m);
  }
  S.who = null; S.barAt = S.barClosedAt = Date.now(); clearTimeout(S.tagT); render();
}
function teamPoint(side){
  const m = S.matches[S.activeId]; if (!m) return;
  // a double tap is one point: no rally is over in 0.4 s
  if (S.lastPt && S.lastPt.side === side && Date.now() - S.lastPt.at < 400) return;
  S.lastPt = {side, at:Date.now()};
  S.tag = null; S.who = null;
  push(m, resumeClock(m) ? {k:side, rs:1} : {k:side}); save(m); buzz(); render();
}
// A time-out: noted with the score, the court clock stops, and the screen freezes (m.toOn) until
// "Resume play". seg / onAt let Undo put the clock back exactly while it is still frozen.
function timeOut(side){
  const m = S.matches[S.activeId]; if (!m) return;
  S.toAsk = false; S.barAt = S.barClosedAt = Date.now();
  const e = {k:'to', side};
  if (m.onCourt && m.courtSince){ const before = m.playMs||0; e.onAt = m.courtSince; pauseClock(m); e.seg = m.playMs - before; }
  push(m, e); m.toOn = true; save(m); buzz(); render();
}
// The clock starts again only if the time-out stopped it (not one called during a set break).
function resumePlay(){
  const m = S.matches[S.activeId]; if (!m || !m.toOn) return;
  const e = [...(m.log||[])].reverse().find(x => x.k === 'to');
  delete m.toOn; S.barClosedAt = Date.now();
  if (e && e.seg != null) resumeClock(m);
  save(m); buzz(); render();
}
function freezeView(m){
  const e = [...(m.log||[])].reverse().find(x => x.k === 'to'); if (!e) return '';
  const sc = analyze(m).score[e.set] || {us:0, them:0}, n = m.log.filter(x => x.k === 'to' && x.side === e.side && x.set === e.set).length;
  return `<div class="freeze" role="dialog" aria-label="Time-out">
    <div class="kicker">Set ${e.set} · ${m.away ? sc.them + '–' + sc.us : sc.us + '–' + sc.them}</div>
    <h2>Time-out</h2>
    <div class="fz-team">${esc(e.side === 'us' ? homeName(m) : m.opp)} · ${n === 1 ? '1st' : n === 2 ? '2nd' : n === 3 ? '3rd' : n + 'th'} in this set</div>
    <div class="fz-clock" id="toclock">${fmtTime(Date.now() - (e.t||Date.now()))}</div>
    <button class="btn btn-or" id="b-resumeplay">Resume play</button>
    <button class="btn btn-dk" id="b-toundo">Wrong tap, undo time-out</button>
  </div>`;
}
// Fix score: rallies were missed, the current set jumps to the score typed (points only go up; Undo takes points back)
function fixScore(us, them){
  const m = S.matches[S.activeId]; if (!m) return;
  const sc = analyze(m).score[S.set] || {us:0, them:0};
  if (!(us >= 0 && them >= 0)) return toast('Type both scores');
  if (us < sc.us || them < sc.them) return toast('Lower than now: use Undo to take points back');
  if (us === sc.us && them === sc.them){ S.fixAsk = false; return render(); }
  pushLate(m, S.set, us - sc.us, them - sc.them);
  S.fixAsk = false; S.barClosedAt = Date.now(); save(m); render(); toast(`Set ${S.set} now ${us}–${them}`);
}
function timeoutBar(m){
  if (S.toAsk) return `<div class="tagbar" role="group" aria-label="Time-out">
    <div class="q">Time-out: which team?</div>
    <div class="two">${m.away ? `<button data-to="them">${esc(m.opp)}</button><button data-to="us">${esc(homeName(m))}</button>` : `<button data-to="us">${esc(homeName(m))}</button><button data-to="them">${esc(m.opp)}</button>`}</div>
    <div class="two"><button class="skip" data-to="">Cancel</button></div></div>`;
  if (S.fixAsk){ const sc = analyze(m).score[S.set] || {us:0, them:0};
    return `<div class="tagbar" role="group" aria-label="Fix score">
    <div class="q">Set ${S.set} score now: ${esc(m.away ? m.opp + ' – ' + homeName(m) : homeName(m) + ' – ' + m.opp)}<br><span style="font-weight:400;opacity:.7">Missed rallies count only for the score.</span></div>
    <form class="more" id="fixform">
      ${(i => m.away ? i[1] + i[0] : i[0] + i[1])([
        `<input class="sm" id="fix-us" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="${sc.us}" aria-label="${esc(homeName(m))}">`,
        `<input class="sm" id="fix-them" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="${sc.them}" aria-label="${esc(m.opp)}">`])}
      <button type="submit">Save</button><button type="button" class="skip" id="b-fixno">Cancel</button>
    </form></div>`; }
  return '';

// Set break: the court clock stops when a set ends and starts again with the first tap of the next set.
// The player stays "on court" (no bench event); stintMs is the time already counted in this spell.
function pauseClock(m){
  if (!m.onCourt || !m.courtSince) return;
  const seg = Date.now() - m.courtSince;
  m.playMs = (m.playMs||0) + seg; m.stintMs = (m.stintMs||0) + seg; m.courtSince = null;
}
// true when this tap is the one that restarted the clock after a set break (the event is marked rs, so Undo can stop it again)
function resumeClock(m){ if (m.onCourt && !m.courtSince){ m.courtSince = Date.now(); return true; } return false; }
function courtOn(m, auto){ m.onCourt = true; m.courtSince = Date.now(); m.stintMs = 0; push(m, auto ? {k:'on', byStat:1} : {k:'on'}); }
function toggleCourt(){
  const m = S.matches[S.activeId]; if (!m) return;
  if (m.onCourt){
    const seg = m.courtSince ? Date.now() - m.courtSince : 0, pre = m.stintMs||0;
    push(m, {k:'off', dur:pre+seg, onAt:m.courtSince, pre});
    m.playMs = (m.playMs||0) + seg; m.onCourt = false; m.courtSince = null; m.stintMs = 0;
  } else courtOn(m);
  save(m); buzz(); render();
}
// The set Undo must first go back to: the last tap is in another set than the one on screen
// (straight after "End set", or after looking at an earlier set). null = the last tap is in this set.
function undoBack(m){
  const log = m.log||[], last = log[log.length-1];
  // in the last set "End set" stays on that set: Undo first opens it again
  if (last) return last.set !== S.set || (S.set >= lastSet(m) && (m.ended||[]).includes(S.set)) ? last.set : null;
  return S.set > 1 ? S.set - 1 : null;
}
function undo(){
  const m = S.matches[S.activeId]; if (!m) return;
  S.keepSet = null; S.who = null;
  const back = undoBack(m);
  if (back != null){
    // takes back "End set": that set is open again, and nothing is removed from it yet
    m.ended = (m.ended||[]).filter(s => s !== back);
    S.set = back; m.curSet = back; S.tag = null; resumeClock(m);
    save(m); render(); return toast('Back in set ' + back);
  }
  if (!m.log?.length) return;
  let last = m.log[m.log.length-1];
  m.log = m.log.slice(0,-1);
  S.tag = null;
  // typed-in points go back as one batch
  if (last.late){ while (m.log.length && m.log[m.log.length-1].late === last.late) m.log = m.log.slice(0,-1); save(m); render(); return toast('Undone: score typed in'); }
  // a time-out that stopped the clock: put the clock back as if it never stopped
  // (after Resume play the time-out's minute stays uncounted: the clock is not rewound across play)
  if (last.k === 'to'){ delete m.toOn; if (last.seg != null && m.onCourt && !m.courtSince){ m.playMs = Math.max(0, (m.playMs||0) - last.seg); m.stintMs = Math.max(0, (m.stintMs||0) - last.seg); m.courtSince = last.onAt; } save(m); render(); return toast('Undone: ' + evLabel(last, m).t); }
  // a stat's automatic team point goes with it
  if ((last.k === 'us' || last.k === 'them') && last.auto && m.log.length && BYK[m.log[m.log.length-1].k]){ last = m.log[m.log.length-1]; m.log = m.log.slice(0,-1); }
  // the tap that restarted the clock after a set break is taken back: the break goes on, clock stopped
  if (last.rs && m.onCourt) m.courtSince = null;
  const dropSpell = () => { m.playMs = Math.max(0, (m.playMs||0) - (m.stintMs||0)); m.onCourt = false; m.courtSince = null; m.stintMs = 0; };
  if (last.k === 'on') dropSpell();
  // a stat that put the player on court by itself: take that back too
  else if (BYK[last.k] && m.log.length && m.log[m.log.length-1].k === 'on' && m.log[m.log.length-1].byStat){ m.log = m.log.slice(0,-1); dropSpell(); }

  // the clock restarts now - never across the hours or days between finishing and resuming
  if (last.k === 'off' && last.fin){ m.onCourt = true; m.courtSince = Date.now(); m.stintMs = last.dur||0; }
  // 'pre' = time already counted before a set break; a spell taken off during the break comes back still stopped
  else if (last.k === 'off'){ m.playMs = Math.max(0,(m.playMs||0) - ((last.dur||0) - (last.pre||0))); m.onCourt = true; m.stintMs = last.pre||0; m.courtSince = 'pre' in last ? last.onAt : (last.onAt || Date.now()); }
  save(m); render(); toast('Undone: ' + evLabel(last, m).t);
}
function pickSet(n){
  const m = S.matches[S.activeId];
  // going forward with the set buttons instead of "End set": the set that was played is over
  if (m && n > S.set && !(m.ended||[]).includes(S.set)){ const sc = analyze(m).score[S.set]; if (sc && (sc.us || sc.them)){ m.ended = [...(m.ended||[]), S.set].sort((a,b)=>a-b); pauseClock(m); } }
  S.set = n;
  if (m){ m.curSet = n; m.maxSet = Math.max(m.maxSet||1, n); save(m); }
  render();
}
function endSet(){
  const m = S.matches[S.activeId]; if (!m) return;
  const s = S.set, sc = analyze(m).score[s];
  // a stray tap before the first point must not move the match into the next set
  if (!sc || !(sc.us || sc.them)) return toast(`Set ${s} has no points yet`);
  m.ended = [...new Set([...(m.ended||[]), s])].sort((a,b)=>a-b);
  pauseClock(m); S.barAt = Date.now();
  toast(`Set ${s}: ${sc.us}–${sc.them}`);
  pickSet(s >= lastSet(m) ? s : s+1);
}
function finishMatch(result, score, endAt){
  const m = S.matches[S.activeId]; if (!m) return;
  // the final whistle belongs to the last set that was played, not an empty next set or one looked back at
  const played = scoredSets(analyze(m).score), offSet = played.length ? Math.max(...played) : S.set;
  if (m.onCourt){ const end = Math.max(endAt || Date.now(), m.courtSince||0), seg = m.courtSince ? end-m.courtSince : 0, pre = m.stintMs||0; push(m,{k:'off',dur:pre+seg,onAt:m.courtSince,pre,set:offSet,t:end,fin:1}); m.playMs=(m.playMs||0)+seg; m.onCourt=false; m.courtSince=null; m.stintMs=0; }
  // a set left open whose score finishes it is over now (also one left open by going back with the set buttons);
  // a set stopped half-way (abandoned at 10-12) is not a set won or lost
  const fsc = analyze(m).score, fin = s => { const x = fsc[s], hi = Math.max(x.us, x.them), lo = Math.min(x.us, x.them); return hi >= (s >= lastSet(m) ? 15 : 25) && hi - lo >= 2; };
  m.ended = [...new Set([...(m.ended||[]), ...scoredSets(fsc).filter(fin)])].sort((a,b)=>a-b);
  m.result = result; m.score = score; m.done = true; delete m.toOn;
  save(m);
  S.activeId = null; backup();
  S.view = 'match'; S.openId = m.id; render(); window.scrollTo(0,0);
}
// Close the open match (result guessed from sets won) and go straight to the new-match form.
function closeAndNew(){
  const m = S.matches[S.activeId]; if (!m) return;
  // an open set counts only when its score finishes it (5-0 in set 1 is not a set won)
  const {w, l} = setsDone(m), log = m.log||[];
  // a result saved before "Keep tracking" wins over the guess from sets won
  const sv = savedResult(m, w, l);
  finishMatch(sv.result, sv.score, log.length ? log[log.length-1].t : m.createdAt);
  S.view = 'live'; render(); window.scrollTo(0,0);
  toast('Saved. It is in Season.');

// Player match -> team match: the player's taps so far go to their number, the chosen team's roster is copied in.
function switchToTeam(){
  const m = S.matches[S.activeId]; if (!m || isTeam(m)) return;
  const num = jnum(S.player.num || '');
  if (!num) return toast("Add the player's number first (Player tab)");
  if (!S.team.players.length) return toast('Add the team first (Team tab)');
  // the court clock is for one player only: close the spell now
  if (m.onCourt){ const seg = m.courtSince ? Date.now() - m.courtSince : 0, pre = m.stintMs||0; push(m, {k:'off', dur:pre+seg, onAt:m.courtSince, pre}); m.playMs = (m.playMs||0) + seg; m.onCourt = false; m.courtSince = null; m.stintMs = 0; }

  const back = !!m.soloNum;
  if (!back){ m.log.forEach(e => { if (BYK[e.k] && !e.p) e.p = num; }); m.teamSlot = S.slot; m.roster = JSON.parse(JSON.stringify(S.team.players)); }
  m.mode = 'team'; delete m.soloNum;
  if (!m.roster.some(p => p.num === num)) m.roster = [...m.roster, {num, name:S.player.name||''}].sort((a,b) => a.num - b.num);
  if (!m.home) m.home = S.team.name || '';
  S.tag = null; save(m); render(); window.scrollTo(0,0); toast('Now ' + teamLabel(slotOf(m)) + ' · ' + pName() + "'s taps are #" + num);
}
// Team match -> player match: every tap is kept, only the player's number is shown and counts in the player Season.
function switchToPlayer(){
  const m = S.matches[S.activeId]; if (!m || !isTeam(m)) return;
  const num = jnum(S.player.num || '');
  if (!num) return toast("Add the player's number first (Player tab)");
  delete m.mode; m.soloNum = num;
  S.who = null; save(m); render(); window.scrollTo(0,0); toast('Now ' + pName() + ' only (#' + num + ')');

// Hidden while a match is live: that match's screen is where Live leads.
const newMatchBtn = () => S.activeId && S.matches[S.activeId] ? '' : `<button class="btn btn-or" data-view="live">+ New match</button>`;
function resume(id){
  const m = S.matches[id]; if (!m) return;
  if (S.activeId && S.activeId !== id && S.matches[S.activeId]) return toast('Finish the live match first');

// Greek in capitals has no stress accent (ΟΛΥΜΠΙΑΚΟΣ, not ΟΛΥΜΠΙΑΚΌΣ) but keeps the diaeresis (ΠΑΝΑΘΗΝΑΪΚΟΣ).
// Done here, not left to the browser: iPhones do not all drop it for text-transform:uppercase.
const greekPlain = s => s.normalize('NFD').replace(/([Ͱ-Ͽ]̈?)́/g, '$1').normalize('NFC');
function capsFix(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) if (/[Ά-ΐά-ΰό-ώ]/.test(n.data) && getComputedStyle(n.parentElement).textTransform === 'uppercase') n.data = greekPlain(n.data);
}

  if (S.view === 'live' && m && (m.onCourt || m.toOn)) S.timer = setInterval(()=>{ const c = $('#clock'); if (c) c.textContent = fmtTime(playMs(m));
    const tc = $('#toclock'), e = m.toOn && [...(m.log||[])].reverse().find(x => x.k === 'to'); if (tc && e) tc.textContent = fmtTime(Date.now() - e.t); }, 1000);
}

const nmLong = n => { const w = Math.max(...String(n).split(/\s+/).map(x => x.length)); return w > 11 ? ' long xl' : w > 9 ? ' long' : ''; };

function finalSets(m){ const x = /^(\d+)-(\d+)$/.exec(m.score||''); return x ? {w:+x[1], l:+x[2]} : setsWon(m); }

  </div>`;
}
// Per set: how many rallies were played with the player on court, and +/- in them.
function setCourt(m){
  const out = {}; let on = false;
  (m.log||[]).forEach(e => {
    const o = out[e.set] || (out[e.set] = {rallies:0, onR:0, pm:0});
    if (e.k === 'on') on = true;
    else if (e.k === 'off') on = false;
    else if ((e.k === 'us' || e.k === 'them') && !e.late){ o.rallies++; if (on){ o.onR++; o.pm += e.k === 'us' ? 1 : -1; } }
  });
  return out;
}
function setCards(m, a){
  const court = setCourt(m);
  const sets = Object.keys(a.score).map(Number).filter(s => { const c = counts(m, s), x = a.score[s]; return x.us || x.them || pts(c) || errs(c); }).sort((x,y)=>x-y);
  if (!sets.length) return '';
  return `<section class="sec"><div class="sec-h"><h3>Set by set</h3></div>${sets.map(s => {
    const c = counts(m, s), x = a.score[s], cr = court[s] || {rallies:0, onR:0, pm:0};
    const ended = (m.ended||[]).includes(s);
    const res = ended ? (x.us > x.them ? 'won' : x.them > x.us ? 'lost' : 'tied') : 'not finished';
    const p = pts(c), e = errs(c), good = listOf(c, ['dig','pass','assist','serve','att']);
    const onTxt = !cr.rallies ? '' : cr.onR === cr.rallies ? 'On court the whole set' : cr.onR ? `On court for ${cr.onR} of ${cr.rallies} rallies` : 'On the bench this set';
    return `<div class="setc">
      <div class="setc-h"><b>Set ${s}</b><span>${x.us}–${x.them} ${res}</span></div>
      ${typedOnly(m, s) ? TYPED : `<p>${p ? `<b>${p} point${p>1?'s':''}</b>: ${listOf(c, PT_KEYS)}` : 'No points'}</p>
      ${good ? `<p class="m">Good plays: ${good}</p>` : ''}
      <p class="m">${e ? `${e} error${e>1?'s':''}: ${listOf(c, ERR_KEYS)}` : 'No errors'}</p>
      ${onTxt ? `<p class="m">${onTxt}${cr.onR ? ` · <span class="${pmClass(cr.pm)}">${fmtPM(cr.pm)}</span>` : ''}</p>` : ''}`}
      ${toLine(m, a, s)}
    </div>`; }).join('')}</section>`;
}
// a set whose score was only typed in (arrived late / Fix score) and nothing was tapped
const typedOnly = (m, s) => { const es = (m.log||[]).filter(e => e.set === s && (e.k === 'us' || e.k === 'them' || BYK[e.k])); return es.length > 0 && es.every(e => e.late); };
const TYPED = '<p class="m">Score typed in (missed). No stats for this set.</p>';
// "Time-outs: Us at 12–15, Them at 20–18" for one set (the score when it was called), '' when none
// and what the next five rallies gave after it ("then 3–2")
function toLine(m, a, s){
  const log = m.log||[];
  const after = e => { const nx = log.slice(log.indexOf(e) + 1).filter(x => x.set === s && !x.late && (x.k === 'us' || x.k === 'them')).slice(0, 5);
    return nx.length ? ` (then ${nx.filter(x => x.k === 'us').length}–${nx.filter(x => x.k === 'them').length})` : ''; };
  const t = a.feed.filter(f => f.e.k === 'to' && f.e.set === s).map(f => `${f.e.side === 'us' ? homeName(m) : m.opp} at ${f.us}–${f.them}${after(f.e)}`);
  return t.length ? `<p class="m">Time-out${t.length > 1 ? 's' : ''}: ${esc(t.join(', '))}</p>` : '';
}
// sets that were watched: a set only typed in (arrived late) does not lower the per-set average
function setsPlayed(m){ const a = analyze(m); return scoredSets(a.score).filter(s => !typedOnly(m, s)).length || 1; }

/* ---------- team flow: who served, side-out, where the points came from, runs ---------- */
// The first server of a set: chosen on the live screen (m.serve[set]), or read from the first rally
// (our ace / serve in / serve error = we served; our reception = they served). null = not known.
function firstServer(m, s){
  if (m.serve && m.serve[s]) return m.serve[s];
  for (const e of (m.log||[])){
    if (e.set !== s || e.late) continue;
    if (e.k === 'us' || e.k === 'them') return null;
    if (['ace','serve','serr'].includes(e.k)) return 'us';
    if (['pass','rerr'].includes(e.k)) return 'them';
  }
  return null;
}
// The team serving now: the winner of the last rally (the first server before any). null after typed-in points.
function servingNow(m, s){
  const p = (m.log||[]).filter(e => e.set === s && (e.k === 'us' || e.k === 'them'));
  if (!p.length) return firstServer(m, s);
  return p[p.length-1].late ? null : p[p.length-1].k;
}
// Side-out: rallies won when the other team served. Break points: rallies won on our own serve.
// The server of each rally is the winner of the one before; typed-in points break the chain until the next rally.
function serveStats(m){
  const sets = {}, tot = {so:0, soOf:0, bp:0, bpOf:0};
  scoredSets(analyze(m).score).forEach(s => {
    const first = firstServer(m, s); if (!first) return;
    const r = sets[s] = {so:0, soOf:0, bp:0, bpOf:0}; let cur = first;
    (m.log||[]).forEach(e => {

      if (e.late){ cur = null; return; }
      if (cur === 'us'){ r.bpOf++; if (e.k === 'us') r.bp++; }
      else if (cur === 'them'){ r.soOf++; if (e.k === 'us') r.so++; }
      cur = e.k;
    });
    Object.keys(tot).forEach(k => tot[k] += r[k]);

  return {sets, tot};
}
// Where the points came from: earned = our point stats; the rest of our points were their errors.
// Given = our errors; the rest of their points they earned. Typed-in points are left out.
function pointSources(m){
  const c = counts(m); let us = 0, them = 0;
  (m.log||[]).forEach(e => { if (e.late) return; if (e.k === 'us') us++; else if (e.k === 'them') them++; });
  return {earned:pts(c), theirErr:Math.max(0, us - pts(c)), given:errs(c), theyEarned:Math.max(0, them - errs(c))};
}
// Hitting efficiency (kills - errors) / attempts, as volleyball writes it: .364, -.111
const attempts = c => c.kill + c.plase + c.aerr + c.att;
const effNum = c => attempts(c) ? (c.kill + c.plase - c.aerr) / attempts(c) : null;
const fmtEff = c => { const v = effNum(c); return v == null ? '–' : v.toFixed(3).replace(/^(-?)0\./, '$1.'); };
// The longest run of points in a row for each team in one set
function runs(m, s){
  const best = {us:0, them:0}; let cur = null, n = 0;
  (m.log||[]).forEach(e => {
    if (e.set !== s || (e.k !== 'us' && e.k !== 'them')) return;
    if (e.late){ cur = null; n = 0; return; }
    if (e.k === cur) n++; else { cur = e.k; n = 1; }
    best[cur] = Math.max(best[cur], n);
  });
  return best;
}
const sumKeys = (list, keys) => list.reduce((t, x) => { keys.forEach(k => t[k] = (t[k]||0) + (x[k]||0)); return t; }, {});
// Side-out / break points / serves in, and where the points came from: one block for a match or a season
function flowHTML(ms){
  const sv = sumKeys(ms.map(m => serveStats(m).tot), ['so','soOf','bp','bpOf']);
  const ps = sumKeys(ms.map(pointSources), ['earned','theirErr','given','theyEarned']);
  const serr = ms.reduce((t, m) => t + counts(m).serr, 0);
  const row = (l, a, b, n) => `<div class="pr"><span class="pl">${l}<small>${b ? `${a} of ${b} · ${n}` : 'not known yet'}</small></span><b>${b ? pct100(a, b) + '%' : '–'}</b><span class="pbar" aria-hidden="true"><i style="width:${b ? pct100(a, b) : 0}%"></i></span></div>`;
  const ratio = ps.given ? (ps.earned / ps.given).toFixed(1) : '–';
  return `<section class="sec"><div class="sec-h"><h3>Team flow</h3><span class="note">from the rally score</span></div>
  <div class="pct">
    ${row('Side-out', sv.so, sv.soOf, 'points won when they served')}
    ${row('Break points', sv.bp, sv.bpOf, 'points won on our serve')}
    ${row('Serves in', sv.bpOf - serr, sv.bpOf, 'every rally we served')}
  </div>
  ${sv.soOf + sv.bpOf ? '' : `<p class="note">Tap who serves first at the start of each set to see these.</p>`}
  <div class="tiles">
    <div class="tile hero"><b>${ps.earned}</b><span>Earned</span><em>our spikes, aces, blocks</em></div>
    <div class="tile"><b>${ps.theirErr}</b><span>Their errors</span><em>points given to us</em></div>
    <div class="tile"><b>${ps.given}</b><span>Our errors</span><em>points given away</em></div>
    <div class="tile"><b>${ps.theyEarned}</b><span>They earned</span><em>earned : given ${ratio}</em></div>
  </div></section>`;
}
// Per player: hitting (kills, errors, attempts, efficiency) and serving (aces, errors, in %, ace:error)
function attackServeHTML(rows, total){
  const hit = rows.filter(r => r.num && attempts(r.c)).sort((a,b) => attempts(b.c) - attempts(a.c));
  const srv = rows.filter(r => r.num && (r.c.ace + r.c.serve + r.c.serr)).sort((a,b) => (b.c.ace + b.c.serve + b.c.serr) - (a.c.ace + a.c.serve + a.c.serr));
  const inPct = c => c.serve ? pct100(c.ace + c.serve, c.ace + c.serve + c.serr) + '%' : '–';

    <tbody>${hit.map(r => `<tr><td>${esc(pLabel(r))}</td><td>${r.c.kill + r.c.plase}</td><td>${r.c.aerr}</td><td>${attempts(r.c)}</td><td class="k">${fmtEff(r.c)}</td></tr>`).join('')}
    <tr class="sum"><td>Team</td><td>${total.kill + total.plase}</td><td>${total.aerr}</td><td>${attempts(total)}</td><td>${fmtEff(total)}</td></tr></tbody></table></div></section>` : '')

    <div class="tbl"><table><thead><tr><th>Player</th><th>Aces</th><th>Err</th><th>In %</th><th>A:E</th></tr></thead>
    <tbody>${srv.map(r => `<tr><td>${esc(pLabel(r))}</td><td>${r.c.ace}</td><td>${r.c.serr}</td><td>${inPct(r.c)}</td><td class="k">${ae(r.c)}</td></tr>`).join('')}</tbody></table></div></section>` : '');

// Season leaders: the top three in each count; hitting needs 10 attempts
function leadersHTML(rows){
  const named = rows.filter(r => r.num);
  const cats = [['Points', r => pts(r.c), v => v], ['Spikes', r => r.c.kill + r.c.plase, v => v], ['Aces', r => r.c.ace, v => v], ['Blocks', r => r.c.block, v => v],
    ['Defences', r => r.c.dig, v => v], ['Receptions', r => r.c.pass, v => v], ['Hitting', r => attempts(r.c) >= 10 ? effNum(r.c) : null, (v, r) => fmtEff(r.c)]];
